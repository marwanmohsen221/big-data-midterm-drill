window.TOPICS = {
bigdata:{title:`Big Data & the 3Vs`,
lesson:`الـ **Big Data** هي داتا حجمها وتوزيعها وتنوعها وسرعة وصولها كبيرين لدرجة إن الـ **traditional databases** مش بتقدر تتعامل معاها، فمحتاجين **new technical architectures and analytics**. أشهر تعريف بيوصفها بـ 3 خصائص اسمهم **3Vs**.`,
points:[[`Volume`,`حجم الداتا (magnitude). ده اللي بيخلينا نحتاج تخزين موزّع زي HDFS.`],[`Variety`,`الداتا جاية من مصادر وأشكال كتير: structured و semi و unstructured.`],[`Velocity`,`الداتا بتيجي streaming وبتتجمع real time، فمحتاجين معالجة سريعة.`],[`McKinsey definition`,`scale, distribution, diversity, timeliness → محتاجة new architectures + analytic sandboxes + new tools + new analytical methods.`]],
hints:[[`magnitude / size`,`Volume`],[`variety of sources`,`Variety`],[`streamed / real time`,`Velocity`],[`traditional DB can handle big data`,`False`]]},

engines:{title:`MapReduce vs Spark vs Flink`,
lesson:`الجدول ده بيتسأل منه كتير، وكل سؤال بيعتمد على **كلمة واحدة**. اقرا الكلمة دي في السؤال واختار على أساسها. الـ 3 بيعملوا **batch**، والفرق في الـ real time والـ interactive والـ iterative.`,
points:[[`Execution model`,`الـ 3 = Batch. زيادة: Spark = **Near real time**، Flink = **Real time**. MapReduce = batch بس.`],[`Interactive analysis`,`MapReduce = **No support**. Spark و Flink = **Support**.`],[`Iterative processing`,`MapReduce = **Not suitable** (بيقرا من الـ disk كل لفة). Spark = **Suitable** (in memory). Flink = **Native**.`],[`MapReduce engine`,`batch processing system، الـ queries بتاخد دقايق، مناسب للـ offline use.`]],
hints:[[`real-time`,`Flink`],[`near real-time`,`Spark`],[`native iterative`,`Flink`],[`suitable for iterative / in memory`,`Spark`],[`no interactive / not suitable iterative / batch only`,`MapReduce`],[`supported by all three`,`Batch processing`]]},

patterns:{title:`Processing patterns, YARN & streaming`,
lesson:`بعد Hadoop ظهرت أنماط معالجة كتير بتشتغل عليه. السبب الحقيقي إن ده بقى ممكن هو **YARN** في Hadoop 2، لأنه بيسمح لأي distributed program (مش MapReduce بس) يشتغل على داتا الـ cluster. كل نمط ليه أدوات معينة لازم تربطها بيه.`,
points:[[`Interactive SQL`,`يستغنى عن MapReduce ويستخدم distributed query engine: daemons شغالة على طول (**Impala**) أو container reuse (**Hive on Tez**) → low latency SQL على داتا ضخمة.`],[`Iterative processing`,`خوارزميات زي ML بتلف كذا مرة، فالأفضل تخلي الـ working set في **memory**. MapReduce مايسمحش، Spark يسمح.`],[`Stream processing`,`**Storm, Spark Streaming, Samza**: حسابات real time على **unbounded streams**. مفيد لما محتاج lower latency أو تحديث incremental بدل batch jobs متكررة.`],[`Search`,`**Solr** بيعمل indexing للمستندات وهي داخلة HDFS ويرد على search queries. **ElasticSearch** كمان للـ information retrieval.`],[`YARN`,`Yet Another Resource Negotiator، Hadoop 2، cluster resource management + job scheduling.`],[`Why study MapReduce`,`لسه ليه مكان في الـ batch، وبيعلّمك مفاهيم عامة زي input formats وتقسيم الداتا.`]],
hints:[[`Impala / Hive on Tez / always-on daemons`,`Interactive SQL`],[`Storm / Samza / Spark Streaming / unbounded`,`Stream processing`],[`Solr / ElasticSearch / indexing`,`Search`],[`ML / hold working set in memory`,`Iterative (Spark)`],[`enabler of new processing models`,`YARN (Hadoop 2)`]]},

rdbms:{title:`MapReduce vs traditional RDBMS`,
lesson:`MapReduce **مكمّل** للـ RDBMS مش بديل. الـ RDBMS كويس في الـ **point queries/updates** على داتا indexed وصغيرة نسبيًا بسرعة. MapReduce كويس لما تحلل **الداتا كلها batch**. احفظ الجدول صف صف لأن الأسئلة بتبدّل الأعمدة.`,
points:[[`Data size`,`RDBMS = Gigabytes · MapReduce = Petabytes.`],[`Access`,`RDBMS = Interactive and batch · MapReduce = Batch.`],[`Updates`,`RDBMS = Read and write many times · MapReduce = **Write once, read many times**.`],[`Transactions`,`RDBMS = ACID · MapReduce = None.`],[`Structure`,`RDBMS = **Schema-on-write** (يتأكد قبل التخزين) · MapReduce = **Schema-on-read** (يفسّر الداتا وقت المعالجة، والتحميل مجرد file copy).`],[`Integrity`,`RDBMS = High · MapReduce = Low.`],[`Scaling`,`RDBMS = Nonlinear · MapReduce = **Linear**: داتا ×2 → وقت ×2، وداتا ×2 + cluster ×2 → نفس الوقت.`],[`Data types`,`**Structured** = defined format وpredefined schema (XML documents, DB tables) · **Semi-structured** = schema ممكن تكون موجودة بس بتتجاهل، دليل بس (spreadsheet) · **Unstructured** = مالوش internal structure (plain text, image).`],[`Normalization`,`بتحافظ على الـ integrity وتشيل التكرار، لكنها بتخلي قراءة record عملية **nonlocal**، وده ضد الـ streaming reads بتاعة Hadoop. الـ **web logs** مش normalized فمناسبة جدًا.`],[`Joins`,`Hadoop **يقدر** يعمل joins، بس مش بتستخدم بكترة زي RDBMS.`]],
hints:[[`point query / indexed / low latency / continually updated`,`RDBMS`],[`whole dataset / batch / write once read many`,`MapReduce`],[`interpret data at processing time`,`Schema-on-read`],[`XML documents / database tables`,`Structured (حسب السلايد)`],[`spreadsheet / schema used only as a guide`,`Semi-structured`],[`plain text / image`,`Unstructured`],[`web server logs`,`Not normalized → good for Hadoop`],[`double data + double cluster`,`Same speed`]]},

grid:{title:`Hadoop vs Grid computing (HPC)`,
lesson:`الـ HPC بيوزّع الشغل على أجهزة بتقرا من **shared file system على SAN** باستخدام **MPI**. ده كويس للـ compute-intensive، لكن مع مئات الـ GB تبقى **network bandwidth** هي الـ bottleneck والأجهزة تقعد فاضية. Hadoop حلها بـ **data locality**: يحط الحساب جنب الداتا.`,
points:[[`Programming level`,`Grid = data flow exposed by **low level** programming · Hadoop = **high level**.`],[`Failure handling`,`Grid/MPI = المبرمج بيدير **checkpointing and recovery** بنفسه (more control بس أصعب في الكتابة) · Hadoop = الـ **MapReduce engine** بيكتشف الـ failed tasks ويعيدها على أجهزة سليمة.`],[`Cost`,`Grid resources **highly expensive** · Hadoop أرخص (commodity hardware).`],[`Network`,`**Network bandwidth = most precious resource** في الـ data center. Hadoop بيحافظ عليها بـ **explicitly modeling network topology**.`],[`Partial failure`,`أصعب حاجة في الـ distributed computation: إنك ماتعرفش remote process وقع ولا لأ وتكمل برضه.`],[`Shared-nothing`,`الـ tasks مالهاش dependence على بعض، فترتيب تشغيلها مش مهم. استثناء بسيط: الـ reducer الفاشل محتاج عناية أكتر لأنه محتاج map outputs (أو يعيد تشغيل الـ maps).`]],
hints:[[`MPI / SAN / shared file system`,`Grid / HPC`],[`low level programming`,`Grid (مش MapReduce)`],[`programmer manages checkpointing`,`MPI / Grid`],[`most precious resource`,`Network bandwidth`],[`hardest aspect`,`Partial failure`],[`tasks have no dependence`,`Shared-nothing architecture`]]},

hadoop:{title:`Hadoop: definition, components, features`,
lesson:`Hadoop = **free software framework** للـ distributed processing لداتا كبيرة على **clusters of commodity hardware** بـ simple programming models. اتكتب بـ **Java** (والـ R, Python, Ruby ممكن). Hadoop 2 = **HDFS + YARN + MapReduce**. وفي HDFS فيه **NameNode** (metadata) و **DataNodes** (الداتا الفعلية).`,
points:[[`HDFS`,`high performance distributed file system (التخزين).`],[`YARN`,`job scheduling + cluster resource management.`],[`MapReduce`,`parallel processing بـ MapReduce model.`],[`Fault tolerance`,`لو node وقع الداتا ترجع من nodes تانية، والـ failures بتتعالج **automatically**.`],[`Reliability`,`بسبب الـ replication الداتا **stored reliably** رغم الأعطال.`],[`High availability`,`الداتا **accessible**، ولو جهاز وقع توصلها من **another path**.`],[`Scalability`,`**horizontal**: تضيف nodes **on the fly without downtime**.`],[`Economic`,`commodity hardware، مش محتاج specialized machines، وإضافة nodes من غير pre-planning كتير.`],[`Easy to use / Open source / Distributed processing / Data locality`,`الـ framework بيتعامل مع التوزيع · تقدر تعدل الكود حسب البيزنس · الداتا موزعة فبتتعالج parallel · الكود بيروح للداتا.`],[`NameNode`,`master، metadata بس: أسماء الملفات وأماكنها، تقسيمها لـ blocks، وأنهي DataNode شايل كل block. **لا يخزن الداتا**.`],[`DataNode`,`بيخزن الـ blocks على local disk، يخدم read/write، يبعت status للـ NameNode، ويعمل replication.`],[`Good for / Not good for`,`Good: massive data بالـ parallelism · variety of data · commodity hardware. Not good: transactions (random access) · شغل مش قابل للـ parallel · low latency · small files كتير · حسابات تقيلة على داتا قليلة.`]],
hints:[[`stored reliably / replication`,`Reliability`],[`accessed from another path`,`High availability`],[`recovered automatically`,`Fault tolerance`],[`on the fly / without downtime`,`Horizontal scalability`],[`commodity / no specialized machine`,`Economic`],[`modify code per business`,`Open source`],[`metadata / master`,`NameNode`],[`actual blocks`,`DataNode`],[`small files / low latency / transactions`,`Hadoop not good`]]},

mr:{title:`MapReduce framework`,
lesson:`MapReduce بيقسم الشغل لمرحلتين **map** و **reduce**، وكل مرحلة input و output بتوعها **key-value pairs** والمبرمج بيختار الأنواع. الـ **job** بيتقسم لـ **map tasks** و **reduce tasks** بتتجدول بـ YARN، ولو task وقع بيتعاد على node تاني.`,
points:[[`Mapper`,`برنامج صغير: يقرا جزء من الداتا، يفلتر/يحوّل، ويطلع stream من <key, value>. الـ framework بيبعته لكل جهاز عليه block.`],[`Shuffle`,`نقل وترتيب مخرجات الـ mappers للـ reducers حسب الـ key.`],[`Reducer`,`آخر مرحلة: يرتب و/أو يجمع كل الـ values لنفس الـ key، ويكتب الناتج على storage. **keys فريدة أكتر = parallelism أكتر**.`],[`Combiner`,`زي reduce function بتشتغل على **map output** عشان تقلل الداتا اللي بتتعمل لها shuffle، لأن MapReduce محدود بالـ bandwidth.`],[`Job`,`input data + MapReduce program + configuration information.`],[`Generic types`,`Mapper و Reducer كل واحد ليه **4 type parameters**: input key, input value, output key, output value.`]],
hints:[[`filter / transform / emit (k,v)`,`Mapper`],[`aggregate values per key / last part`,`Reducer`],[`minimize shuffled data / bandwidth`,`Combiner`],[`input + program + configuration`,`MapReduce job`],[`task fails`,`Rescheduled on a different node`],[`more unique keys`,`More parallelism`]]},

splits:{title:`Splits, block size & data locality`,
lesson:`Hadoop بيقسم الـ input لـ **input splits** بحجم ثابت، و**map task واحد لكل split**. splits صغيرة = load balancing أحسن، بس لو صغيرة أوي الـ overhead يغلب. الأفضل: **split = HDFS block = 128 MB** لأنه أكبر حجم مضمون يبقى على node واحد.`,
points:[[`Data-local (a)`,`الـ map task على نفس الـ node اللي عليه الـ block. الأفضل لأنه مايستهلكش bandwidth.`],[`Rack-local (b)`,`الـ nodes اللي عليها replicas مشغولة، فيدور على free slot في نفس الـ rack.`],[`Off-rack (c)`,`نادرًا: node في rack تاني → inter-rack network transfer.`],[`Split spanning two blocks`,`غالبًا مفيش node عليه الاتنين، فجزء يتنقل على الشبكة → أقل كفاءة.`],[`Map output`,`بيتكتب على **local disk** مش HDFS لأنه intermediate.`],[`Reduce tasks`,`**مالهمش data locality**، لأن input الـ reducer جاي من كل الـ mappers.`]],
hints:[[`same node`,`Data-local (a)`],[`same rack, other node`,`Rack-local (b)`],[`inter-rack transfer`,`Off-rack (c)`],[`optimal split size`,`HDFS block (128 MB)`],[`why split = block`,`Largest input guaranteed on a single node`],[`map output location`,`Local disk`],[`reduce data locality`,`None`]]},

input:{title:`InputFormat & RecordReader`,
lesson:`لقراءة الداتا فيه 3 classes: **InputFormat** (How: إزاي تتقرا وتتقسم)، **InputSplit** (What: أنهي جزء)، **RecordReader** (بيقرا فعلاً ويحوّل لـ key, value). كل InputFormat ليه key و value مختلفين، وده أكتر حاجة بتتسأل.`,
points:[[`TextInputFormat`,`**Default**. key = **byte offset** لبداية السطر (LongWritable)، value = السطر (Text). الـ offset التالي = السابق + طول السطر + 1. مثال: 0, 33, 57, 89.`],[`KeyValueTextInputFormat`,`key = كل حاجة لحد **أول tab**، value = باقي السطر. الـ separator قابل للتغيير وهو tab by default. مناسب لـ output الـ TextOutputFormat.`],[`NLineInputFormat`,`كل mapper ياخد **عدد ثابت N** من السطور (default N = 1). نفس key/value بتوع Text، الفرق في **construction of splits**.`],[`SequenceFileInputFormat`,`Binary، key و value **user-defined**.`],[`Text & KeyValue`,`كل mapper بياخد **variable** number of lines حسب حجم الـ split وطول السطور.`],[`Block vs Split`,`Block = **storage**، physical، 128MB، replicas. Split = **processing**، logical، mapper واحد، بيحترم حدود الـ records.`],[`Line across blocks`,`بيتبع الـ split اللي **بدأ فيه**، والـ LineRecordReader بيجيب الـ bytes الزيادة بس من الـ block التاني (مفيش duplicates ولا missing data).`]],
hints:[[`default InputFormat`,`TextInputFormat`],[`byte offset key`,`TextInputFormat / NLineInputFormat`],[`up to first tab`,`KeyValueTextInputFormat`],[`fixed number of lines per mapper`,`NLineInputFormat`],[`binary / user-defined key`,`SequenceFileInputFormat`],[`actually reads the data`,`RecordReader`],[`logical / one mapper`,`Split`],[`physical / storage / replicas`,`Block`]]},

seq:{title:`SequenceFile & the small file problem`,
lesson:`الـ **small file** = ملف أصغر بكتير من الـ block. المشكلة إن كل file وكل block بياخد **object (~150 bytes)** في RAM الـ NameNode، وكل ملف صغير بيعمل split و mapper لوحده. الحل: **SequenceFile** يجمعهم في ملف واحد (filename = key، content = value).`,
points:[[`NameNode objects`,`كل ملف = File object (name, path, permissions, owner, timestamps, block list) + Block object (ID, size, DataNodes). ملف صغير = 2 objects.`],[`Before`,`10,000 ملف × 2 = 20,000 object ≈ 3 MB، و ~10,000 mapper.`],[`After`,`1 GB SequenceFile = 1 file + 8 blocks = 9 objects ≈ 1.4 KB، و ~8 mappers.`],[`Scale`,`10 مليون ملف ≈ 3 GB من ذاكرة الـ NameNode، ومليار ملف مش ممكن.`],[`Why good for MapReduce`,`**splittable** (sync points)، **compression**، و **arbitrary types**.`]],
hints:[[`small file problem`,`SequenceFile`],[`objects per small file`,`2`],[`bytes per object`,`~150`],[`1 GB / 128 MB SequenceFile`,`9 objects`],[`sync points`,`Splittable`]]},

code:{title:`Word count code & serialization`,
lesson:`في الكود ركّز على ترتيب الـ generic types والـ driver methods. ~Mapper<Object, Text, Text, IntWritable>~ يعني input key, input value, output key, output value. وتذكّر: **Map OUT = Reduce IN**.`,
points:[[`Mapper word count`,`input key Object، input value Text (السطر)، output key Text (الكلمة)، output value IntWritable (1).`],[`Reducer word count`,`~Reducer<Text, IntWritable, Text, IntWritable>~: بيجمع الـ 1s لكل كلمة.`],[`setOutputKeyClass / setOutputValueClass`,`بيحددوا output types بتوع الـ **reduce**.`],[`setMapOutputKeyClass / ValueClass`,`بس لو output الـ map **مختلف** عن output الـ reduce.`],[`setCombinerClass`,`بتحدد الـ combiner (في المثال ممكن نستخدم نفس الـ reducer).`],[`Serialization`,`object → byte stream (للشبكة أو التخزين). Deserialization = العكس. Hadoop بيستخدمها في **RPC** (interprocess communication) و persistent storage.`],[`Writable`,`IntWritable و Text بدل int و String لأن **Java Serializable تقيلة**، والـ Writable خفيفة.`]],
hints:[[`4th generic parameter`,`Output value`],[`reduce input types`,`= map output types`],[`map output type differs`,`setMapOutputKeyClass / setMapOutputValueClass`],[`interprocess communication`,`RPC + serialization`],[`why IntWritable not int`,`Serializable too heavy; Writable light`]]},

side:{title:`Side data & distributed cache`,
lesson:`الـ **side data** = داتا إضافية **read-only** الـ job محتاجها عشان يعالج الداتا الأساسية (زي لستة مدن مسموحة أو ملف أسماء العملاء). فيه طريقتين: **Job Configuration** للحاجات الصغيرة، و **Distributed cache** للملفات الأكبر.`,
points:[[`Job configuration`,`تعمل set لـ key-value في Configuration وتقراها في الـ task بـ context.getConfiguration() (غالبًا في setup()). بتخزن **Strings بس** → serialize بنفسك أو **DefaultStringifier**.`],[`Limit`,`ماتبعتش أكتر من **few KB**: الـ configuration بتتقرا من الـ client والـ application master والـ task JVM، وكل مرة كل الـ entries تدخل الـ memory.`],[`Distributed cache`,`يـ copy الملفات للـ task nodes قبل التشغيل، **once per job** لكل node لتوفير bandwidth. الملف بعد النسخ = **localized**. مناسب للـ **lookup files**.`],[`Steps`,`(1) copy الملف لـ HDFS (2) setup job configuration.`],[`Size`,`**10 GB default**، يتظبط في **mapred-site.xml**.`],[`Reference count`,`+1 قبل الـ task، −1 بعدها، والملف ينفع يتمسح لما الـ count = 0.`],[`setup()`,`init function للـ Mapper/Reducer تجهز resources (زي قراية ملف الـ cache في HashMap).`]],
hints:[[`extra read-only data`,`Side data`],[`small metadata / few KB`,`Job configuration`],[`Strings only / objects`,`DefaultStringifier`],[`lookup files`,`Distributed cache`],[`copied once per job`,`Distributed cache`],[`10 GB / mapred-site.xml`,`Distributed cache size`],[`count reaches zero`,`Eligible for deletion`]]},

join:{title:`Joins in MapReduce`,
lesson:`MapReduce يقدر يعمل join بين datasets كبيرة، بس كتابته من الصفر معقدة، فالأحسن أدوات زي **Pig, Hive, Spark**. لو الـ join في الـ mapper = **map-side join**، لو في الـ reducer = **reduce-side join**.`,
points:[[`Map-side join`,`الـ join في الـ map phase. **لازم** input كل map يكون **partitioned and sorted by key**. أكفأ.`],[`Reduce-side join`,`أسهل وأعم (الـ input مش محتاج structure معين)، لكن **less efficient** لأن الـ datasets الاتنين بيعدّوا على الـ **shuffle**.`],[`How reduce join works`,`الـ mapper بيعمل **tag** لكل record بمصدره ("cname" أو "camount")، ويستخدم الـ **join key** كـ map output key، فالـ records بنفس الـ key تتجمع عند نفس الـ reducer.`],[`Example`,`mapper1 → [4000001, cname Kristina]، mapper2 → [4000001, camount 40.33]. بعد الـ shuffle: {4000001 – [cname kristina, camount 40.33, …]} والـ reducer يطلع الاسم + الإجمالي.`],[`Driver`,`~MultipleInputs.addInputPath~ لكل dataset بالـ mapper بتاعه.`]],
hints:[[`input partitioned & sorted`,`Map-side join`],[`easier / more general`,`Reduce-side join`],[`less efficient / both datasets shuffled`,`Reduce-side join`],[`tag each record with source`,`Reduce-side join mapper`],[`MultipleInputs`,`Reduce join driver`]]}
};

window.QUESTIONS.push(
/* ───────────── SET 8 — Midterm Fall 2024, Q1–15 ───────────── */
{s:8,t:'m',fix:true,tp:'yarn',q:`How does the ApplicationMaster communicate with the ResourceManager?`,
o:[`Via direct database queries`,`Through RPC (Remote Procedure Call)`,`Using shared files`,`Through email notifications`],a:1,
ex:`في Hadoop، الـ **interprocess communication** بين الـ nodes بيتعمل بـ **RPC (Remote Procedure Calls)**. الـ RPC protocol بيعمل **serialization** للرسالة لـ binary stream ويبعتها للـ remote node اللي بيعمل deserialization. والـ ApplicationMaster بيطلب resources (containers) من الـ ResourceManager بالطريقة دي. الإجابة المعلّمة في الامتحان (b) **صح**.`,
w:[`غلط — مفيش database بين مكونات YARN.`,`صح — RPC هو أسلوب الـ interprocess communication في Hadoop.`,`غلط — shared files أسلوب HPC (SAN).`,`غلط — اختيار مش منطقي.`],
tip:`أي "communicate between nodes / components" في Hadoop → RPC.`,src:`Midterm Fall 2024 · Q1 · Lecture 4 · Serialization (RPC)`},

{s:8,t:'m',fix:true,tp:'seq',q:`What is a key characteristic of SequenceFileInputFormat?`,
o:[`It is used for unstructured text`,`It processes files line by line`,`It provides a way to store binary key-value pairs`,`It integrates with SQL databases`],a:2,
ex:`جدول الـ InputFormat: **SequenceFileInputFormat** = **A Hadoop-specific high-performance binary format**، الـ key و الـ value **user-defined**، و File type = **Binary**. والـ sequence file **stores sequences of binary key-value pairs**. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — ده binary مش text.`,`غلط — "line by line" ده TextInputFormat.`,`صح.`,`غلط — مالوش علاقة بـ SQL.`],
tip:`SequenceFile = Binary key-value.`,src:`Midterm Fall 2024 · Q2 · Lecture 4 · InputFormat table`},

{s:8,t:'m',fix:true,tp:'mr',q:`In MapReduce, which component is responsible for processing input splits?`,
o:[`Reducer`,`Combiner`,`Partition`,`Mapper`],a:3,
ex:`السلايد: **Hadoop creates one map task for each split, which runs the user-defined map function for each record in the split.** يعني الـ **Mapper** هو اللي بيعالج الـ input split. الإجابة المعلّمة (d) **صح**.`,
w:[`غلط — الـ reducer بياخد output الـ mappers مش الـ splits.`,`غلط — الـ combiner بيشتغل على map output.`,`غلط — الـ partition بيوزّع map output على الـ reducers.`,`صح — 1 split = 1 map task.`],
tip:`Split → Mapper.`,src:`Midterm Fall 2024 · Q3 · Lecture 3 · Data Flow`},

{s:8,t:'m',fix:true,tp:'join',q:`Suppose we have two very large files and we want to join data between them. What is a suitable approach for this case?`,
o:[`Traditional database SQL`,`Distributed cache`,`MapReduce join`,`All of the above`],a:2,
ex:`السلايد: **If both datasets are too large for either to be copied to each node in the cluster, we can still join them using MapReduce with a map-side or reduce-side join.** الـ **distributed cache** مناسب لما dataset واحدة صغيرة (lookup file) تتنسخ على كل node، مش لما الاتنين كبار. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — الـ traditional DB مش بيتعامل مع Big Data.`,`غلط — الـ distributed cache لما واحد من الملفين صغير.`,`صح — map-side أو reduce-side join.`,`غلط — مش كلهم مناسبين.`],
tip:`الاتنين كبار → MapReduce join. واحد صغير (lookup) → distributed cache.`,src:`Midterm Fall 2024 · Q4 · Lecture 5 · Join in MapReduce`},

{s:8,t:'m',fix:true,tp:'rdbms',q:`What challenge is often faced when updating data in Hadoop?`,
o:[`Slow transaction speeds`,`Complexity of schema on write`,`Data redundancy`,`Limited support for real-time updates`],a:3,
ex:`Hadoop مبني على **write once, read many times**، والـ RDBMS هو اللي مناسب لـ **datasets that are continually updated**. وكمان Hadoop **not good for transactions (random access)**. يعني تحديث الداتا في Hadoop صعب ومش real time. الإجابة المعلّمة (d) **صح**.`,
w:[`غلط — Hadoop مالوش transactions أصلاً (None).`,`غلط — Hadoop بيستخدم schema-on-read مش on-write.`,`غلط — مش ده التحدي الأساسي في التحديث.`,`صح.`],
tip:`Update in Hadoop → problem (write once read many).`,src:`Midterm Fall 2024 · Q5 · Lecture 2 · MapReduce vs RDBMS`},

{s:8,t:'m',fix:true,tp:'rdbms',q:`How does Hadoop's scalability impact its performance when processing large datasets?`,
o:[`Decreases performance due to distributed nature`,`Increases performance by handling data in parallel`,`No impact on performance`,`Limits performance to small datasets`],a:1,
ex:`MapReduce **scales linearly**: الداتا partitioned و map و reduce بيشتغلوا **in parallel on separate partitions**. لو زودت nodes (horizontal scalability) الأداء بيزيد. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — التوزيع هو سبب السرعة.`,`صح.`,`غلط.`,`غلط — Hadoop للداتا الكبيرة.`],
tip:`Scalability + parallel = better performance.`,src:`Midterm Fall 2024 · Q6 · Lecture 2/3`},

{s:8,t:'m',fix:true,tp:'rdbms',q:`Which system is more efficient at processing complex queries on structured data?`,
o:[`Hadoop MapReduce`,`Traditional databases`,`Both are equally efficient`,`Neither is efficient`],a:1,
ex:`الـ **structured data** = **the realm of the RDBMS**. والـ RDBMS كويس للـ **point queries or updates** على داتا indexed بـ low latency. MapReduce batch والـ queries بتاخد دقايق. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — MapReduce للـ batch على الداتا كلها.`,`صح.`,`غلط.`,`غلط.`],
tip:`Structured + complex/point queries → Traditional DB.`,src:`Midterm Fall 2024 · Q7 · Lecture 2 · MapReduce vs RDBMS`},

{s:8,t:'m',fix:true,tp:'yarn',q:`Why is YARN considered more flexible than earlier versions of Hadoop?`,
o:[`It supports only Java applications`,`It allows multiple frameworks to run concurrently`,`It requires less hardware`,`It simplifies the user interface`],a:1,
ex:`السلايد: **YARN is a cluster resource management system, which allows any distributed program (not just MapReduce) to run on data in a Hadoop cluster.** يعني Spark و Flink و MapReduce وغيرهم يشتغلوا مع بعض على نفس الـ cluster. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — "only" فخ؛ YARN بيشغّل أي distributed program.`,`صح.`,`غلط.`,`غلط.`],
tip:`YARN flexible = any distributed program, not just MapReduce.`,src:`Midterm Fall 2024 · Q8 · Lecture 2 · YARN`},

{s:8,t:'m',fix:true,tp:'rdbms',q:`Which of the following best describes "schema on write"?`,
o:[`Data schema is applied during reading`,`Data schema is applied during writing`,`Data can be stored in any format`,`Data integrity is ignored`],a:1,
ex:`**Schema-on-write** (زي الـ databases): الـ schema بتتطبق **at write time**، يعني validate and enforce قبل ما الداتا تتخزن. **Schema-on-read** (Hadoop): خزّن الأول وفسّر وقت القراءة. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — ده schema-on-read.`,`صح.`,`غلط — ده وصف schema-on-read (flexible).`,`غلط — العكس، schema-on-write بتضمن integrity عالية.`],
tip:`on-WRITE = during writing (DB). on-READ = during reading (Hadoop).`,src:`Midterm Fall 2024 · Q9 · Lecture 2`},

{s:8,t:'m',fix:true,tp:'rdbms',q:`What is a potential drawback of using schema on read?`,
o:[`Lack of flexibility`,`Increased data processing complexity`,`Fixed data structure`,`Reduced data analysis capabilities`],a:1,
ex:`ميزة schema-on-read: **flexibility** و fast ingestion. عيبها: **more work at read time** ومفيش guarantees على جودة الداتا، فلازم تتعامل مع الـ schema وقت المعالجة → **increased processing complexity**. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — الـ flexibility ميزتها مش عيبها.`,`صح.`,`غلط — fixed structure = schema-on-write.`,`غلط.`],
tip:`Schema-on-read drawback = more work at read time / complexity.`,src:`Midterm Fall 2024 · Q10 · Schema-on-Write vs Schema-on-Read`},

{s:8,t:'m',fix:true,tp:'rdbms',q:`How does Hadoop handle data integrity compared to traditional databases?`,
o:[`By using centralized control`,`Through distributed data storage`,`With weaker guarantees than traditional databases`,`By enforcing strict schema on write`],a:2,
ex:`جدول المقارنة: **Integrity → RDBMS = High، MapReduce = Low**. Hadoop مش بيعمل validation وقت التخزين (schema-on-read) ومالوش ACID. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — Hadoop distributed مش centralized.`,`غلط — التوزيع مش طريقة لضمان الـ integrity.`,`صح — Integrity Low.`,`غلط — ده RDBMS.`],
tip:`Integrity: DB High · Hadoop Low (weaker guarantees).`,src:`Midterm Fall 2024 · Q11 · Lecture 2`},

{s:8,t:'m',fix:true,tp:'yarn',q:`……… rejects any application that requests unsatisfiable resources for its Application Master.`,
o:[`application manager`,`scheduler`,`container`,`node manager`],a:1,
ex:`في YARN، الـ **ResourceManager** فيه **scheduler** بيوزّع الـ resources على التطبيقات. لو تطبيق طلب resources مستحيل تتوفر لـ ApplicationMaster بتاعه (مثلاً memory أكبر من الحد)، الـ **scheduler rejects** الطلب. الإجابة المعلّمة (b) **صح** (من كتاب Hadoop: The Definitive Guide؛ مش مشروح بالتفصيل في السلايدز).`,
w:[`غلط — الـ applications manager بيقبل الـ jobs ويشغّل الـ AM، مش هو اللي بيرفض بسبب الـ resources.`,`صح.`,`غلط — الـ container وحدة resources، مش بيرفض.`,`غلط — الـ node manager بيدير node واحد.`],
tip:`rejects unsatisfiable resources → scheduler.`,src:`Midterm Fall 2024 · Q12 · YARN (Definitive Guide)`},

{s:8,t:'m',fix:true,tp:'engines',q:`What is a significant disadvantage of using MapReduce?`,
o:[`Low fault tolerance`,`In-memory processing`,`High I/O operations`,`Real-time processing`],a:2,
ex:`MapReduce بيقرا من الـ **disk** ويكتب عليه في كل مرحلة (map output على local disk، وكل iteration تحمّل من الـ disk تاني). السلايد: في الـ iterative، بدل ما **loading from disk on each iteration**، Spark بيحتفظ بالداتا in memory. عشان كده عيب MapReduce = **High I/O**. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — الـ fault tolerance من مميزات Hadoop.`,`غلط — in-memory ميزة Spark.`,`صح.`,`غلط — MapReduce batch مش real time.`],
tip:`MapReduce disadvantage = disk / high I/O. Spark advantage = in memory.`,src:`Midterm Fall 2024 · Q13 · Lecture 2 · Iterative processing`},

{s:8,t:'m',fix:true,tp:'engines',q:`Which platform offers native support for iterative algorithms?`,
o:[`MapReduce`,`Apache Flink`,`Apache Spark`,`All of the above`],a:1,
ex:`جدول MapReduce vs Spark vs Flink: Iterative → MapReduce **Not suitable**، Spark **Suitable**، Flink **Native**. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط.`,`صح — Native = Flink.`,`غلط — Spark "suitable" مش "native".`,`غلط.`],
tip:`Native iterative → Flink.`,src:`Midterm Fall 2024 · Q14 · Lecture 2`},

{s:8,t:'m',fix:true,tp:'engines',q:`Which framework is known for its ability to handle real-time data processing?`,
o:[`MapReduce`,`Apache Flink`,`Apache Spark`,`None of the above`],a:1,
ex:`**تنبيه:** ورقة الامتحان معلّمة **c. Apache Spark**، لكن جدول السلايد بيقول: Spark = **Near real time** و Flink = **Real time**. يعني حسب سلايدات الدكتور الإجابة **b. Flink**. لو السؤال اتكتب "near real-time" يبقى Spark.`,
w:[`غلط — batch بس.`,`صح حسب السلايد — Real time processing.`,`غلط حسب السلايد — Near real time. (دي اللي متعلّمة في الورقة.)`,`غلط.`],
tip:`Real time → Flink · Near real time → Spark.`,src:`Midterm Fall 2024 · Q15 · Lecture 2 · MapReduce vs Spark vs Flink`},

/* ───────────── SET 9 — Midterm Fall 2024, Q16–25 + 5 new ───────────── */
{s:8,t:'m',fix:true,tp:'grid',q:`Which of the following is the correct statement?`,
o:[`Data locality means moving computation to data instead of data to computation`,`Data locality means moving data to computation instead of computation to data`,`Both the above`,`None of the above`],a:0,
ex:`ميزة Data Locality: **this algorithm is moved to data in the cluster rather than bringing data to the location where the algorithm is submitted**. الكود صغير والداتا ضخمة، فننقل الكود. الإجابة المعلّمة (a) **صح**.`,
w:[`صح.`,`غلط — معكوسة.`,`غلط — الاتنين عكس بعض.`,`غلط.`],
tip:`Data locality = computation → data.`,src:`Midterm Fall 2024 · Q16 · Lecture 3 · Features of Hadoop`},

{s:8,t:'m',fix:true,tp:'engines',q:`Which of these is NOT a typical use case for Apache Spark?`,
o:[`Machine learning`,`Graph processing`,`Real-time video processing`,`Batch processing`],a:2,
ex:`Spark بيستخدم في الـ **batch** والـ **iterative** (زي **machine learning**) وكمان graph processing (مكتبة GraphX). أما الـ **real-time** فـ Spark **near real time** بس، والـ real-time video processing مش use case نموذجي ليه. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — ML من أشهر استخدامات Spark (iterative in memory).`,`غلط — Spark بيعمل graph processing.`,`صح — real time مش نقطة قوة Spark.`,`غلط — Spark بيدعم batch.`],
tip:`Spark: batch + ML/iterative + near real time. "Real-time" → مش Spark.`,src:`Midterm Fall 2024 · Q17 · Lecture 2`},

{s:8,t:'m',fix:true,tp:'splits',q:`What is the primary advantage of data-local map tasks in Hadoop?`,
o:[`Reduced network congestion`,`Increased data transformation speed`,`Simplified task scheduling`,`Enhanced security protocols`],a:0,
ex:`السلايد: Hadoop **does its best to run the map task on a node where the input data resides in HDFS, because it doesn't use valuable cluster bandwidth.** يعني data-local = الداتا مش بتتنقل على الشبكة = **less network congestion**. الإجابة المعلّمة (a) **صح**.`,
w:[`صح.`,`غلط — الـ transformation نفسها نفس السرعة.`,`غلط — الجدولة مش أبسط.`,`غلط — مالهاش علاقة بالأمان.`],
tip:`Data-local → saves bandwidth → less network congestion.`,src:`Midterm Fall 2024 · Q18 · Lecture 3 · Data locality`},

{s:8,t:'m',fix:true,tp:'splits',q:`What is the impact of running a map task off-rack?`,
o:[`Increased data processing speed`,`Improved fault tolerance`,`Higher network bandwidth usage`,`Reduced computational power`],a:2,
ex:`السلايد: لما مفيش node فاضي في نفس الـ rack **an off-rack node is used, which results in an inter-rack network transfer.** نقل الداتا بين الـ racks = **more network bandwidth**. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — العكس، أبطأ.`,`غلط.`,`صح — inter-rack transfer.`,`غلط — الـ CPU زي ما هو.`],
tip:`Off-rack → inter-rack transfer → higher bandwidth usage.`,src:`Midterm Fall 2024 · Q19 · Lecture 3 · Data locality`},

{s:8,t:'m',fix:true,tp:'splits',q:`When is it most beneficial to execute an off-rack map task?`,
o:[`When data is highly distributed`,`During peak network usage`,`When local resources are exhausted`,`In a single-node cluster`],a:2,
ex:`الترتيب: data-local أولاً، لو كل الـ nodes اللي عليها replicas مشغولة → rack-local، و**very occasionally even this is not possible, so an off-rack node is used**. يعني off-rack بس لما الـ local resources (data-local و rack-local) **exhausted**. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط.`,`غلط — وقت الذروة أسوأ وقت تنقل داتا بين racks.`,`صح.`,`غلط — single-node مفيهوش racks تانية.`],
tip:`Off-rack = last resort when local slots are busy.`,src:`Midterm Fall 2024 · Q20 · Lecture 3 · Data locality`},

{s:8,t:'m',fix:true,tp:'splits',q:`What is a potential trade-off when prioritizing rack-local tasks over data-local tasks?`,
o:[`Reduced data security`,`Lower computational efficiency`,`Increased task scheduling complexity`,`Higher network latency`],a:3,
ex:`في الـ **rack-local** الـ block على node تاني في نفس الـ rack، فلازم الداتا تتنقل على الشبكة داخل الـ rack. ده أحسن من off-rack، لكن أبطأ من data-local بسبب **network latency**. الإجابة المعلّمة (d) **صح**.`,
w:[`غلط.`,`غلط — الحساب نفسه زي ما هو.`,`غلط.`,`صح.`],
tip:`rack-local vs data-local → network latency.`,src:`Midterm Fall 2024 · Q21 · Lecture 3 · Data locality`},

{s:8,t:'m',fix:true,tp:'hadoop',q:`Which of the following is NOT a use case for Hadoop?`,
o:[`Intensive calculations with little data`,`Massive amounts of data through parallelism`,`Processing a variety of data formats`,`Using inexpensive commodity hardware`],a:0,
ex:`سلايد Why & where Hadoop is used / not used: **Not good for intensive calculations with little data**. الباقي (massive data، variety، commodity hardware) من قايمة **good for**. الإجابة المعلّمة (a) **صح**.`,
w:[`صح — not good for.`,`غلط — good for.`,`غلط — good for.`,`غلط — good for.`],
tip:`little data / small files / low latency / transactions → NOT Hadoop.`,src:`Midterm Fall 2024 · Q22 · Lecture 4`},

{s:8,t:'m',fix:true,tp:'hadoop',q:`What kind of workloads is Hadoop best suited for?`,
o:[`Workloads that cannot be parallelized`,`Low latency real-time processing`,`Large-scale batch processing`,`Intensive calculations with small datasets`],a:2,
ex:`MapReduce **is a good fit for problems that need to analyze the whole dataset in a batch fashion** و Hadoop good for **massive amounts of data through parallelism**. الإجابة المعلّمة (c) **صح**.`,
w:[`غلط — not good when work cannot be parallelized.`,`غلط — not good for low latency.`,`صح.`,`غلط — not good for little data.`],
tip:`Hadoop best = large-scale batch.`,src:`Midterm Fall 2024 · Q23 · Lecture 2/4`},

{s:8,t:'m',fix:true,tp:'hadoop',q:`For which of the following is Hadoop NOT recommended?`,
o:[`Processing structured and unstructured data`,`Low latency data access`,`Parallel processing of large datasets`,`Using inexpensive hardware`],a:1,
ex:`Hadoop **not good for low latency data access**. الباقي كلهم من مميزاته. الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — good for variety of data.`,`صح.`,`غلط — دي أساس Hadoop.`,`غلط — commodity hardware ميزة.`],
tip:`Low latency → NOT Hadoop.`,src:`Midterm Fall 2024 · Q24 · Lecture 4`},

{s:8,t:'m',fix:true,tp:'join',q:`In ……, the basic idea is that the mapper tags each record with its source and uses the join key as the map output key.`,
o:[`map side join`,`reduce side join`,`SQL query`],a:1,
ex:`السلايد (Reduce join): **The basic idea is that the mapper tags each record with its source and uses the join key as the map output key, so that the records with the same key are brought together in the reducer.** الإجابة المعلّمة (b) **صح**.`,
w:[`غلط — في الـ map-side الـ join بيحصل في الـ mapper نفسه والـ input لازم partitioned and sorted.`,`صح.`,`غلط.`],
tip:`tags each record with its source → reduce side join.`,src:`Midterm Fall 2024 · Q25 · Lecture 5 · Reduce join`},

{s:9,t:'m',tp:'input',q:`A developer wants each mapper to process exactly 100 lines of a log file. Which InputFormat should be used?`,
o:[`TextInputFormat`,`KeyValueTextInputFormat`,`NLineInputFormat with N = 100`,`SequenceFileInputFormat`],a:2,
ex:`مع TextInputFormat و KeyValueTextInputFormat كل mapper بياخد **variable number of lines**. لو عايز **fixed number** استخدم **NLineInputFormat** وظبط ~mapreduce.input.lineinputformat.linespermap~ = 100.`,
w:[`غلط — عدد السطور متغير حسب حجم الـ split.`,`غلط — برضه variable.`,`صح.`,`غلط — ده للـ binary.`],
tip:`exactly N lines per mapper → NLineInputFormat.`,src:`Lecture 4 · NLineInputFormat`},

{s:9,t:'m',tp:'seq',q:`You must process one million 50 KB images in Hadoop. What is the best approach to reduce NameNode memory and the number of map tasks?`,
o:[`Increase the HDFS block size to 1 GB`,`Pack the images into a SequenceFile (file name as key, content as value)`,`Store each image in the distributed cache`,`Use NLineInputFormat`],a:1,
ex:`ده **small file problem**: كل ملف = 2 objects في RAM الـ NameNode، وكل ملف split و mapper لوحده. الحل اللي في السلايد: **SequenceFile** يجمع الملفات الصغيرة في ملف كبير واحد (**filename = key، content = value**)، فعدد الـ objects والـ mappers يقل جدًا، والملف splittable و compressed.`,
w:[`غلط — كل صورة لسه ملف منفصل بـ objects وsplit منفصل.`,`صح.`,`غلط — الـ cache للـ side data مش للداتا الأساسية.`,`غلط — للـ text lines.`],
tip:`many small files → SequenceFile.`,src:`Lecture 4 · SequenceFile`},

{s:9,t:'m',tp:'side',q:`A list of 5 allowed city names must be available to every mapper to filter records. Which approach is most suitable?`,
o:[`Store it in the job configuration (e.g., using DefaultStringifier) and read it in setup()`,`Write a reduce-side join`,`Put it in a separate 128 MB HDFS block`,`Use a combiner`],a:0,
ex:`ده **side data** صغير جدًا (metadata). السلايد: الـ **job configuration** مفيد **when you need to pass a small piece of metadata to your tasks**. الـ Configuration بتخزن Strings، فالـ object يتحول بـ **DefaultStringifier**، وكل mapper يقراه في **setup()**. ده نفس مثال [Cairo, Alex] في المحاضرة.`,
w:[`صح.`,`غلط — join تقيل جدًا على 5 كلمات.`,`غلط — مفيش داعي.`,`غلط — الـ combiner لتقليل الـ shuffle.`],
tip:`tiny side data (few KB) → job configuration.`,src:`Lecture 5 · Side data (job configuration)`},

{s:9,t:'m',tp:'side',q:`A 200 MB customer lookup file must be available on every node to enrich a huge transaction dataset. Which approach is most suitable?`,
o:[`Job configuration`,`Distributed cache`,`NLineInputFormat`,`A second NameNode`],a:1,
ex:`الـ job configuration لـ **few kilobytes** بس. لملف كبير زي ده السلايد بيقول: **it is preferable to distribute datasets using Hadoop's distributed cache**، و**lookup files are usually passed to MapReduce jobs using distributed cache**. الملف بيتنسخ على كل node **once per job** (والحد الافتراضي 10 GB).`,
w:[`غلط — 200 MB كتير جدًا على الـ configuration وهتضغط على الـ memory.`,`صح.`,`غلط.`,`غلط.`],
tip:`lookup file (MB / GB) → distributed cache.`,src:`Lecture 5 · Distributed cache`},

{s:9,t:'m',tp:'mr',q:`Which of the following reduces the amount of data transferred between map and reduce tasks?`,
o:[`Increasing the number of reducers`,`A combiner function`,`Using schema-on-read`,`Writing map output to HDFS`],a:1,
ex:`السلايد: **MapReduce applications are limited by the bandwidth available on the cluster. It pays to minimize the data shuffled between map and reduce tasks.** والحل: **combiner function** بيشتغل على map output (زي reducer صغير) فيقلل الداتا اللي بتتعمل لها shuffle.`,
w:[`غلط — نفس الداتا هتتنقل.`,`صح.`,`غلط — مالوش علاقة.`,`غلط — الـ map output بيتكتب على local disk.`],
tip:`minimize shuffled data → combiner.`,src:`Lecture 3 · Combiners`},

/* ───────────── SET 10 — Midterm-style practice (1) ───────────── */
{s:9,t:'m',tp:'splits',q:`Where is the output of a map task stored, and why?`,
o:[`In HDFS, to be replicated three times`,`On the local disk, because it is intermediate output`,`In the NameNode memory`,`In the distributed cache`],a:1,
ex:`السلايد: **Map tasks write their output to the local disk, not to HDFS.** السبب: **Map output is intermediate output** بتعالجه الـ reduce tasks عشان تطلع الـ final output، فمالوش لازمة يتعمله replication.`,
w:[`غلط — هيبقى إسراف.`,`صح.`,`غلط — NameNode للـ metadata.`,`غلط — للـ side data.`],
tip:`Map output → local disk.`,src:`Lecture 3 · Data locality`},

{s:9,t:'m',tp:'splits',q:`Why don't reduce tasks have the advantage of data locality?`,
o:[`Because reducers run on the NameNode`,`Because the input to a single reduce task is normally the output from all mappers`,`Because reducers read from a SAN`,`Because reduce output is not stored in HDFS`],a:1,
ex:`السلايد: **Reduce tasks don't have the advantage of data locality; the input to a single reduce task is normally the output from all mappers.** الـ reducer لازم يسحب الداتا من كل الـ mappers على الشبكة.`,
w:[`غلط.`,`صح.`,`غلط — SAN بتاع HPC.`,`غلط — الـ reduce output بيتخزن في HDFS.`],
tip:`Reducer input = from ALL mappers → no locality.`,src:`Lecture 3 · Data locality`},

{s:9,t:'m',tp:'splits',q:`What is the default HDFS block size, which is also a good default split size?`,
o:[`32 MB`,`64 MB`,`128 MB`,`1 GB`],a:2,
ex:`السلايد: **a good split size tends to be the size of an HDFS block, which is 128 MB by default**.`,
w:[`غلط.`,`غلط — ده كان في إصدارات قديمة، والسلايد بيقول 128.`,`صح.`,`غلط.`],
tip:`Block = 128 MB.`,src:`Lecture 3 · Data Flow`},

{s:9,t:'m',tp:'splits',q:`What happens to load balancing when input splits are made smaller (but not too small)?`,
o:[`It gets worse, because there are more splits`,`It improves, because a faster machine can process proportionally more splits than a slower one`,`It is not affected`,`It becomes impossible`],a:1,
ex:`السلايد: لو الـ splits صغيرة، وقت معالجة كل split صغير مقارنة بالـ input كله، فـ **processing is better load balanced ... since a faster machine will be able to process proportionally more splits**. لكن لو صغيرة أوي، الـ overhead يغلب.`,
w:[`غلط.`,`صح.`,`غلط.`,`غلط.`],
tip:`smaller splits → better balance · too small → overhead.`,src:`Lecture 3 · Data Flow`},

{s:9,t:'m',tp:'grid',q:`Which statement correctly compares Hadoop with Grid computing (HPC)?`,
o:[`Grid co-locates data with compute nodes; Hadoop uses a shared SAN`,`Hadoop co-locates data with compute nodes; Grid nodes access a shared file system on a SAN`,`Both use the same approach to data access`,`Grid uses high-level programming; Hadoop uses low-level programming`],a:1,
ex:`HPC: الأجهزة بتوصل لـ **shared file system hosted by a SAN**، والشبكة بتبقى bottleneck مع الداتا الكبيرة. Hadoop: **tries to co-locate the data with the compute nodes** (data locality). وكمان Grid = low level و Hadoop = high level.`,
w:[`غلط — معكوسة.`,`صح.`,`غلط.`,`غلط — معكوسة.`],
tip:`Grid = SAN + low level. Hadoop = data locality + high level.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:9,t:'m',tp:'grid',q:`Why are MPI programs harder to write than MapReduce programs?`,
o:[`MPI programs must explicitly manage their own checkpointing and recovery`,`MPI does not support parallelism`,`MPI only runs on a single machine`,`MPI programs cannot use networks`],a:0,
ex:`السلايد: **MPI programs have to explicitly manage their own check pointing and recovery, which gives more control to the programmer but makes them more difficult to write.** في MapReduce الـ engine بيتعامل مع الـ failures.`,
w:[`صح.`,`غلط — MPI للـ parallel computing.`,`غلط — بيشتغل على cluster.`,`غلط — Message Passing أصلاً على الشبكة.`],
tip:`MPI = more control + harder (manual checkpointing).`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:9,t:'m',tp:'grid',q:`What does "shared-nothing architecture" mean in MapReduce?`,
o:[`All tasks share one disk`,`Tasks have no dependence on one another`,`Nodes share no network`,`Data is never replicated`],a:1,
ex:`السلايد: **shared-nothing architecture, meaning that tasks have no dependence on one other.** عشان كده الـ framework يقدر يعيد تشغيل أي task فشل، و**the order in which the tasks run doesn't matter**.`,
w:[`غلط.`,`صح.`,`غلط.`,`غلط — HDFS بيعمل replication.`],
tip:`shared-nothing = independent tasks.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:9,t:'m',tp:'hadoop',q:`Which of the following is NOT a feature of Hadoop?`,
o:[`Fault tolerance`,`Data locality`,`ACID transactions`,`Horizontal scalability`],a:2,
ex:`مميزات Hadoop التسعة: Open source, Distributed processing, Fault tolerance, Reliability, High availability, Scalability, Economic, Easy to use, Data locality. أما **ACID transactions** فده RDBMS؛ MapReduce Transactions = **None**.`,
w:[`غلط — ميزة.`,`غلط — ميزة.`,`صح — مش ميزة Hadoop.`,`غلط — ميزة.`],
tip:`ACID → RDBMS, never Hadoop.`,src:`Lecture 3 · Features of Hadoop`},

{s:9,t:'m',tp:'hadoop',q:`What does horizontal scalability in Hadoop mean?`,
o:[`Replacing a server with a more powerful one`,`Adding new nodes to the cluster on the fly without downtime`,`Increasing the block size`,`Adding more RAM to the NameNode`],a:1,
ex:`السلايد: **horizontal scalability which means new nodes can be added on the fly without any downtime.** تبديل السيرفر بواحد أقوى ده vertical scaling.`,
w:[`غلط — ده vertical.`,`صح.`,`غلط.`,`غلط — برضه vertical.`],
tip:`Horizontal = more nodes. Vertical = bigger machine.`,src:`Lecture 3 · Features of Hadoop`},

{s:9,t:'m',tp:'hadoop',q:`Which HDFS component keeps track of which DataNode stores each block?`,
o:[`DataNode`,`NameNode`,`ResourceManager`,`Reducer`],a:1,
ex:`الـ **NameNode** = metadata manager: file names and locations، how files are split into blocks، و **which DataNode stores each block**. مش بيخزن الداتا نفسها.`,
w:[`غلط — بيخزن الـ blocks.`,`صح.`,`غلط — بتاع YARN.`,`غلط.`],
tip:`metadata → NameNode.`,src:`HDFS · NameNode vs DataNode`},

{s:9,t:'m',tp:'rdbms',q:`Which type of data does Hadoop handle especially well because of schema-on-read?`,
o:[`Only normalized relational tables`,`Unstructured and semi-structured data`,`Only small transactional records`,`Only XML documents with a strict schema`],a:1,
ex:`السلايد: **Hadoop works well on unstructured or semi-structured data because it is designed to interpret the data at processing time (schema-on-read).**`,
w:[`غلط — الـ normalization مشكلة لـ Hadoop.`,`صح.`,`غلط — Hadoop مش للـ transactions.`,`غلط — دي structured (realm of RDBMS).`],
tip:`Unstructured / semi + Hadoop ← schema-on-read.`,src:`Lecture 2 · MapReduce vs RDBMS`},

{s:9,t:'m',tp:'rdbms',q:`What is an advantage of schema-on-read?`,
o:[`It guarantees high data integrity`,`It provides flexibility and avoids the costly data loading phase, since loading is just a file copy`,`It supports ACID transactions`,`It requires the schema before storing data`],a:1,
ex:`السلايد: schema-on-read **provides flexibility and avoids the costly data loading phase of an RDBMS, since in Hadoop it is just a file copy.**`,
w:[`غلط — الـ integrity في Hadoop Low.`,`صح.`,`غلط.`,`غلط — ده schema-on-write.`],
tip:`on-read advantage = flexibility + fast loading (file copy).`,src:`Lecture 2 · MapReduce vs RDBMS`},

{s:9,t:'m',tp:'rdbms',q:`Why are web server logs well suited for analysis with Hadoop?`,
o:[`They are not normalized, e.g., client hostnames are written in full each time`,`They are always small files`,`They need frequent updates`,`They require ACID guarantees`],a:0,
ex:`السلايد: **A web server log is a good example of a set of records that is not normalized** (the client hostnames are specified in full each time). عدم الـ normalization يخلي قراءة الـ record **local** ومناسبة للـ streaming reads.`,
w:[`صح.`,`غلط — الـ small files مشكلة.`,`غلط — Hadoop write once.`,`غلط.`],
tip:`logs = not normalized → Hadoop.`,src:`Lecture 2 · MapReduce vs RDBMS`},

{s:9,t:'m',tp:'rdbms',q:`For which task is an RDBMS a better choice than MapReduce?`,
o:[`Analyzing 5 PB of web logs in batch`,`Updating a single customer's record with low latency`,`Counting words in all books of a library`,`Processing unstructured images`],a:1,
ex:`السلايد: **An RDBMS is good for point queries or updates, where the dataset has been indexed to deliver low-latency retrieval and update times of a relatively small amount of data.** الباقي كلهم batch على داتا ضخمة أو unstructured = MapReduce.`,
w:[`غلط — MapReduce.`,`صح.`,`غلط — word count مثال MapReduce الكلاسيكي.`,`غلط — Hadoop.`],
tip:`single record / update / low latency → RDBMS.`,src:`Lecture 2 · MapReduce vs RDBMS`},

{s:9,t:'m',tp:'patterns',q:`Which processing pattern on Hadoop uses Impala?`,
o:[`Stream processing`,`Search`,`Interactive SQL`,`Iterative processing`],a:2,
ex:`**Interactive SQL**: distributed query engine بـ **"always on" daemons (like Impala)** أو container reuse (Hive on Tez) → low-latency SQL على Hadoop.`,
w:[`غلط — Storm / Samza / Spark Streaming.`,`غلط — Solr / ElasticSearch.`,`صح.`,`غلط — Spark in memory.`],
tip:`Impala → Interactive SQL.`,src:`Lecture 2 · Processing patterns`},

/* ───────────── SET 11 — Midterm-style practice (2) ───────────── */
{s:10,t:'m',tp:'yarn',q:`What enabled processing models other than MapReduce to run on a Hadoop cluster?`,
o:[`HDFS federation`,`The introduction of YARN in Hadoop 2`,`The combiner function`,`SequenceFile`],a:1,
ex:`السلايد: **The real enabler for new processing models in Hadoop was the introduction of YARN (Yet Another Resource Negotiator) in Hadoop 2.**`,
w:[`غلط — مش مذكور.`,`صح.`,`غلط.`,`غلط.`],
tip:`new processing models enabler → YARN.`,src:`Lecture 2 · YARN`},

{s:10,t:'m',tp:'hadoop',q:`Which Hadoop 2 component is the high-performance distributed file system?`,
o:[`YARN`,`MapReduce`,`HDFS`,`Hive`],a:2,
ex:`Hadoop 2 framework: **HDFS = a high performance distributed file system**، YARN = scheduling و resource management، MapReduce = parallel processing.`,
w:[`غلط.`,`غلط.`,`صح.`,`غلط — Hive مش من الـ 3 core.`],
tip:`storage → HDFS.`,src:`Lecture 3 · Hadoop 2 framework`},

{s:10,t:'m',tp:'bigdata',q:`Which of the following is NOT one of the 3Vs in the lecture's definition of Big Data?`,
o:[`Volume`,`Variety`,`Velocity`,`Value`],a:3,
ex:`الـ 3Vs في السلايد: **Volume, Variety, Velocity**. الـ **Value** مش منهم.`,
w:[`غلط — من الـ 3Vs.`,`غلط — من الـ 3Vs.`,`غلط — من الـ 3Vs.`,`صح.`],
tip:`3Vs = Volume · Variety · Velocity.`,src:`Lecture 1 · Introduction`},

{s:10,t:'m',tp:'input',q:`In TextInputFormat, the key is of type:`,
o:[`IntWritable — the line number`,`Text — the first word`,`LongWritable — the byte offset of the beginning of the line`,`NullWritable`],a:2,
ex:`السلايد: **The key, a LongWritable, is the byte offset within the file of the beginning of the line.** والـ value = Text (محتوى السطر).`,
w:[`غلط — مش line number ومش IntWritable.`,`غلط.`,`صح.`,`غلط.`],
tip:`TextInputFormat key = LongWritable offset.`,src:`Lecture 4 · Text input format`},

{s:10,t:'m',tp:'input',q:`Which InputFormat treats everything up to the first tab character as the key?`,
o:[`TextInputFormat`,`KeyValueTextInputFormat`,`NLineInputFormat`,`SequenceFileInputFormat`],a:1,
ex:`**KeyValueTextInputFormat**: key = **everything up to the first tab character**، value = **the remainder of the line**. والـ separator قابل للتغيير بالـ property ~mapreduce.input.keyvaluelinerecordreader.key.value.separator~.`,
w:[`غلط — key = offset.`,`صح.`,`غلط — key = offset.`,`غلط — user-defined.`],
tip:`first tab → KeyValueTextInputFormat.`,src:`Lecture 4 · Key-value input format`},

{s:10,t:'m',tp:'seq',q:`What makes a SequenceFile splittable?`,
o:[`It is stored as plain text`,`It has sync points that let readers synchronize with record boundaries from an arbitrary point in the file`,`It always fits in one block`,`It is stored in the NameNode`],a:1,
ex:`السلايد: Sequence files **are splittable (they have sync points so that readers can synchronize with record boundaries from an arbitrary point in the file, such as the start of a split)**.`,
w:[`غلط — binary.`,`صح.`,`غلط — ممكن يبقى أكتر من block (1 GB = 8 blocks).`,`غلط.`],
tip:`splittable ← sync points.`,src:`Lecture 4 · Binary input format`},

{s:10,t:'m',tp:'input',q:`A line starts at the end of Block 1 and ends at the beginning of Block 2. How does Hadoop handle it?`,
o:[`The line is processed twice, once by each mapper`,`The line is lost`,`The LineRecordReader of the first split reads the whole line, fetching only the extra bytes from Block 2 over the network`,`The job fails`],a:2,
ex:`**Splits honor logical record boundaries**. الـ split الأول بيحتوي السطر كله، والـ **LineRecordReader** بيجيب الـ bytes الناقصة بس من Block 2 (في المثال ~22 bytes). والـ split التاني يبدأ من السطر اللي بعده. **Avoids duplicates and missing data**.`,
w:[`غلط — Hadoop بيتجنب الـ duplicates.`,`غلط — بيتجنب الـ missing data.`,`صح.`,`غلط.`],
tip:`line across blocks → first split + extra bytes.`,src:`Lecture 4 · Website Traffic Analysis scenario`},

{s:10,t:'m',tp:'code',q:`In word count, the reducer is declared as Reducer<Text, IntWritable, Text, IntWritable>. What is the reducer's INPUT value type?`,
o:[`Text`,`IntWritable`,`Object`,`LongWritable`],a:1,
ex:`الترتيب: ~Reducer<input key, input value, output key, output value>~ → input value = **IntWritable**. ولازم يطابق الـ map output value (الـ mapper بيكتب ~new IntWritable(1)~). وفي الـ reduce method بيبقى ~Iterable<IntWritable> values~.`,
w:[`غلط — ده الـ input key.`,`صح.`,`غلط — ده input key بتاع الـ mapper.`,`غلط.`],
tip:`2nd generic parameter = input value.`,src:`Lecture 4 · Word count Reducer`},

{s:10,t:'m',tp:'code',q:`Which driver method sets the output key type of the reduce function?`,
o:[`setMapOutputKeyClass()`,`setOutputKeyClass()`,`setMapperClass()`,`setJarByClass()`],a:1,
ex:`السلايد: **setOutputKeyClass() and setOutputValueClass()** بيتحكموا في output types بتوع الـ **reduce function**. أما ~setMapOutputKeyClass()~ فلما map output يختلف عن reduce output.`,
w:[`غلط — ده للـ map output.`,`صح.`,`غلط — بيحدد class الـ mapper.`,`غلط — بيحدد الـ jar.`],
tip:`setOutput... = reduce output.`,src:`Lecture 4 · Word count Driver`},

{s:10,t:'m',tp:'code',q:`Which statement about serialization in Hadoop is correct?`,
o:[`Hadoop uses Java Serializable because it is the lightest option`,`Hadoop uses Writable types because Java Serializable is too heavy; serialization is used for RPC and persistent storage`,`Serialization turns a byte stream into objects`,`Hadoop does not use serialization`],a:1,
ex:`**Serialization** = structured objects → byte stream (للشبكة أو التخزين). **Deserialization** = العكس. بتستخدم في **interprocess communication (RPC)** و **persistent storage**. وHadoop بيستخدم **Writable** (IntWritable, Text) لأن **Java Serializable is too big or too heavy**.`,
w:[`غلط — العكس.`,`صح.`,`غلط — ده تعريف deserialization.`,`غلط.`],
tip:`objects → bytes = serialization. Writable = light.`,src:`Lecture 4 · Serialization`},

{s:10,t:'m',tp:'side',q:`Which mechanism is preferred for distributing side datasets (such as lookup files) to all task nodes?`,
o:[`Job configuration`,`Distributed cache`,`Combiner`,`Shuffle`],a:1,
ex:`السلايد: **Rather than serializing side data in the job configuration, it is preferable to distribute datasets using Hadoop's distributed cache mechanism.** بيـ copy الملفات للـ nodes قبل الـ tasks، once per job.`,
w:[`غلط — few KB بس.`,`صح.`,`غلط.`,`غلط.`],
tip:`datasets / lookup files → distributed cache.`,src:`Lecture 5 · Distributed cache`},

{s:10,t:'m',tp:'side',q:`In the distributed cache, when does a cached file become eligible for deletion from a node?`,
o:[`Immediately after it is copied`,`When its reference count reaches zero`,`After every map task`,`When the cache reaches 1 GB`],a:1,
ex:`الـ node manager بيعمل **reference count** لكل ملف: +1 قبل الـ task، −1 بعدها. **Only when the count reaches zero is it eligible for deletion.** والـ default size للـ cache = 10 GB.`,
w:[`غلط.`,`صح.`,`غلط — ممكن tasks تانية لسه بتستخدمه.`,`غلط — الـ default 10 GB.`],
tip:`count = 0 → deletable.`,src:`Lecture 5 · Distributed cache`},

{s:10,t:'m',tp:'join',q:`What is required for a map-side join?`,
o:[`The input to each map must be partitioned and sorted according to the join keys`,`Records must be tagged with their source`,`Both datasets must go through the shuffle`,`The datasets must be stored in an RDBMS`],a:0,
ex:`السلايد: في الـ **map side join** الـ mapper بيعمل الـ join، و**it is mandatory that the input to each map is partitioned and sorted according to the keys**. الـ tagging والـ shuffle بتوع الـ reduce-side join.`,
w:[`صح.`,`غلط — ده reduce-side.`,`غلط — ده reduce-side (وده سبب إنه أبطأ).`,`غلط.`],
tip:`partitioned & sorted → map-side join.`,src:`Lecture 5 · Join in MapReduce`},

{s:10,t:'m',tp:'join',q:`Why is a reduce-side join less efficient than a map-side join?`,
o:[`Because it requires sorted input`,`Because both datasets have to go through the MapReduce shuffle`,`Because it cannot handle large data`,`Because it runs without a reducer`],a:1,
ex:`السلايد: reduce-side join **more general** (الـ input مش محتاج structure معين) و **easier to implement**، **but it is less efficient because both datasets have to go through the MapReduce shuffle.**`,
w:[`غلط — ده شرط الـ map-side.`,`صح.`,`غلط — يقدر.`,`غلط — اسمه reduce-side.`],
tip:`reduce join slow ← shuffle of both datasets.`,src:`Lecture 5 · Reduce join`},

{s:10,t:'m',tp:'side',q:`Which method of a Mapper or Reducer is used to initialize resources before processing, such as reading a file from the distributed cache into a HashMap?`,
o:[`map()`,`reduce()`,`setup()`,`main()`],a:2,
ex:`السلايد: **Setup method is basically an init function, for a given Mapper/Reducer an implementation can be added to initialize/set resources to be used in map or reduce phase.** في المثال الـ reducer قرا ملف الـ customers من ~DistributedCache.getCacheFiles()~ وحطه في HashMap جوه ~setup()~.`,
w:[`غلط — بتتنادى لكل record.`,`غلط — بتتنادى لكل key.`,`صح.`,`غلط — ده في الـ driver.`],
tip:`initialize once → setup().`,src:`Lecture 5 · Distributed cache`}
);

window.TOPICS.yarn={title:`YARN (ResourceManager & ApplicationMaster)`,
lesson:`**YARN** اتضاف في Hadoop 2 وهو الـ **cluster resource management system**. السلايدز بتقول بس إنه بيسمح لأي distributed program يشتغل على الـ cluster، وإنه بيعمل job scheduling. أسئلة الامتحان سألت عن تفاصيل من كتاب Hadoop: The Definitive Guide، فدي أهمها.`,
points:[[`ResourceManager`,`واحد للـ cluster كله، بيدير الـ resources. جواه **scheduler** بيوزّع الـ resources، وبيرفض أي application بتطلب resources مستحيلة لـ ApplicationMaster بتاعها.`],[`NodeManager`,`على كل node، بيشغّل الـ containers ويراقبها. وبيعمل reference count لملفات الـ distributed cache.`],[`ApplicationMaster`,`واحد لكل application، بيطلب containers من الـ ResourceManager عن طريق **RPC**.`],[`Container`,`وحدة resources (memory + CPU) بيشتغل فيها الـ task.`],[`Flexibility`,`YARN بيسمح لـ frameworks كتير (MapReduce, Spark, …) تشتغل **concurrently** على نفس الـ cluster.`]],
hints:[[`AM ↔ RM communication`,`RPC`],[`rejects unsatisfiable resources`,`Scheduler`],[`why YARN flexible`,`Multiple frameworks concurrently`],[`enabler of new processing models`,`YARN (Hadoop 2)`]]};

// 15 extra MCQs to complete Quiz 2 (s:9, +5) and Quiz 3 (s:10, +10).
window.QUESTIONS.push(
{s:9,t:'m',tp:'hadoop',q:`Which of the following best defines Hadoop?`,
o:[`A relational database for transactional systems`,`A free software framework for distributed processing of large data sets on clusters of commodity hardware, using simple programming models`,`A single high-performance server for scientific computing`,`A programming language for Big Data`],a:1,
ex:`تعريف السلايد: **Hadoop is a free software framework developed with the purpose of distributed processing of large data sets using clusters of commodity hardware, implementing simple programming models.** وهو **middleware platform** بيدير cluster من الأجهزة، واتكتب بـ Java.`,
w:[`غلط — Hadoop مالوش transactions (None).`,`صح.`,`غلط — Hadoop cluster من أجهزة رخيصة مش جهاز واحد.`,`غلط — Hadoop framework مكتوب بـ Java، مش لغة.`],
tip:`Hadoop = free framework + distributed + commodity clusters + simple programming models.`,src:`Lecture 3 · Definition of Hadoop`},

{s:9,t:'m',tp:'bigdata',q:`Which characteristic of Big Data refers to data coming from a variety of sources?`,
o:[`Volume`,`Velocity`,`Variety`,`Veracity`],a:2,
ex:`السلايد: **volume refers to the magnitude of data, variety refers to data come from a variety of sources. Velocity refers to the streamed data collected on real time.**`,
w:[`غلط — Volume = الحجم.`,`غلط — Velocity = streaming / real time.`,`صح.`,`غلط — مش من الـ 3Vs في السلايد.`],
tip:`sources / formats → Variety.`,src:`Lecture 1 · Introduction`},

{s:9,t:'m',tp:'patterns',q:`Stream processing is essential when:`,
o:[`The application must respond quickly (minutes, seconds or milliseconds) and keep state in memory`,`The whole dataset must be analyzed once a month`,`Data is written once and never read`,`ACID transactions are required`],a:0,
ex:`السلايد: الـ stream processing مهم في حالتين: (1) **lower latency**: لما التطبيق لازم يرد بسرعة (minutes, seconds, milliseconds) فمحتاج streaming system **keeps state in memory**. (2) **more efficient in updating a result than repeated batch jobs** لأنه **incrementalizes the computation**.`,
w:[`صح.`,`غلط — ده batch.`,`غلط.`,`غلط — مالوش علاقة.`],
tip:`Stream = low latency + state in memory + incremental updates.`,src:`Lecture 2 · Stream processing`},

{s:9,t:'m',tp:'hadoop',q:`Which Hadoop feature means that if a node goes down, its data can be recovered from other nodes and failures are recovered automatically by the framework?`,
o:[`Fault tolerance`,`Open source`,`Economic`,`Easy to use`],a:0,
ex:`الميزة رقم 3: **Fault Tolerance: if any node goes down, data on that node can be recovered from other nodes easily ... Failures of nodes or tasks are recovered automatically by the framework.**`,
w:[`صح.`,`غلط — تعديل الكود.`,`غلط — commodity hardware.`,`غلط — الـ framework بيتعامل مع التوزيع.`],
tip:`recovered automatically → Fault tolerance.`,src:`Lecture 3 · Features of Hadoop`},

{s:9,t:'m',tp:'splits',q:`A 300 MB file is stored in HDFS with the default block size. How many blocks does it occupy?`,
o:[`2`,`3`,`300`,`1`],a:1,
ex:`الـ default block = **128 MB**. 300 ÷ 128 = 2.34، يعني **2 blocks كاملين (128 + 128) + block تالت فيه 44 MB**. الـ block الأخير مش لازم يبقى مليان. يبقى **3 blocks**، وبالتالي غالبًا 3 splits و 3 map tasks.`,
w:[`غلط — 256 MB بس، وفاضل 44 MB.`,`صح — 128 + 128 + 44.`,`غلط.`,`غلط — أكبر من block واحد.`],
tip:`blocks = ceil(file size ÷ 128 MB).`,src:`Lecture 3 · Data Flow / Block vs Split`},

{s:10,t:'m',tp:'rdbms',q:`According to the lecture, which of the following is an example of semi-structured data?`,
o:[`A database table with a predefined schema`,`A spreadsheet, where the structure is the grid of cells but cells may hold any form of data`,`An image file`,`Plain text`],a:1,
ex:`السلايد: **Semi-structured data is looser ... for example, a spreadsheet, in which the structure is the grid of cells, although the cells themselves may hold any form of data.** الـ DB tables (و XML حسب السلايد) = structured، والـ image و plain text = unstructured.`,
w:[`غلط — structured.`,`صح.`,`غلط — unstructured.`,`غلط — unstructured.`],
tip:`spreadsheet → semi-structured.`,src:`Lecture 2 · MapReduce vs RDBMS`},

{s:10,t:'m',tp:'grid',q:`According to the lecture, what is at the heart of data processing in Hadoop and is the reason for its good performance?`,
o:[`ACID transactions`,`Data locality`,`Normalization`,`The SAN`],a:1,
ex:`السلايد: Hadoop بيحاول **co-locate the data with the compute nodes ... This feature, known as data locality, is at the heart of data processing in Hadoop and is the reason for its good performance.**`,
w:[`غلط.`,`صح.`,`غلط — مشكلة لـ Hadoop.`,`غلط — بتاع HPC.`],
tip:`heart of Hadoop / good performance → data locality.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:10,t:'m',tp:'mr',q:`Which statement about the combiner is TRUE?`,
o:[`It runs on the reduce output to compress the final result`,`It is a function, just like the reduce function, that runs on the map output to minimize the data shuffled to reducers`,`It replaces the need for reducers`,`It splits files into blocks`],a:1,
ex:`السلايد: **Hadoop allows the user to specify a combiner function (just like the reduce function) to be run on a map output.** الهدف: **minimize the data shuffled between map and reduce tasks** لأن MapReduce **limited by the bandwidth**. في الـ driver: ~j.setCombinerClass(wordcountreducer.class)~.`,
w:[`غلط — بيشتغل على map output مش reduce output.`,`صح.`,`غلط — الـ reducer لسه موجود.`,`غلط.`],
tip:`combiner = on MAP output, before shuffle.`,src:`Lecture 3 · Combiners`},

{s:10,t:'m',tp:'yarn',q:`Who schedules the map and reduce tasks to run on nodes in the cluster?`,
o:[`The NameNode`,`YARN`,`The combiner`,`The client`],a:1,
ex:`السلايد (Data Flow): **The tasks are scheduled using YARN and run on nodes in the cluster. If a task fails, it will be automatically rescheduled to run on a different node.**`,
w:[`غلط — NameNode للـ metadata.`,`صح.`,`غلط.`,`غلط — الـ client بيبعت الـ job بس.`],
tip:`schedule tasks → YARN.`,src:`Lecture 3 · Data Flow in MapReduce`},

{s:10,t:'m',tp:'input',q:`Using NLineInputFormat with its default setting on a 6-line file, how many mappers receive input?`,
o:[`1`,`2`,`3`,`6`],a:3,
ex:`السلايد: **With N set to 1 (the default), each mapper receives exactly one line of input.** يعني 6 سطور = **6 mappers**.`,
w:[`غلط.`,`غلط — ده لو N = 3.`,`غلط — ده لو N = 2.`,`صح — N = 1 by default.`],
tip:`NLine default N = 1 → mappers = number of lines.`,src:`Lecture 4 · NLineInputFormat`},

{s:10,t:'m',tp:'seq',q:`As a rule of thumb, how much NameNode RAM does each file, directory or block object occupy?`,
o:[`About 15 bytes`,`About 150 bytes`,`About 1.5 KB`,`About 128 MB`],a:1,
ex:`السلايد: **Each file, directory, block in HDFS is represented as object and occupies 150 bytes.** عشان كده 10 مليون ملف ≈ 3 GB من RAM الـ NameNode، ومليار ملف مش ممكن.`,
w:[`غلط.`,`صح.`,`غلط — 1.4 KB ده إجمالي 9 objects.`,`غلط — ده حجم الـ block.`],
tip:`~150 bytes per object.`,src:`Lecture 4 · SequenceFile`},

{s:10,t:'m',tp:'input',q:`Which RecordReader converts raw bytes into (byte offset, line) pairs and handles lines that cross block boundaries?`,
o:[`SequenceFileRecordReader`,`LineRecordReader`,`KeyValueRecordReader`,`InputSplit`],a:1,
ex:`سيناريو Website Traffic: **Each Mapper uses a LineRecordReader to convert raw bytes into (key, value) pairs. Key: Byte offset ... Value: The full text line. LineRecordReader is smart enough to handle lines that cross block boundaries.**`,
w:[`غلط — للـ binary.`,`صح.`,`غلط — مش اللي في السلايد.`,`غلط — InputSplit بيحدد الجزء، مش بيقرا.`],
tip:`line across blocks → LineRecordReader.`,src:`Lecture 4 · Website Traffic Analysis`},

{s:10,t:'m',tp:'side',q:`Hadoop's Configuration object stores values as:`,
o:[`Java objects of any type`,`Strings only`,`Binary blocks`,`HDFS files`],a:1,
ex:`السلايد: **Hadoop Configuration stores values as Strings only. We cannot store Java objects directly.** الحل: تحوّل الـ object لـ String بنفسك أو تستخدم **DefaultStringifier**، والـ mapper يقراه في ~setup()~.`,
w:[`غلط — لازم تتحول String.`,`صح.`,`غلط.`,`غلط — ده الـ distributed cache.`],
tip:`Configuration = Strings → DefaultStringifier.`,src:`Lecture 5 · Side data example`},

{s:10,t:'m',tp:'join',q:`In the reduce-side join example, what does a reducer receive after the shuffle and sort phase?`,
o:[`One record from the customer file only`,`A join key (customer ID) with a list of tagged values from both datasets, e.g. {4000001 – [(cname kristina), (camount 40.33), …]}`,`The whole transaction file`,`Only the amounts, already summed by the mapper`],a:1,
ex:`mapper1 بيطلع [4000001, cname Kristina]، و mapper2 بيطلع [4000001, camount 40.33]. **After the sorting and shuffling phase, a key and the list of values is generated for the reducer**: {4000001 – [(cname kristina), (camount 40.33), (camount 47.05), …]}. الـ reducer بيفرّق بالـ tag: لو cname ياخد الاسم، لو camount يجمع.`,
w:[`غلط.`,`صح.`,`غلط.`,`غلط — الجمع في الـ reducer.`],
tip:`reducer gets: key + list of tagged values from both sources.`,src:`Lecture 5 · Reduce join`},

{s:10,t:'m',tp:'join',q:`Writing joins in MapReduce from scratch is fairly involved. What does the lecture suggest instead?`,
o:[`Using a traditional RDBMS only`,`Using a higher-level framework such as Pig, Hive or Spark, where joins are a core part of the implementation`,`Avoiding joins entirely`,`Using the distributed cache for both large datasets`],a:1,
ex:`السلايد: **Rather than writing MapReduce programs, you might consider using a higher-level framework such as Pig, Hive, or Spark, in which join operations are a core part of the implementation.**`,
w:[`غلط.`,`صح.`,`غلط — Hadoop يقدر يعمل joins.`,`غلط — الـ cache للـ dataset الصغيرة بس.`],
tip:`joins easier → Pig / Hive / Spark.`,src:`Lecture 5 · Join in MapReduce`}
);

<script>// IS 365 Big Data — 100 questions from Mid Slides (Lectures 1–5).
// Fields: s=set, t='m'|'tf', tp=topic key, q, o=options (MCQ), a=correct index (TF: 0=True,1=False),
// ex=Arabic explanation, w=why per option, tip=exam hint, src=slide reference.
// Markup inside strings: **bold**, ~code~.
window.QUESTIONS = [
/* ───────────── SET 1 — Big Data & processing models ───────────── */
{s:1,t:'m',tp:'bigdata',q:`The most widely accepted definition of Big Data is in terms of three characteristics. They are:`,
o:[`Volume, Variety and Velocity`,`Volume, Value and Veracity`,`Variety, Validity and Visibility`,`Velocity, Value and Variability`],a:0,
ex:`السلايد بيقول إن أشهر تعريف للـ **Big Data** بيعتمد على 3 خصائص اسمهم الـ **3Vs**: **Volume** (حجم الداتا)، **Variety** (الداتا جاية من مصادر وأشكال كتير)، و**Velocity** (الداتا بتيجي streaming وبتتجمع real time).`,
w:[`صح — دول بالظبط الـ 3 خصائص اللي في السلايد.`,`غلط — Value و Veracity موجودين في تعريفات تانية (5Vs) لكن مش في السلايد.`,`غلط — Validity و Visibility مش من الـ 3Vs خالص.`,`غلط — Value و Variability مش مذكورين؛ بس Velocity بس اللي صح فيهم.`],
tip:`3Vs = Volume · Variety · Velocity. أي V تانية = مش في تعريف السلايد.`,src:`Lecture 1 · Introduction`},

{s:1,t:'m',tp:'bigdata',q:`In the 3Vs of Big Data, "Velocity" refers to:`,
o:[`The magnitude (size) of the data`,`Data coming from a variety of sources`,`The streamed data collected in real time`,`The accuracy and trustworthiness of the data`],a:2,
ex:`كل V ليها معنى محدد في السلايد: **Volume** = الحجم (magnitude)، **Variety** = تنوع المصادر، **Velocity** = سرعة وصول الداتا، يعني داتا **streamed** بتتجمع **real time**.`,
w:[`غلط — ده تعريف Volume.`,`غلط — ده تعريف Variety.`,`صح — Velocity = streamed data collected on real time.`,`غلط — ده Veracity، ومش من الـ 3Vs اللي في السلايد.`],
tip:`Velocity = سرعة = stream / real time. Volume = حجم. Variety = مصادر وأشكال.`,src:`Lecture 1 · Introduction`},

{s:1,t:'tf',tp:'bigdata',q:`Traditional methods and databases can handle Big Data efficiently without new tools.`,a:1,
ex:`السلايد مكرر الجملة دي مرتين: **Traditional methods and databases can not handle big data**. حجم الداتا العالي محتاج أدوات وتكنولوجيات جديدة للتخزين والإدارة.`,
w:[`غلط — السلايد بيقول العكس بالظبط.`,`صح — الطرق التقليدية مش بتقدر، ومحتاجين new tools and technologies.`],
tip:`أي جملة بتقول إن الـ traditional DB كفاية للـ Big Data = False.`,src:`Lecture 1 · Introduction`},

{s:1,t:'m',tp:'bigdata',q:`"Big Data is data whose scale, distribution, diversity, and/or timeliness require the use of ______ to enable insights that unlock new sources of business value."`,
o:[`only larger hard disks on the same server`,`new technical architectures and analytics`,`normalized relational schemas`,`a single high-end supercomputer`],a:1,
ex:`ده تعريف McKinsey اللي في السلايد: الداتا اللي حجمها وتوزيعها وتنوعها وتوقيتها محتاجين **new technical architectures and analytics**. وكمان السلايد بيقول إن الشركات محتاجة **new data architectures, analytic sandboxes, new tools, new analytical methods**.`,
w:[`غلط — زيادة الهارد على نفس السيرفر ده scale-up تقليدي، مش الحل.`,`صح — نص التعريف في السلايد.`,`غلط — الـ normalization فكرة RDBMS، وكمان بتعمل مشاكل لـ Hadoop.`,`غلط — Big Data بتعتمد على clusters من commodity hardware مش جهاز واحد غالي.`],
tip:`تعريف McKinsey: scale, distribution, diversity, timeliness → new architectures + analytics.`,src:`Lecture 1/2 · Introduction`},

{s:1,t:'m',tp:'engines',q:`Which platform offers native support for iterative algorithms?`,
o:[`MapReduce`,`Apache Flink`,`Apache Spark`,`All of the above`],a:1,
ex:`جدول **MapReduce vs Spark vs Flink** في صف **Iterative processing**: MapReduce = **Not suitable**، Spark = **Suitable**، Flink = **Native iterative processing**. السؤال قال **native** يبقى Flink. (ده سؤال من امتحان سابق، والإجابة المعلّمة b صح.)`,
w:[`غلط — MapReduce مش مناسب للـ iterative خالص لأنه بيقرا من الـ disk كل iteration.`,`صح — Flink هو اللي مكتوب قدامه Native.`,`غلط — Spark "Suitable" بس مش "Native". الكلمة دي هي الفخ.`,`غلط — MapReduce مش بيدعم iterative، فمش "كلهم".`],
tip:`Native iterative → Flink. Suitable for iterative → Spark. Not suitable → MapReduce.`,src:`Lecture 2 · MapReduce vs Spark vs Flink`},

{s:1,t:'m',tp:'engines',q:`Which framework is known for its ability to handle real-time data processing?`,
o:[`MapReduce`,`Apache Flink`,`Apache Spark`,`None of the above`],a:1,
ex:`ده سؤال من الامتحان اللي بعته، والإجابة المعلّمة فيه (c. Spark) **غلط حسب السلايد**. جدول Execution models: MapReduce = Batch بس، Spark = **Near real time**، Flink = **Real time**. يعني لو السؤال قال **real-time** اختار **Flink**، ولو قال **near real-time** اختار **Spark**.`,
w:[`غلط — MapReduce batch processing بس.`,`صح — Flink مكتوب قدامه Real time processing.`,`غلط حسب السلايد — Spark "Near real time" مش real time. دي الإجابة اللي كانت متعلّمة في الامتحان وهي غلط.`,`غلط — فيه إجابة صح وهي Flink.`],
tip:`Real time → Flink · Near real time → Spark · Batch only → MapReduce.`,src:`Lecture 2 · MapReduce vs Spark vs Flink`},

{s:1,t:'m',tp:'engines',q:`Which of the following has NO support for interactive analysis?`,
o:[`Apache Spark`,`Apache Flink`,`MapReduce`,`Both Spark and Flink`],a:2,
ex:`في صف **Interactive analysis** في الجدول: MapReduce = **No support for interactive analysis**، وSpark وFlink الاتنين = **Support interactive analysis**. وكمان السلايد بيقول إن MapReduce **batch** ومش بترجع نتيجة في ثواني؛ الـ queries بتاخد دقايق.`,
w:[`غلط — Spark بيدعم interactive.`,`غلط — Flink بيدعم interactive.`,`صح — MapReduce الوحيد اللي مالوش support.`,`غلط — الاتنين بيدعموا interactive.`],
tip:`MapReduce = الوحيد اللي "لا" في interactive و iterative.`,src:`Lecture 2 · MapReduce vs Spark vs Flink`},

{s:1,t:'tf',tp:'engines',q:`MapReduce, Apache Spark and Apache Flink all support batch processing.`,a:0,
ex:`صف **Execution models** في الجدول: خانة **Batch processing** ممتدة على الـ 3 أعمدة. الفرق إن Spark زيادة عليها near real time، وFlink زيادة عليها real time.`,
w:[`صح — الـ 3 بيدعموا batch.`,`غلط — Batch هي الحاجة المشتركة بينهم كلهم.`],
tip:`Batch = مشترك بين الـ 3.`,src:`Lecture 2 · MapReduce vs Spark vs Flink`},

{s:1,t:'m',tp:'patterns',q:`Which processing pattern achieves low-latency SQL responses on Hadoop by using "always on" daemons (like Impala) or container reuse (like Hive on Tez)?`,
o:[`Iterative processing`,`Stream processing`,`Search`,`Interactive SQL`],a:3,
ex:`من **processing patterns with Hadoop**: الـ **Interactive SQL** بيستغنى عن MapReduce ويستخدم **distributed query engine** بـ daemons شغالة على طول (**Impala**) أو **container reuse** (**Hive on Tez**)، فيدي **low-latency** للـ SQL مع إنه بيكبر لداتا ضخمة.`,
w:[`غلط — Iterative بيتكلم عن holding working set in memory (Spark).`,`غلط — Stream بيتكلم عن unbounded streams (Storm, Spark Streaming, Samza).`,`غلط — Search بيتكلم عن Solr و ElasticSearch.`,`صح — Impala / Hive on Tez = Interactive SQL.`],
tip:`Impala / Hive on Tez → Interactive SQL. Storm / Samza → Stream. Solr / ElasticSearch → Search. ML in memory → Iterative.`,src:`Lecture 2 · Processing patterns`},

{s:1,t:'m',tp:'patterns',q:`Why is iterative processing (e.g., machine learning algorithms) much more efficient with Spark than with MapReduce?`,
o:[`Spark holds each intermediate working set in memory instead of loading it from disk on each iteration`,`Spark uses a SAN shared file system`,`MapReduce does not support key-value pairs`,`Spark uses schema-on-write`],a:0,
ex:`السلايد: خوارزميات زي الـ **machine learning** بطبيعتها **iterative**، فالأكفأ إنك تحتفظ بالـ **intermediate working set in memory** بدل ما تقراه من الـ **disk** كل لفة. **architecture of MapReduce does not allow this**، لكن ده سهل في Spark، وبيسمح بـ exploratory style.`,
w:[`صح — ده نص السلايد.`,`غلط — SAN ده بتاع HPC/Grid computing.`,`غلط — MapReduce أساسه key-value pairs.`,`غلط — schema-on-write بتاع RDBMS ومالوش علاقة.`],
tip:`Iterative = in memory. MapReduce = disk كل مرة.`,src:`Lecture 2 · Processing patterns`},

{s:1,t:'m',tp:'patterns',q:`Which of the following are examples of stream processing systems mentioned in the lecture?`,
o:[`Impala and Hive on Tez`,`Solr and ElasticSearch`,`Storm, Spark Streaming and Samza`,`MPI and SAN`],a:2,
ex:`السلايد: **Streaming systems like Storm, Spark Streaming, or Samza** بتشغّل **realtime, distributed computations on unbounded streams** وتطلع النتايج على Hadoop storage أو external systems.`,
w:[`غلط — دول Interactive SQL.`,`غلط — دول Search / information retrieval.`,`صح — دول أمثلة الـ stream processing.`,`غلط — MPI و SAN بتوع HPC/Grid.`],
tip:`S-S-S: Storm, Spark Streaming, Samza = Stream.`,src:`Lecture 2 · Processing patterns`},

{s:1,t:'m',tp:'patterns',q:`Running the Solr platform on a Hadoop cluster to index documents as they are added to HDFS is an example of which processing pattern?`,
o:[`Search`,`Interactive SQL`,`Iterative processing`,`Batch processing`],a:0,
ex:`نمط **Search**: الـ **Solr** بيشتغل على Hadoop cluster، بيعمل **indexing** للمستندات وهي بتتضاف على HDFS، وبيرد على search queries من indexes متخزنة في HDFS. و**ElasticSearch** كمان بيستخدم للـ information retrieval.`,
w:[`صح — Solr = Search.`,`غلط — Interactive SQL = Impala / Hive on Tez.`,`غلط — Iterative = ML in memory.`,`غلط — batch ده نموذج تنفيذ MapReduce، مش نمط Solr.`],
tip:`Solr / ElasticSearch / indexing → Search.`,src:`Lecture 2 · Processing patterns`},

{s:1,t:'tf',tp:'patterns',q:`In stream processing, the input data is bounded (it has a known beginning and end).`,a:1,
ex:`السلايد: **Stream processing is the act of continuously incorporating new data to compute a result. In stream processing, the input data is unbounded.** يعني events بتيجي باستمرار (credit card transactions، clicks، sensor readings من IoT). ومهم لما محتاج **lower latency** أو تحديث النتيجة بشكل **incremental** أكفأ من repeated batch jobs.`,
w:[`غلط — الداتا unbounded مش bounded.`,`صح — في الـ streaming الداتا unbounded.`],
tip:`Stream = unbounded + continuous + lower latency + incremental.`,src:`Lecture 2 · Stream processing`},

{s:1,t:'m',tp:'patterns',q:`What is YARN, and what was its significance?`,
o:[`Yet Another Replication Node; it stores block replicas in Hadoop 1`,`Yet Another Resource Negotiator; a cluster resource management system introduced in Hadoop 2 that lets any distributed program (not just MapReduce) run on Hadoop data`,`Yet Another Record Navigator; it reads records for mappers`,`Yet Another Resource Negotiator; it replaced HDFS as the storage layer`],a:1,
ex:`**YARN = Yet Another Resource Negotiator**، اتضاف في **Hadoop 2**، وهو **cluster resource management system**. السلايد بيقول إنه **the real enabler for new processing models in Hadoop** لأنه بيسمح لأي distributed program (مش MapReduce بس) يشتغل على الداتا. وفي مكونات Hadoop 2: YARN = **framework for job scheduling and cluster resource management**.`,
w:[`غلط — الاسم غلط، والـ replication شغل HDFS.`,`صح — الاسم + Hadoop 2 + resource management + any distributed program.`,`غلط — اللي بيقرا records هو RecordReader.`,`غلط — YARN ما استبدلش HDFS؛ HDFS لسه طبقة التخزين.`],
tip:`YARN = Resource Negotiator = Hadoop 2 = job scheduling + resource management.`,src:`Lecture 2 · YARN`},

{s:1,t:'tf',tp:'engines',q:`MapReduce is fundamentally a batch processing system; queries typically take minutes or more, so it is best for offline use.`,a:0,
ex:`السلايد (MapReduce Engine): **MapReduce is fundamentally a batch processing system, and is not suitable for interactive analysis**. مش هتعمل query وترجعلك النتيجة في ثواني؛ بتاخد دقايق أو أكتر، فهو مناسب للـ **offline use** اللي مفيهاش بني آدم مستني النتيجة.`,
w:[`صح — نص السلايد.`,`غلط — دي بالظبط طبيعة MapReduce.`],
tip:`MapReduce = batch + offline + minutes.`,src:`Lecture 2 · MapReduce Engine`},

/* ───────────── SET 2 — MapReduce vs RDBMS & data types ───────────── */
{s:2,t:'m',tp:'rdbms',q:`According to the comparison table, what data size does MapReduce typically handle compared to a traditional RDBMS?`,
o:[`MapReduce: Gigabytes — RDBMS: Petabytes`,`Both: Terabytes`,`MapReduce: Megabytes — RDBMS: Gigabytes`,`MapReduce: Petabytes — RDBMS: Gigabytes`],a:3,
ex:`جدول **MapReduce vs traditional database**: Data size → RDBMS = **Gigabytes**، MapReduce = **Petabytes**.`,
w:[`غلط — معكوسة.`,`غلط — الجدول مش بيقول Terabytes.`,`غلط — MapReduce مش للـ Megabytes.`,`صح — MapReduce Petabytes، RDBMS Gigabytes.`],
tip:`احفظ الجدول صف صف: Size (GB vs PB) · Access (Interactive+batch vs Batch) · Updates (R/W many vs Write once read many) · Transactions (ACID vs None) · Structure (on-write vs on-read) · Integrity (High vs Low) · Scaling (Nonlinear vs Linear).`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`How does MapReduce access data, according to the comparison table?`,
o:[`Interactive only`,`Interactive and batch`,`Batch`,`Random access`],a:2,
ex:`Access → RDBMS = **Interactive and batch**، MapReduce = **Batch**. وده متسق مع إن MapReduce batch processing system ومش بيدعم interactive analysis.`,
w:[`غلط — MapReduce مش interactive.`,`غلط — ده وصف RDBMS.`,`صح — MapReduce batch.`,`غلط — Hadoop مش كويس للـ random access (transactions).`],
tip:`"Interactive and batch" = RDBMS. "Batch" لوحدها = MapReduce.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'tf',tp:'rdbms',q:`Hadoop is suitable for reading and writing data many times.`,a:1,
ex:`سؤال من الكتاب. الجدول: Updates → RDBMS = **Read and write many times**، MapReduce = **Write once, read many times**. والسلايد: **MapReduce suits applications where the data is written once and read many times, whereas a relational database is good for datasets that are continually updated.**`,
w:[`غلط — "read and write many times" وصف RDBMS.`,`صح — Hadoop = write once, read many times.`],
tip:`WORM: Write Once Read Many = Hadoop. Continually updated = RDBMS.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`Which pair correctly describes MapReduce in the comparison with a traditional RDBMS?`,
o:[`Transactions: ACID — Integrity: High`,`Transactions: None — Integrity: Low`,`Transactions: ACID — Integrity: Low`,`Transactions: None — Integrity: High`],a:1,
ex:`في الجدول: Transactions → RDBMS = **ACID**، MapReduce = **None**. Integrity → RDBMS = **High**، MapReduce = **Low**. منطقي لأن Hadoop بيعمل schema-on-read ومش بيتأكد من الداتا وقت التخزين، فالـ consistency أقل.`,
w:[`غلط — ده وصف RDBMS.`,`صح — None و Low.`,`غلط — MapReduce مافيهوش ACID.`,`غلط — الـ integrity في MapReduce Low.`],
tip:`RDBMS = ACID + High integrity. MapReduce = None + Low.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`Hadoop interprets the data at processing time rather than at load time. This is called:`,
o:[`Schema-on-write`,`Normalization`,`Schema-on-read`,`Data locality`],a:2,
ex:`السلايد: Hadoop **designed to interpret the data at processing time (so called schema-on-read)**. ده بيدي **flexibility** وبيتجنب **costly data loading phase** بتاع RDBMS، لأن في Hadoop التحميل مجرد **file copy**. أما **schema-on-write** (RDBMS) فبيتأكد من الـ schema قبل ما يخزن.`,
w:[`غلط — schema-on-write = RDBMS، الـ schema بتتطبق وقت الكتابة.`,`غلط — normalization تنظيم جداول RDBMS لتقليل التكرار.`,`صح — schema-on-read.`,`غلط — data locality = نقل الكود للداتا.`],
tip:`Processing/read time → schema-on-read (Hadoop). Before storing → schema-on-write (DB).`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`A MapReduce job takes 1 hour. If you double the size of the input data AND double the size of the cluster, the job will take about:`,
o:[`1 hour`,`2 hours`,`4 hours`,`30 minutes`],a:0,
ex:`MapReduce **scales linearly**. السلايد: لو ضاعفت الداتا، الـ job هيبقى **twice as slowly**. لكن لو كمان ضاعفت الـ cluster، هيشتغل **as fast as the original**. يعني ساعة زي ما هو. السبب: الداتا partitioned والـ map و reduce بيشتغلوا parallel على partitions منفصلة.`,
w:[`صح — داتا ×2 والـ cluster ×2 = نفس الوقت.`,`غلط — ده لو ضاعفت الداتا بس.`,`غلط — مفيش حاجة في السلايد بتقول 4 أضعاف.`,`غلط — ده لو ضاعفت الـ cluster بس على نفس الداتا.`],
tip:`Linear scaling: Data×2 → time×2. Data×2 + Cluster×2 → same time.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'tf',tp:'rdbms',q:`If you double the size of the input data on the same cluster, a MapReduce job will run twice as slowly.`,a:0,
ex:`نص السلايد: **if you double the size of the input data, a job will run twice as slowly**. ده معنى الـ **linear scaling**. والـ RDBMS على العكس **Nonlinear** scaling.`,
w:[`صح — ده الـ linear scaling.`,`غلط — السلايد بيقولها صريحة.`],
tip:`Scaling: RDBMS = Nonlinear، MapReduce = Linear.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`An RDBMS is a good fit for:`,
o:[`Analyzing the whole dataset in a batch fashion`,`Point queries or updates on an indexed dataset, with low-latency retrieval of a relatively small amount of data`,`Processing unstructured image data at petabyte scale`,`Write-once, read-many workloads`],a:1,
ex:`السلايد: **An RDBMS is good for point queries or updates, where the dataset has been indexed to deliver low-latency retrieval and update times of a relatively small amount of data.** في المقابل **MapReduce is a good fit for problems that need to analyze the whole dataset in a batch fashion.** وعشان كده MapReduce بيعتبر **complement** للـ RDBMS مش بديل.`,
w:[`غلط — ده وصف MapReduce.`,`صح — point queries + indexed + low latency + small data.`,`غلط — unstructured و petabyte = Hadoop.`,`غلط — write once read many = MapReduce.`],
tip:`Point query / indexed / low latency / update → RDBMS. Whole dataset / batch → MapReduce.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`According to the lecture, XML documents and database tables that conform to a particular predefined schema are examples of:`,
o:[`Semi-structured data`,`Unstructured data`,`Structured data`,`Binary data`],a:2,
ex:`ده فخ مشهور! في السلايد بالنص: **Structured data is organized into entities that have a defined format, such as XML documents or database tables that conform to a particular predefined schema. This is the realm of the RDBMS.** ناس كتير بتقول XML = semi-structured، بس حسب السلايد هنا هو **structured** (لأنه conform to predefined schema).`,
w:[`غلط حسب السلايد — semi-structured مثالها الـ spreadsheet.`,`غلط — unstructured = plain text أو images.`,`صح — السلايد حاطط XML و DB tables في الـ structured.`,`غلط — مش تصنيف موجود في الجزء ده.`],
tip:`في السلايد: XML + DB tables → Structured. Spreadsheet → Semi. Plain text + image → Unstructured.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`A spreadsheet, in which the structure is the grid of cells although the cells themselves may hold any form of data, is an example of:`,
o:[`Semi-structured data`,`Structured data`,`Unstructured data`,`Normalized data`],a:0,
ex:`السلايد: **Semi-structured data is looser, and though there may be a schema, it is often ignored, so it may be used only as a guide to the structure**. ومثاله **spreadsheet**: الهيكل هو الـ grid، بس كل cell ممكن تحط فيها أي نوع داتا.`,
w:[`صح — spreadsheet = semi-structured.`,`غلط — structured لازم predefined schema ملتزمين بيها.`,`غلط — unstructured مالوش أي structure داخلي (text, image)، والـ spreadsheet ليه grid.`,`غلط — normalization مصطلح RDBMS.`],
tip:`Semi = looser + schema may exist but often ignored + "guide" + spreadsheet.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`Plain text and image data are examples of:`,
o:[`Structured data`,`Semi-structured data`,`Relational data`,`Unstructured data`],a:3,
ex:`السلايد: **Unstructured data does not have any particular internal structure: for example, plain text or image data.** و Hadoop بيشتغل كويس جدًا على unstructured و semi-structured بسبب schema-on-read.`,
w:[`غلط — مفيش predefined schema.`,`غلط — semi ليها هيكل جزئي زي grid الـ spreadsheet.`,`غلط — relational = جداول RDBMS (structured).`,`صح — plain text و images = unstructured.`],
tip:`No internal structure → Unstructured (text, image).`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'tf',tp:'rdbms',q:`Hadoop works well on unstructured or semi-structured data because it is designed to interpret the data at processing time.`,a:0,
ex:`نص السلايد بالظبط: **Hadoop works well on unstructured or semi-structured data because it is designed to interpret the data at processing time (so called schema-on-read).** وده بيوفر flexibility ويتجنب مرحلة الـ loading المكلفة في RDBMS.`,
w:[`صح — بسبب schema-on-read.`,`غلط — السلايد بيقولها صريحة.`],
tip:`Unstructured/semi + Hadoop + السبب = schema-on-read.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`Why does normalization pose problems for Hadoop processing?`,
o:[`It increases data redundancy`,`It makes reading a record a nonlocal operation, while Hadoop assumes high-speed streaming reads and writes`,`It forces Hadoop to use schema-on-read`,`It prevents data from being replicated`],a:1,
ex:`الـ relational data بتكون **normalized** عشان تحافظ على الـ integrity وتشيل التكرار. لكن السلايد بيقول إن ده **makes reading a record a nonlocal operation**، وده ضد افتراض أساسي في Hadoop وهو إنه يقدر يعمل **(high-speed) streaming reads and writes**.`,
w:[`غلط — العكس، الـ normalization بتشيل الـ redundancy.`,`صح — nonlocal read ضد الـ streaming reads.`,`غلط — schema-on-read طبيعة Hadoop أصلاً مش بسبب الـ normalization.`,`غلط — مالهاش علاقة بالـ replication.`],
tip:`Normalization → nonlocal read → مشكلة لـ Hadoop. Logs مش normalized → مناسبة لـ Hadoop.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'m',tp:'rdbms',q:`Why are web server log files particularly well suited to analysis with Hadoop?`,
o:[`They are highly normalized`,`They are small files`,`They are not normalized — e.g., the client hostnames are specified in full each time`,`They require ACID transactions`],a:2,
ex:`السلايد: **A web server log is a good example of a set of records that is not normalized** (اسم الـ client hostname بيتكتب كامل كل مرة حتى لو نفس العميل ظهر كتير). وده سبب إن الـ log files من كل الأنواع مناسبة جدًا لـ Hadoop.`,
w:[`غلط — العكس، هي not normalized.`,`غلط — الـ small files أصلاً مشكلة لـ Hadoop.`,`صح — not normalized.`,`غلط — Hadoop مالوش transactions.`],
tip:`Logs = not normalized = Hadoop-friendly.`,src:`Lecture 2 · MapReduce vs traditional database`},

{s:2,t:'tf',tp:'rdbms',q:`Hadoop cannot perform joins at all.`,a:1,
ex:`السلايد: **Note that Hadoop can perform joins; it's just that they are not used as much as in the relational world.** وفي Lecture 5 اتشرح map-side join و reduce-side join.`,
w:[`غلط — Hadoop يقدر يعمل joins.`,`صح — بيعمل joins بس مش بنفس كتر استخدامها في RDBMS.`],
tip:`Hadoop CAN join (map-side / reduce-side) — بس أقل استخدامًا.`,src:`Lecture 2 · MapReduce vs traditional database`},

/* ───────────── SET 3 — Grid/HPC vs Hadoop, good / not good ───────────── */
{s:3,t:'m',tp:'grid',q:`The high-performance computing (HPC) and grid computing communities have been doing large-scale data processing for years using which API?`,
o:[`RPC`,`MPI (Message Passing Interface)`,`YARN`,`JDBC`],a:1,
ex:`السلايد: HPC و grid computing communities بيستخدموا APIs زي **Message Passing Interface (MPI)**.`,
w:[`غلط — RPC ده اللي Hadoop بيستخدمه في الـ interprocess communication.`,`صح — MPI.`,`غلط — YARN بتاع Hadoop.`,`غلط — JDBC للاتصال بقواعد بيانات.`],
tip:`HPC / Grid → MPI + SAN.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`In the HPC approach, work is distributed across a cluster of machines that access a shared file system hosted by:`,
o:[`HDFS`,`A NameNode`,`A storage area network (SAN)`,`The distributed cache`],a:2,
ex:`السلايد: HPC بيوزع الشغل على cluster، والأجهزة بتوصل لـ **shared file system, hosted by a storage area network (SAN)**. ده كويس للـ **compute-intensive jobs**.`,
w:[`غلط — HDFS بتاع Hadoop.`,`غلط — NameNode بتاع HDFS.`,`صح — SAN.`,`غلط — distributed cache ميزة في MapReduce.`],
tip:`Shared file system + SAN = HPC.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`Why does the HPC approach become a problem when nodes need to access large data volumes (hundreds of gigabytes)?`,
o:[`Network bandwidth becomes the bottleneck and compute nodes become idle`,`The CPUs are too slow`,`MPI cannot handle numbers`,`The SAN uses schema-on-read`],a:0,
ex:`السلايد: الطريقة دي ممتازة للـ compute-intensive، لكن لما الداتا توصل **hundreds of gigabytes** (النقطة اللي Hadoop بيبدأ يلمع فيها) **the network bandwidth is the bottleneck and compute nodes become idle** لأنهم مستنيين الداتا تيجي على الشبكة.`,
w:[`صح — bandwidth bottleneck + idle nodes.`,`غلط — المشكلة مش في الـ CPU.`,`غلط — كلام مالوش أساس.`,`غلط — schema-on-read بتاع Hadoop.`],
tip:`HPC problem = network bandwidth bottleneck → idle nodes. Hadoop fix = data locality.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'tf',tp:'grid',q:`Data flow is exposed by low-level programming in MapReduce.`,a:1,
ex:`سؤال من الكتاب. السلايد: **Grid Computing - Data flow is exposed by low level programming. Whereas, in Hadoop all about high level programming.** يعني الجملة دي وصف الـ Grid مش MapReduce.`,
w:[`غلط — low level = Grid computing.`,`صح — MapReduce/Hadoop = high level programming.`],
tip:`Low level → Grid. High level → Hadoop. أي سؤال يبدّلهم = False.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`Who manages checkpointing and recovery of tasks in Grid computing (MPI) versus Hadoop?`,
o:[`Both are handled by the NameNode`,`Grid: handled automatically — Hadoop: the programmer`,`Grid: the programmer explicitly — Hadoop: the MapReduce processing engine`,`Neither supports recovery`],a:2,
ex:`السلايد: في Grid، الـ MPI programs **explicitly manage their own check pointing and recovery**، وده بيدي **more control** للمبرمج لكن بيخلي الكود **more difficult to write**. في Hadoop ده **managed by MapReduce processing engine**: بيكتشف الـ tasks اللي فشلت ويعيد جدولتها على أجهزة سليمة.`,
w:[`غلط — NameNode بيدير metadata بس.`,`غلط — معكوسة.`,`صح — المبرمج في Grid، والـ engine في Hadoop.`,`غلط — الاتنين فيهم recovery بس بطرق مختلفة.`],
tip:`MPI = more control + harder to write. MapReduce = engine handles failure.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`"Hadoop tries to co-locate the data with the compute nodes, so data access is fast because it is local." This feature is known as:`,
o:[`Replication`,`Data locality`,`High availability`,`Shared-nothing architecture`],a:1,
ex:`السلايد: الميزة دي اسمها **data locality**، و**is at the heart of data processing in Hadoop and is the reason for its good performance**. يعني بدل ما الداتا تتنقل للكود على الشبكة، الكود بيروح للجهاز اللي عليه الداتا.`,
w:[`غلط — replication = نسخ الداتا على أكتر من node.`,`صح — co-locate data with compute = data locality.`,`غلط — HA = الوصول للداتا من path تاني لو جهاز وقع.`,`غلط — shared-nothing = الـ tasks مش معتمدة على بعض.`],
tip:`Move computation to data = Data locality.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`According to the lecture, what is the most precious resource in a data center environment, which Hadoop conserves by explicitly modeling network topology?`,
o:[`CPU cycles`,`RAM`,`Disk space`,`Network bandwidth`],a:3,
ex:`السلايد: **network bandwidth is the most precious resource in a data center environment** (سهل جدًا تعمل saturate للـ links لو بتنقل داتا كتير)، فـ Hadoop بيحافظ عليها عن طريق **explicitly modeling network topology** (يعرف مين في نفس الـ rack). ومع كده ده مش بيمنع إنك تعمل high-CPU analyses على Hadoop.`,
w:[`غلط — مش ده اللي السلايد قاله.`,`غلط.`,`غلط.`,`صح — network bandwidth.`],
tip:`Most precious = network bandwidth → حلها data locality + network topology + combiner.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`What is the hardest aspect of coordinating processes in a large-scale distributed computation?`,
o:[`Gracefully handling partial failure — when you don't know whether a remote process has failed — while still making progress`,`Writing the map function`,`Choosing the block size`,`Sorting the output keys`],a:0,
ex:`السلايد: **The hardest aspect is gracefully handling partial failure — when you don't know whether or not a remote process has failed — and still making progress with the overall computation.** و frameworks زي MapReduce بتريّح المبرمج من التفكير في ده.`,
w:[`صح — partial failure.`,`غلط — الـ map function بسيطة نسبيًا.`,`غلط.`,`غلط — الـ sorting بيتعمل أوتوماتيك في الـ shuffle.`],
tip:`Hardest = partial failure.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'m',tp:'grid',q:`MapReduce can detect failed tasks and reschedule them on healthy machines because it is:`,
o:[`A shared-disk architecture`,`Based on MPI`,`A shared-nothing architecture, meaning tasks have no dependence on one another`,`Using schema-on-write`],a:2,
ex:`السلايد: **MapReduce is able to do this because it is a shared-nothing architecture, meaning that tasks have no dependence on one other.** عشان كده من وجهة نظر المبرمج **the order in which the tasks run doesn't matter**.`,
w:[`غلط — مفيش shared disk؛ ده أقرب للـ SAN بتاع HPC.`,`غلط — MPI بتاع Grid.`,`صح — shared-nothing.`,`غلط — مالهاش علاقة.`],
tip:`Failure handled automatically ← shared-nothing ← tasks independent ← order doesn't matter.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'tf',tp:'grid',q:`MapReduce needs to take more care rerunning a failed reducer than rerunning a failed map task.`,a:0,
ex:`السلايد: الـ shared-nothing ده "slight oversimplification" لأن مخرجات الـ mappers بتدخل للـ reducers. فلما reducer يفشل، لازم النظام يتأكد إنه يقدر يجيب الـ **map outputs** المطلوبة، ولو مش موجودة **regenerate them by running the relevant maps again**.`,
w:[`صح — الـ reducer معتمد على مخرجات الـ maps.`,`غلط — السلايد بيقول الـ reducer محتاج عناية أكتر.`],
tip:`Failed reducer = أصعب (محتاج map outputs). Failed map = أسهل.`,src:`Lecture 2 · Hadoop vs Grid computing`},

{s:3,t:'tf',tp:'hadoop',q:`Hadoop provides low-latency retrieval for queries.`,a:1,
ex:`سؤال من الكتاب. Hadoop **not good for low latency data access** (من سلايد Why & where Hadoop is used / not used). والـ **low-latency retrieval** في السلايدات وصف للـ **RDBMS** (point queries on indexed data). MapReduce batch والـ queries بتاخد دقايق.`,
w:[`غلط — low latency = RDBMS.`,`صح — Hadoop مش مناسب للـ low latency.`],
tip:`Low latency → RDBMS (أو Interactive SQL زي Impala). Hadoop/MapReduce → batch.`,src:`Lecture 4 · Why & where Hadoop is used / not used`},

{s:3,t:'m',tp:'hadoop',q:`Which of the following is Hadoop NOT good for?`,
o:[`Massive amounts of data through parallelism`,`A variety of data (structured, unstructured, semi-structured)`,`Processing lots of small files`,`Running on inexpensive commodity hardware`],a:2,
ex:`سلايد **Why & where Hadoop is used / not used**. Good for: (1) massive data through parallelism (2) variety of data (3) inexpensive commodity hardware. Not good for: (1) transactions (random access) (2) work that cannot be parallelized (3) low latency data access (4) **lots of small files** (5) intensive calculations with little data.`,
w:[`غلط — ده good for.`,`غلط — ده good for.`,`صح — small files مشكلة (NameNode memory + mappers كتير).`,`غلط — ده good for.`],
tip:`Not good: Transactions · Not parallel · Low latency · Small files · Heavy calc on little data.`,src:`Lecture 4 · Why & where Hadoop is used / not used`},

{s:3,t:'m',tp:'hadoop',q:`All of the following are things Hadoop is NOT good for, EXCEPT:`,
o:[`Processing transactions (random access)`,`Work that cannot be parallelized`,`Intensive calculations with little data`,`A variety of data: structured, unstructured and semi-structured`],a:3,
ex:`EXCEPT يعني دوّر على الحاجة اللي Hadoop **كويس** فيها. الـ variety of data من قايمة **What Hadoop is good for**. الباقي كلهم من قايمة **not good for**.`,
w:[`غلط — دي فعلاً not good for.`,`غلط — دي فعلاً not good for.`,`غلط — دي فعلاً not good for.`,`صح — دي good for، فهي الاستثناء.`],
tip:`في أسئلة EXCEPT اقلب السؤال: دوّر على العنصر اللي من القايمة التانية.`,src:`Lecture 4 · Why & where Hadoop is used / not used`},

{s:3,t:'tf',tp:'hadoop',q:`Hadoop can be deployed on commodity servers, which provides low-cost processing as well as storage of unstructured, huge volumes of data.`,a:0,
ex:`سؤال من الكتاب. ميزة **Economic**: Hadoop بيشتغل على **cluster of commodity hardware** ومش محتاج specialized machines. ومن good for: inexpensive commodity hardware + variety of data + massive amounts of data.`,
w:[`صح.`,`غلط — دي من أهم مميزات Hadoop.`],
tip:`Commodity hardware = Economic = low cost.`,src:`Lecture 3 · Features of Hadoop`},

{s:3,t:'m',tp:'grid',q:`Compared to Hadoop, Grid computing resources are:`,
o:[`Much cheaper, because they use commodity hardware`,`Highly expensive`,`Free and open source`,`Equal in cost`],a:1,
ex:`السلايد: **Grid Computing resources are highly expensive as compared to Hadoop.** و Hadoop أرخص لأنه بيشتغل على commodity hardware.`,
w:[`غلط — ده وصف Hadoop.`,`صح — Grid مكلف جدًا.`,`غلط.`,`غلط.`],
tip:`Grid = expensive + low level + programmer handles recovery + SAN. Hadoop = cheap + high level + engine handles failure + data locality.`,src:`Lecture 2 · Hadoop vs Grid computing`},

/* ───────────── SET 4 — Hadoop definition, components, features ───────────── */
{s:4,t:'m',tp:'hadoop',q:`Which statement about Hadoop's programming languages is correct?`,
o:[`Hadoop can only be programmed in Java`,`Hadoop was developed in C++, and Java is optional`,`Hadoop was developed in Java; Java is the main language, but other languages such as R, Python or Ruby can also be used`,`Hadoop is programmed only in SQL`],a:2,
ex:`السلايد (Definition of Hadoop): Hadoop **middleware platform that manages a cluster of computers that was developed in Java**، و**Although Java is main programming language for Hadoop other languages could be used: R, Python or Ruby**.`,
w:[`غلط — كلمة "only" هي الفخ.`,`غلط — اتكتب بـ Java.`,`صح.`,`غلط.`],
tip:`Hadoop = Java (main) + R / Python / Ruby ممكن.`,src:`Lecture 3 · Definition of Hadoop`},

{s:4,t:'m',tp:'hadoop',q:`The Hadoop 2 framework consists of which three core components?`,
o:[`HDFS, Hive and Spark`,`MapReduce, YARN and HDFS`,`NameNode, Solr and Kafka`,`MPI, SAN and YARN`],a:1,
ex:`سلايد **Hadoop 2 framework**: (1) **MapReduce** = system for parallel processing of large data sets بيطبق الـ MapReduce model (2) **YARN** = framework for job scheduling and cluster resource management (3) **HDFS** = high performance distributed file system.`,
w:[`غلط — Hive و Spark أدوات في الـ ecosystem مش الـ core.`,`صح.`,`غلط — Solr و Kafka مش core.`,`غلط — MPI و SAN بتوع HPC.`],
tip:`Hadoop 2 = HDFS (storage) + YARN (resources/scheduling) + MapReduce (processing).`,src:`Lecture 3 · Hadoop 2 framework`},

{s:4,t:'m',tp:'hadoop',q:`Which Hadoop 2 component is the framework for job scheduling and cluster resource management?`,
o:[`HDFS`,`MapReduce`,`NameNode`,`YARN`],a:3,
ex:`**YARN** = framework for **job scheduling and cluster resource management**. وفي Data Flow: **The tasks are scheduled using YARN and run on nodes in the cluster.**`,
w:[`غلط — HDFS = تخزين.`,`غلط — MapReduce = معالجة.`,`غلط — NameNode = metadata في HDFS.`,`صح — YARN.`],
tip:`Scheduling / resources → YARN.`,src:`Lecture 3 · Hadoop 2 framework`},

{s:4,t:'m',tp:'hadoop',q:`Which Hadoop feature means new nodes can be added on the fly without any downtime?`,
o:[`Horizontal scalability`,`Fault tolerance`,`Data locality`,`Open source`],a:0,
ex:`الميزة رقم 6 **Scalability**: Hadoop highly scalable، وده بيدي **horizontal scalability which means new nodes can be added on the fly without any downtime**.`,
w:[`صح.`,`غلط — fault tolerance = استرجاع الداتا لو node وقع.`,`غلط — data locality = الكود يروح للداتا.`,`غلط — open source = تعديل الكود.`],
tip:`Add nodes on the fly / no downtime → Horizontal scalability.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'m',tp:'hadoop',q:`"Due to replication of data in the cluster, data is stored reliably on the cluster of machines despite machine failures." Which Hadoop feature is this?`,
o:[`High availability`,`Reliability`,`Economic`,`Distributed processing`],a:1,
ex:`ركّز في الفرق بين الـ 3 الشبيهين:
**Fault tolerance**: لو node وقع، الداتا تترجع من nodes تانية، والـ failures بتتعالج **automatically**.
**Reliability**: بسبب الـ **replication** الداتا **stored reliably** رغم الأعطال.
**High availability**: الداتا **accessible** رغم عطل الهاردوير، ولو جهاز وقع **accessed from another path**.
الجملة هنا فيها "stored reliably" → Reliability.`,
w:[`غلط — HA كلمتها "accessed from another path".`,`صح — "stored reliably" + replication.`,`غلط — Economic = commodity hardware.`,`غلط — Distributed processing = parallel processing على nodes.`],
tip:`stored reliably → Reliability · accessed from another path → High availability · recovered automatically → Fault tolerance.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'m',tp:'hadoop',q:`"If a machine or a few hardware components crash, data will be accessed from another path." Which Hadoop feature is this?`,
o:[`Reliability`,`Scalability`,`High availability`,`Easy to use`],a:2,
ex:`الميزة رقم 5 **High Availability**: **Data is highly available and accessible despite hardware failure due to multiple copies of data. If a machine or few hardware crashes, then data will be accessed from another path.**`,
w:[`غلط — Reliability كلمتها "stored reliably".`,`غلط — Scalability = إضافة nodes.`,`صح.`,`غلط — Easy to use = الـ framework بيتعامل مع الـ distributed computing.`],
tip:`another path → High availability.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'m',tp:'hadoop',q:`In the list of Hadoop features, "Data Locality" means:`,
o:[`Data is copied to the machine where the algorithm was submitted`,`All data is stored on one local machine`,`The MapReduce algorithm is moved to the data in the cluster, rather than bringing the data to where the algorithm was submitted`,`Data is stored in a local RDBMS`],a:2,
ex:`الميزة رقم 9: **When a client submits the MapReduce algorithm, this algorithm is moved to data in the cluster rather than bringing data to the location where the algorithm is submitted and then processing it.** نقل الكود (صغير) أرخص بكتير من نقل الداتا (ضخمة).`,
w:[`غلط — ده العكس بالظبط.`,`غلط — الداتا distributed.`,`صح — move algorithm to data.`,`غلط.`],
tip:`Data locality = bring the code to the data, not the data to the code.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'tf',tp:'hadoop',q:`The "Open Source" feature of Hadoop means its code can be modified according to business requirements.`,a:0,
ex:`الميزة رقم 1: **Apache Hadoop is an open source project. It means its code can be modified according to business requirements.**`,
w:[`صح.`,`غلط — ده التعريف حرفيًا.`],
tip:`Open source → modify code per business requirements.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'tf',tp:'hadoop',q:`Hadoop requires specialized, high-end machines to run efficiently.`,a:1,
ex:`ميزة **Economic**: **Apache Hadoop is not very expensive as it runs on a cluster of commodity hardware. We do not need any specialized machine for it.** وكمان سهل تضيف nodes من غير downtime ومن غير pre-planning كتير.`,
w:[`غلط — commodity hardware.`,`صح — مش محتاج specialized machines.`],
tip:`specialized / expensive machines → False لـ Hadoop.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'m',tp:'hadoop',q:`The "Easy to use" feature of Hadoop means:`,
o:[`The client does not need to deal with distributed computing; the framework takes care of all the things`,`Hadoop has a graphical drag-and-drop interface`,`Hadoop needs no programming at all`,`Hadoop runs only on a single machine`],a:0,
ex:`الميزة رقم 8: **No need of client to deal with distributed computing, the framework takes care of all the things.**`,
w:[`صح.`,`غلط — مش مذكور.`,`غلط — لسه بتكتب map و reduce.`,`غلط — Hadoop cluster.`],
tip:`Easy to use = framework handles distribution.`,src:`Lecture 3 · Features of Hadoop`},

{s:4,t:'m',tp:'hadoop',q:`What is the role of the NameNode in HDFS?`,
o:[`It stores the actual data blocks on its local disk`,`It manages the metadata: file names and locations, how files are split into blocks, and which DataNode stores each block`,`It runs the reduce tasks`,`It compresses sequence files`],a:1,
ex:`**NameNode = Metadata Manager** و **master of HDFS**: بيدير أسماء الملفات وأماكنها، إزاي الملف اتقسم لـ blocks، وأنهي DataNode شايل كل block. **Does NOT store the actual data**. وعشان كده كل file/block بياخد object في الـ RAM بتاعه (~150 bytes) — ودي مشكلة الـ small files.`,
w:[`غلط — ده شغل DataNode.`,`صح — metadata فقط.`,`غلط — الـ reduce tasks بتشتغل على nodes بتجدولها YARN.`,`غلط.`],
tip:`NameNode = metadata (master). DataNode = actual blocks (workers).`,src:`HDFS · NameNode vs DataNode`},

{s:4,t:'tf',tp:'hadoop',q:`The NameNode stores the actual data blocks of HDFS files.`,a:1,
ex:`الـ NameNode **does NOT store the actual data** وبيحتفظ بالـ **metadata information only**. اللي بيخزن الـ blocks على local disk هو الـ **DataNode**، وبيعمل replicate للداتا عشان fault tolerance.`,
w:[`غلط — ده DataNode.`,`صح.`],
tip:`Actual data → DataNode.`,src:`HDFS · NameNode vs DataNode`},

{s:4,t:'m',tp:'hadoop',q:`Which of the following is NOT a responsibility of a DataNode?`,
o:[`Storing the blocks on local disk`,`Serving data when requested (read and write operations)`,`Sending status to the NameNode`,`Keeping the mapping of which DataNode stores each block`],a:3,
ex:`الـ DataNode: بيخزن الـ blocks على local disk، بيخدم الداتا لما تتطلب، بيتعامل مع read/write، وبيبعت status للـ NameNode. لكن **mapping أنهي DataNode شايل أنهي block** ده metadata = شغل **NameNode**.`,
w:[`غلط — دي فعلاً شغل DataNode.`,`غلط — دي فعلاً شغل DataNode.`,`غلط — دي فعلاً شغل DataNode.`,`صح — دي شغل NameNode.`],
tip:`"Which DataNode stores each block" = metadata = NameNode.`,src:`HDFS · NameNode vs DataNode`},

{s:4,t:'m',tp:'patterns',q:`The term "Hadoop" is sometimes used to refer to:`,
o:[`Only HDFS`,`Only the MapReduce engine`,`A larger ecosystem of projects that fall under the umbrella of infrastructure for distributed computing and large-scale data processing`,`A relational database product`],a:2,
ex:`السلايد: **The term "Hadoop" is sometimes used to refer to a larger ecosystem of projects, not just HDFS and MapReduce, that fall under the umbrella of infrastructure for distributed computing and large-scale data processing.**`,
w:[`غلط — "not just HDFS".`,`غلط — "not just MapReduce".`,`صح.`,`غلط.`],
tip:`Hadoop (wide sense) = ecosystem.`,src:`Lecture 2 · MapReduce Engine`},

{s:4,t:'m',tp:'patterns',q:`Despite the emergence of other processing frameworks on Hadoop, why do we still study MapReduce?`,
o:[`Because it is faster than Spark for iterative jobs`,`Because it still has a place for batch processing, and it introduces concepts that apply more generally, like input formats and how a dataset is split into pieces`,`Because it supports ACID transactions`,`Because it is the only framework that supports real-time processing`],a:1,
ex:`السلايد (Why do we still study MapReduce?): MapReduce **still has a place for batch processing**، ومفيد تفهمه لأنه بيقدم مفاهيم عامة **like the idea of input formats, or how a dataset is split into pieces**.`,
w:[`غلط — MapReduce مش مناسب للـ iterative.`,`صح.`,`غلط — MapReduce transactions = None.`,`غلط — real time = Flink.`],
tip:`Why study MR? batch + concepts (input formats, splits).`,src:`Lecture 2 · Why do we still study MapReduce`},

/* ───────────── SET 5 — MapReduce framework, splits, data locality ───────────── */
{s:5,t:'m',tp:'mr',q:`MapReduce works by breaking the processing into two phases. Each phase has:`,
o:[`Tables as input and output`,`Key-value pairs as input and output, whose types may be chosen by the programmer`,`Only strings as input`,`A fixed type defined by HDFS`],a:1,
ex:`السلايد: **MapReduce works by breaking the processing into two phases: the map phase and the reduce phase. Each phase has key-value pairs as input and output, the types of which may be chosen by the programmer.** والمبرمج بيكتب دالتين: **map function** و **reduce function**.`,
w:[`غلط — مش tables.`,`صح.`,`غلط — الأنواع بيختارها المبرمج.`,`غلط.`],
tip:`MapReduce = 2 phases + key-value in/out + programmer picks types.`,src:`Lecture 3 · MapReduce framework`},

{s:5,t:'m',tp:'mr',q:`The Mapper class is a generic type. How many formal type parameters does it have?`,
o:[`Two: input and output`,`Three: key, value and context`,`Four: input key, input value, output key and output value`,`Five: input key, input value, output key, output value and combiner`],a:2,
ex:`السلايد: **The Mapper class is a generic type, with four formal type parameters that specify the input key, input value, output key, and output value types of the map function.** مثال: ~Mapper<Object, Text, Text, IntWritable>~. ونفس الكلام للـ Reducer (4 parameters).`,
w:[`غلط.`,`غلط — Context مش type parameter.`,`صح — 4.`,`غلط — مفيش combiner في الـ generic.`],
tip:`Mapper<KEYIN, VALUEIN, KEYOUT, VALUEOUT> = 4.`,src:`Lecture 3 · MapReduce framework`},

{s:5,t:'m',tp:'mr',q:`A mapper is typically a relatively small program whose job is to:`,
o:[`Read a portion of the input data, interpret, filter or transform it, and produce a stream of <key, value> pairs`,`Aggregate all values that share the same key`,`Manage the metadata of HDFS`,`Schedule tasks on the cluster`],a:0,
ex:`السلايد: **A mapper ... is responsible for reading a portion of the input data, interpreting, filtering or transforming the data as necessary and then finally producing a stream of <key, value> pairs.** والـ MapReduce environment بيبعت الـ map program لكل جهاز عليه block من الملف. كل ما الملف والـ cluster يكبروا، mappers أكتر بتشتغل.`,
w:[`صح.`,`غلط — ده شغل الـ reducer.`,`غلط — ده NameNode.`,`غلط — ده YARN.`],
tip:`Mapper = read portion + filter/transform + emit (k,v).`,src:`Lecture 3 · MapReduce: Mappers`},

{s:5,t:'m',tp:'mr',q:`What is the role of reducers in a MapReduce job?`,
o:[`Reading raw input splits from HDFS`,`Sorting and/or aggregating all of the values for the key they were assigned to work on, then emitting key/value pairs to storage`,`Splitting files into blocks`,`Replicating data across nodes`],a:1,
ex:`السلايد: **Reducers are the last part of MapReduce framework ... responsible for sorting and/or aggregating all of the values with the key that it was assigned to work on.** بعدين بيطلع key/value pairs بتتكتب على storage وممكن تبقى input لـ MapReduce job تاني. مثال: جمع إجمالي المبيعات لكل state.`,
w:[`غلط — ده mapper/RecordReader.`,`صح.`,`غلط — ده HDFS.`,`غلط — ده HDFS.`],
tip:`Reducer = last stage + aggregate per key.`,src:`Lecture 3 · MapReduce: reducers`},

{s:5,t:'tf',tp:'mr',q:`In MapReduce, the more unique keys you have, the more parallelism you get in the reduce phase.`,a:0,
ex:`نص السلايد: **The more unique keys you have the more parallelism you get.** لأن كل key بيروح لـ reducer، فلو عندك keys قليلة الـ reducers هيبقوا قليلين.`,
w:[`صح.`,`غلط.`],
tip:`More unique keys → more reducer parallelism.`,src:`Lecture 3 · MapReduce: reducers`},

{s:5,t:'m',tp:'mr',q:`What is the main purpose of a combiner function in MapReduce?`,
o:[`To replace the reducer completely`,`To join two datasets`,`To minimize the data shuffled between map and reduce tasks, since MapReduce is limited by cluster bandwidth`,`To split files into blocks`],a:2,
ex:`السلايد: **MapReduce applications are limited by the bandwidth available on the cluster**، فـ **It pays to minimize the data shuffled between map and reduce tasks**. Hadoop بيسمح بـ **combiner function (just like the reduce function) to be run on a map output**. في الـ word count بدل ما تبعت (the,1) 3 مرات، الـ combiner يبعت (the,3) مرة واحدة. وفي الـ driver ممكن ~setCombinerClass(wordcountreducer.class)~.`,
w:[`غلط — الـ combiner مش بديل للـ reducer، بيشتغل قبله على map output.`,`غلط — الـ joins حاجة تانية.`,`صح.`,`غلط — ده HDFS.`],
tip:`Combiner = mini-reducer على map output → يقلل shuffle → يوفر bandwidth.`,src:`Lecture 3 · MapReduce: Combiners`},

{s:5,t:'m',tp:'mr',q:`A MapReduce job is a unit of work that the client wants to be performed. It consists of:`,
o:[`The input data, the MapReduce program, and configuration information`,`The NameNode, DataNode and YARN`,`Only the map function`,`The block, the split and the replica`],a:0,
ex:`السلايد (Data Flow): **MapReduce job is a unit of work that the client wants to be performed: it consists of the input data, the MapReduce program, and configuration information.** و Hadoop بيقسم الـ job لـ **tasks** نوعين: **map tasks** و **reduce tasks**.`,
w:[`صح.`,`غلط — دي مكونات Hadoop.`,`غلط.`,`غلط.`],
tip:`Job = input data + program + configuration. Job → tasks (map + reduce).`,src:`Lecture 3 · Data Flow in MapReduce`},

{s:5,t:'m',tp:'mr',q:`What happens if a MapReduce task fails?`,
o:[`The whole job is cancelled`,`The programmer must restart it manually from a checkpoint`,`It is automatically rescheduled to run on a different node`,`The NameNode reruns it on the same node`],a:2,
ex:`السلايد: **The tasks are scheduled using YARN and run on nodes in the cluster. If a task fails, it will be automatically rescheduled to run on a different node.**`,
w:[`غلط.`,`غلط — ده أسلوب MPI/Grid.`,`صح.`,`غلط — مش NameNode ومش نفس الـ node.`],
tip:`Task fails → auto rescheduled on a DIFFERENT node.`,src:`Lecture 3 · Data Flow in MapReduce`},

{s:5,t:'m',tp:'splits',q:`How many map tasks does Hadoop create for a job?`,
o:[`One map task per HDFS replica`,`One map task for the whole file`,`One map task per reducer`,`One map task for each input split`],a:3,
ex:`السلايد: **Hadoop divides the input to a MapReduce job into fixed-size pieces called input splits ... Hadoop creates one map task for each split, which runs the user-defined map function for each record in the split.**`,
w:[`غلط.`,`غلط.`,`غلط — مفيش علاقة.`,`صح — 1 split = 1 map task.`],
tip:`# map tasks = # splits.`,src:`Lecture 3 · Data Flow in MapReduce`},

{s:5,t:'m',tp:'splits',q:`What happens if input splits are too small?`,
o:[`Load balancing becomes impossible`,`The overhead of managing the splits and creating map tasks begins to dominate the total job execution time`,`Data locality is guaranteed`,`The reducers run faster`],a:1,
ex:`الـ splits الصغيرة بتحسّن الـ **load balancing** (الجهاز الأسرع ياخد splits أكتر، والـ fine-grained أحسن). لكن السلايد: **if splits are too small, the overhead of managing the splits and map task creation begins to dominate the total job execution time.** عشان كده الحل الوسط: split = block size.`,
w:[`غلط — الصغيرة بتحسن الـ load balancing.`,`صح.`,`غلط.`,`غلط.`],
tip:`Small splits = better load balancing لحد حد معين. Too small = overhead dominates.`,src:`Lecture 3 · Data Flow in MapReduce`},

{s:5,t:'m',tp:'splits',q:`For most jobs, a good split size tends to be:`,
o:[`1 MB`,`64 KB`,`The size of an HDFS block, which is 128 MB by default`,`The size of the whole file`],a:2,
ex:`السلايد: **For most jobs, a good split size tends to be the size of an HDFS block, which is 128 MB by default**، وممكن تتغير للـ cluster كله (للملفات الجديدة) أو تتحدد لكل ملف وقت إنشائه.`,
w:[`غلط.`,`غلط.`,`صح — 128 MB.`,`غلط — ده يلغي الـ parallelism.`],
tip:`Block default = 128 MB = optimal split size.`,src:`Lecture 3 · Data Flow in MapReduce`},

{s:5,t:'m',tp:'splits',q:`Why is the optimal split size the same as the block size?`,
o:[`Because it is the largest size of input that can be guaranteed to be stored on a single node`,`Because blocks are always compressed`,`Because reducers require it`,`Because the NameNode cannot store smaller splits`],a:0,
ex:`السلايد: **it is the largest size of input that can be guaranteed to be stored on a single node.** لو الـ split امتد على 2 blocks، غالبًا مفيش node شايل الاتنين، فجزء من الـ split لازم يتنقل على الشبكة للـ node اللي شغال عليه الـ map، وده أقل كفاءة من إن الـ map كله يشتغل على local data.`,
w:[`صح.`,`غلط.`,`غلط.`,`غلط.`],
tip:`Split = block لأنه أكبر حجم مضمون يبقى على node واحد → data locality.`,src:`Lecture 3 · Data locality`},

{s:5,t:'m',tp:'splits',q:`In the data locality figure, a map task runs on a different node than the one holding its HDFS block, but in the same rack. This is called:`,
o:[`Data-local (a)`,`Rack-local (b)`,`Off-rack (c)`,`Node-remote (d)`],a:1,
ex:`الشكل فيه 3 حالات:
**(a) Data-local**: الـ map task على نفس الـ node اللي عليه الـ block (الأفضل، مفيش bandwidth).
**(b) Rack-local**: الـ nodes اللي عليها replicas مشغولة، فالـ scheduler بيدور على free map slot في **نفس الـ rack**.
**(c) Off-rack**: نادرًا، ولا ده متاح، فبيستخدم node في rack تاني → **inter-rack network transfer**.`,
w:[`غلط — data-local يعني نفس الـ node.`,`صح — نفس الـ rack، node مختلف.`,`غلط — off-rack يعني rack مختلف.`,`غلط — مش مسمى موجود.`],
tip:`a = same node · b = same rack · c = other rack (inter-rack transfer). الترتيب ده ترتيب الأفضلية.`,src:`Lecture 3 · Data locality`},

{s:5,t:'m',tp:'splits',q:`Where do map tasks write their output, and why?`,
o:[`To HDFS, so it is replicated`,`To the NameNode memory`,`To the local disk, not HDFS, because map output is intermediate output processed by reduce tasks`,`Directly to the client`],a:2,
ex:`السلايد: **Map tasks write their output to the local disk, not to HDFS. Why? Map output is intermediate output: it's processed by reduce tasks to produce the final output.** فمش محتاج replication في HDFS (هيبقى إسراف)، وبعد ما الـ job يخلص الـ map output بيترمي.`,
w:[`غلط — مش HDFS.`,`غلط.`,`صح — local disk لأنه intermediate.`,`غلط.`],
tip:`Map output → local disk (intermediate). Reduce output → HDFS (final).`,src:`Lecture 3 · Data locality`},

{s:5,t:'tf',tp:'splits',q:`Reduce tasks have the advantage of data locality, just like map tasks.`,a:1,
ex:`السلايد: **Reduce tasks don't have the advantage of data locality; the input to a single reduce task is normally the output from all mappers.** يعني الـ reducer لازم يسحب الداتا من كل الـ mappers على الشبكة (shuffle).`,
w:[`غلط.`,`صح — الـ reducers مالهمش data locality.`],
tip:`Data locality = للـ map tasks بس.`,src:`Lecture 3 · Data locality`},

/* ───────────── SET 6 — InputFormat, RecordReader, SequenceFile ───────────── */
{s:6,t:'m',tp:'input',q:`Among InputFormat, InputSplit and RecordReader, which one actually reads the data and converts it into (key, value) pairs for the mapper?`,
o:[`InputFormat`,`InputSplit`,`RecordReader`,`OutputFormat`],a:2,
ex:`الـ 3 classes الأساسية لقراءة الداتا في MapReduce:
**InputFormat** = **How** to read and split the data (المخطِّط).
**InputSplit** = **What** portion to process (الـ chunk المنطقي اللي بيروح لـ mapper واحد).
**RecordReader** = **Actually reading** the data وتحويلها لـ (key, value). مثال: **LineRecordReader** بيطلع (byte offset, line).`,
w:[`غلط — InputFormat بيحدد إزاي تتقرا وتتقسم.`,`غلط — InputSplit بيحدد أنهي جزء.`,`صح.`,`غلط — OutputFormat للكتابة.`],
tip:`InputFormat = How · InputSplit = What · RecordReader = Actually reads.`,src:`Lecture 4 · Reading data in MapReduce`},

{s:6,t:'m',tp:'input',q:`What is the default InputFormat in Hadoop MapReduce?`,
o:[`KeyValueTextInputFormat`,`TextInputFormat`,`NLineInputFormat`,`SequenceFileInputFormat`],a:1,
ex:`**TextInputFormat is the default InputFormat.** كل record = سطر. الـ key = **LongWritable** = byte offset لبداية السطر، والـ value = محتوى السطر من غير line terminators كـ **Text**.`,
w:[`غلط — ده بيقسم السطر عند الـ tab.`,`صح — default.`,`غلط — ده لعدد سطور ثابت لكل mapper.`,`غلط — ده للـ binary.`],
tip:`Default = TextInputFormat (key = offset, value = line).`,src:`Lecture 4 · MapReduce: InputFormat`},

{s:6,t:'m',tp:'input',q:`In TextInputFormat, what are the key and value of each record?`,
o:[`Key: line number (IntWritable) — Value: the line contents`,`Key: everything up to the first tab — Value: the rest of the line`,`Key: the byte offset of the beginning of the line (LongWritable) — Value: the line contents, excluding line terminators (Text)`,`Key: file name — Value: file content`],a:2,
ex:`السلايد: **The key, a LongWritable, is the byte offset within the file of the beginning of the line. The value is the contents of the line, excluding any line terminators (e.g., newline or carriage return), and is packaged as a Text object.** خلي بالك: الـ key مش رقم السطر، ده عدد الـ bytes من أول الملف.`,
w:[`غلط — مش line number. ده الفخ.`,`غلط — ده KeyValueTextInputFormat.`,`صح.`,`غلط — ده الفكرة في مثال SequenceFile (filename key, content value).`],
tip:`TextInputFormat key = byte OFFSET (LongWritable)، مش line number.`,src:`Lecture 4 · Text input format`},

{s:6,t:'tf',tp:'input',q:`The key in TextInputFormat is the offset number and the value is the contents of the line.`,a:0,
ex:`سؤال من الكتاب، وإجابته True. الـ key = **byte offset** (LongWritable)، والـ value = **line contents** (Text). نفس الكلام في جدول InputFormat: Key = The byte offset of the line، Value = The line contents.`,
w:[`صح.`,`غلط.`],
tip:`TextInputFormat: (offset, line).`,src:`Lecture 4 · MapReduce: InputFormat`},

{s:6,t:'m',tp:'input',q:`A file contains these lines (each ends with a newline):
"On the top of the Crumpetty Tree" (32 chars)
"The Quangle Wangle sat," (23 chars)
"But his face you could not see,"
Using TextInputFormat, what is the key of the THIRD record?`,
o:[`2`,`56`,`57`,`89`],a:2,
ex:`الـ key = byte offset لبداية السطر. السطر الأول يبدأ عند **0**. السطر التاني يبدأ بعد 32 حرف + 1 newline = **33**. السطر التالت يبدأ عند 33 + 23 + 1 = **57**. وده بالظبط مثال السلايد: (0, ...) (33, ...) (57, ...) (89, ...).`,
w:[`غلط — ده رقم السطر (index من 0)، والـ key مش رقم سطر.`,`غلط — نسيت تحسب الـ newline.`,`صح — 33 + 23 + 1 = 57.`,`غلط — 89 هو key السطر الرابع.`],
tip:`next offset = previous offset + line length + 1 (newline).`,src:`Lecture 4 · Text input format example`},

{s:6,t:'m',tp:'input',q:`In KeyValueTextInputFormat, what is the key of each record by default?`,
o:[`The byte offset of the line`,`Everything up to the first tab character`,`The file name`,`A user-defined binary key`],a:1,
ex:`**KeyValueTextInputFormat** بيقسم كل سطر لـ (K, V): الـ key = **everything up to the first tab character**، والـ value = **the remainder of the line**. الـ separator ممكن يتغير بالـ property ~mapreduce.input.keyvaluelinerecordreader.key.value.separator~ وهو **tab by default**. مفيد مع output الـ **TextOutputFormat** (الـ default OutputFormat) لأنه بيطلع key tab value.`,
w:[`غلط — ده TextInputFormat و NLineInputFormat.`,`صح.`,`غلط.`,`غلط — ده SequenceFileInputFormat.`],
tip:`KeyValue → split at first TAB. مثال: line1→text = (line1, text).`,src:`Lecture 4 · Key-value input format`},

{s:6,t:'tf',tp:'input',q:`With TextInputFormat and KeyValueTextInputFormat, each mapper receives a fixed number of lines of input.`,a:1,
ex:`سؤال من الكتاب. السلايد: **With TextInputFormat and KeyValueTextInputFormat, each mapper receives a variable number of lines of input.** العدد بيعتمد على **size of the split** و **length of the lines**. لو عايز عدد ثابت تستخدم **NLineInputFormat**.`,
w:[`غلط — variable مش fixed.`,`صح.`],
tip:`Fixed number of lines → NLineInputFormat فقط.`,src:`Lecture 4 · NLineInputFormat`},

{s:6,t:'m',tp:'input',q:`Using NLineInputFormat with N = 2 on a 4-line file, how many mappers receive input?`,
o:[`1`,`2`,`4`,`8`],a:1,
ex:`**N** = عدد السطور لكل mapper. لو N = 2 يبقى كل split فيه سطرين: mapper ياخد (0,...),(33,...) وmapper تاني ياخد (57,...),(89,...). يبقى **2 mappers**. الـ **default N = 1** (كل mapper سطر واحد)، وبيتحكم فيها property ~mapreduce.input.lineinputformat.linespermap~.`,
w:[`غلط.`,`صح — 4 ÷ 2 = 2.`,`غلط — ده لو N = 1 (الـ default).`,`غلط.`],
tip:`# mappers = lines ÷ N. Default N = 1.`,src:`Lecture 4 · NLineInputFormat`},

{s:6,t:'m',tp:'input',q:`What is the difference between NLineInputFormat and TextInputFormat?`,
o:[`NLineInputFormat uses the tab character as the key`,`NLineInputFormat reads binary data`,`The keys and values are the same (byte offset, line); the difference is in the way the splits are constructed`,`NLineInputFormat has no keys`],a:2,
ex:`السلايد: **The keys and values are the same as those that TextInputFormat produces. The difference is in the way the splits are constructed.** يعني (offset, line) زي بعض، بس NLine بتضمن عدد سطور ثابت لكل split.`,
w:[`غلط — ده KeyValue.`,`غلط — ده SequenceFile.`,`صح.`,`غلط.`],
tip:`NLine vs Text: same (k,v), different splits.`,src:`Lecture 4 · NLineInputFormat`},

{s:6,t:'m',tp:'seq',q:`Why are sequence files well suited as a format for MapReduce data?`,
o:[`They are text files that humans can read easily`,`They are splittable (sync points), they support compression as part of the format, and they can store arbitrary types using a variety of serialization frameworks`,`They use schema-on-write`,`They are always smaller than 1 KB`],a:1,
ex:`Hadoop's **sequence file** بيخزن sequences of **binary key-value pairs**. مناسب لـ MapReduce لأنه: (1) **splittable** — فيه **sync points** تخلي الـ reader يلاقي حدود الـ records من أي نقطة زي بداية split (2) **support compression** (3) يخزن **arbitrary types**. ولقراءته تستخدم **SequenceFileInputFormat** (key و value = user-defined).`,
w:[`غلط — ده binary.`,`صح.`,`غلط.`,`غلط.`],
tip:`SequenceFile = binary + splittable (sync points) + compression + arbitrary types.`,src:`Lecture 4 · Binary input format`},

{s:6,t:'m',tp:'seq',q:`SequenceFile is one of the solutions to which problem in Hadoop?`,
o:[`The small file problem`,`The partial failure problem`,`The schema-on-write problem`,`The interactive SQL problem`],a:0,
ex:`السلايد: **SequenceFile is one of the solutions to small file problem in Hadoop.** الـ small file = أصغر بكتير من الـ block (128MB). المشكلة على وجهين:
**HDFS**: كل file/block = object ~150 bytes في RAM الـ NameNode. 10 مليون ملف ≈ 3 GB، ومليار ملف مش ممكن.
**MapReduce**: كل ملف صغير = split = mapper، فعدد mappers ضخم والـ job يبطأ.
الحل: تحط الملفات الصغيرة في ملف كبير واحد (filename = key، content = value).`,
w:[`صح.`,`غلط — ده بيتحل بـ shared-nothing.`,`غلط.`,`غلط — ده Impala/Tez.`],
tip:`Small files → SequenceFile (filename=key, content=value).`,src:`Lecture 4 · SequenceFile`},

{s:6,t:'m',tp:'seq',q:`You store 10,000 small files (100 KB each, each in one block) in HDFS. Approximately how many objects does the NameNode keep in RAM, and how much memory?`,
o:[`10,000 objects ≈ 1.5 MB`,`20,000 objects ≈ 3 MB`,`9 objects ≈ 1.4 KB`,`30,000 objects ≈ 4.5 MB`],a:1,
ex:`كل ملف بيكلّف الـ NameNode على الأقل **2 objects**: **File object** (name, path, permissions, owner, timestamps, list of blocks) + **Block object** (block ID, size, DataNodes holding replicas). القاعدة: **~150 bytes لكل object**.
10,000 × 2 = **20,000 objects** × 150 bytes ≈ **3 MB**.`,
w:[`غلط — نسيت الـ block object.`,`صح.`,`غلط — ده بعد ما تجمعهم في SequenceFile واحد.`,`غلط.`],
tip:`Small file = 1 file + 1 block = 2 objects × 150 B.`,src:`Lecture 4 · SequenceFile`},

{s:6,t:'m',tp:'seq',q:`The same 10,000 files (1 GB total) are packed into one SequenceFile with a 128 MB block size. How many NameNode objects are needed?`,
o:[`2`,`8`,`9`,`10,001`],a:2,
ex:`1 GB ÷ 128 MB = **8 blocks**. يعني **1 file object + 8 block objects = 9 objects** ≈ 9 × 150 bytes ≈ **1.4 KB** بدل 3 MB. وكمان بدل ~10,000 mapper (لأن كل ملف صغير split لوحده) هيبقوا ~8 mappers.`,
w:[`غلط.`,`غلط — نسيت الـ file object.`,`صح — 1 + 8.`,`غلط.`],
tip:`objects = 1 (file) + (file size ÷ 128MB) blocks.`,src:`Lecture 4 · SequenceFile`},

{s:6,t:'m',tp:'input',q:`A line in a text file starts at the end of Block 1 and finishes at the beginning of Block 2. Which input split processes it?`,
o:[`The first split; splits honor logical record boundaries, and the LineRecordReader reads the remaining bytes from Block 2`,`The second split only`,`Both splits, so the line is processed twice`,`Neither split; the line is dropped`],a:0,
ex:`السلايد (Hadoop Definitive Guide): حدود السطور مش متطابقة مع حدود الـ blocks. **Splits honor logical record boundaries**، فالـ split الأول بيحتوي line 5 حتى لو امتدت على block 1 و 2، والـ split التاني يبدأ من line 6. في سيناريو Website Traffic: الـ **LineRecordReader** بيكمل السطر وبينقل **الـ bytes الزيادة بس** على الشبكة (~22 bytes) — من غير duplicates ولا missing data.`,
w:[`صح.`,`غلط — الـ split التاني يبدأ بعد السطر ده.`,`غلط — Hadoop بيتجنب الـ duplicates.`,`غلط — Hadoop بيتجنب الـ missing data.`],
tip:`Line across blocks → belongs to the split where it STARTS; reader fetches extra bytes.`,src:`Lecture 4 · Input splits vs HDFS blocks`},

{s:6,t:'tf',tp:'input',q:`An HDFS block is a logical division of the data used for processing, while an input split is the physical division used for storage.`,a:1,
ex:`الجملة معكوسة. **Block** = **Storage concept**: الوحدة الفيزيائية في HDFS (حجم ثابت 128MB، ليها replicas). **Split** = **Processing concept**: تقسيم **logical** للـ input، كل split بيروح لـ **mapper واحد**، و**respects record boundaries**، وغالبًا (مش دايمًا) بيساوي الـ block.`,
w:[`غلط — معكوسة.`,`صح — Block = physical/storage، Split = logical/processing.`],
tip:`Block = Storage (physical). Split = Processing (logical, one mapper).`,src:`Lecture 4 · Block vs Split`},

/* ───────────── SET 7 — Code, serialization, side data, joins ───────────── */
{s:7,t:'m',tp:'code',q:`Given: public class wordcountmapper extends Mapper<Object, Text, Text, IntWritable>. What is the type of the map OUTPUT value?`,
o:[`Object`,`Text`,`LongWritable`,`IntWritable`],a:3,
ex:`الترتيب: ~Mapper<input key, input value, output key, output value>~. في الـ word count: input key = **Object**، input value = **Text** (السطر)، output key = **Text** (الكلمة)، output value = **IntWritable** (الرقم 1). الكود: ~context.write(new Text(x), new IntWritable(1))~.`,
w:[`غلط — ده input key.`,`غلط — ده input value أو output key.`,`غلط — مش موجود في الـ signature دي.`,`صح — الـ parameter الرابع.`],
tip:`Mapper<IN-K, IN-V, OUT-K, OUT-V> — الرابع = output value.`,src:`Lecture 4 · Word count Mapper`},

{s:7,t:'tf',tp:'code',q:`The input types of the reduce function must match the output types of the map function.`,a:0,
ex:`السلايد: **The input types of the reduce function must match the output types of the map function.** في الـ word count: الـ mapper بيطلع (Text, IntWritable)، فالـ reducer لازم يكون ~Reducer<Text, IntWritable, Text, IntWritable>~.`,
w:[`صح.`,`غلط.`],
tip:`Map OUT = Reduce IN.`,src:`Lecture 4 · Word count Reducer`},

{s:7,t:'m',tp:'code',q:`In the driver, when are setMapOutputKeyClass() and setMapOutputValueClass() needed?`,
o:[`Always, in every job`,`When the data type of the map output is different from the data type of the reduce output`,`Only when using a combiner`,`Only when the input is a SequenceFile`],a:1,
ex:`السلايد: **setOutputKeyClass() and setOutputValueClass()** بيتحكموا في output types بتاعة الـ **reduce function** ولازم يطابقوا اللي الـ Reducer بيطلعه. أما **setMapOutputKeyClass() / setMapOutputValueClass()** فبيستخدموا **when data type of map output is different from data type of reduce output**.`,
w:[`غلط — لو الأنواع زي بعض مش محتاجهم.`,`صح.`,`غلط.`,`غلط.`],
tip:`setOutput... = reduce output. setMapOutput... = only if map output ≠ reduce output.`,src:`Lecture 4 · Word count Driver`},

{s:7,t:'m',tp:'code',q:`Why does Hadoop use classes such as IntWritable and Text instead of Java's int and String?`,
o:[`Because Java does not support integers`,`Because Java Serializable is too big/heavy for Hadoop, while Writable serializes Hadoop objects in a very light way`,`Because Writable objects are stored in the NameNode`,`Because Text supports ACID transactions`],a:1,
ex:`**Serialization** = تحويل structured objects لـ **byte stream** عشان تتبعت على الشبكة أو تتخزن. **Deserialization** = العكس. Hadoop بيستخدمها في **interprocess communication** (عن طريق **RPC**) وفي **persistent storage**. والسلايد: **java Serializable is too big or too heavy for Hadoop, Writable can serialize the Hadoop object in a very light way.**`,
w:[`غلط.`,`صح.`,`غلط.`,`غلط.`],
tip:`Writable = lightweight serialization. RPC = interprocess communication.`,src:`Lecture 4 · Serialization and deserialization`},

{s:7,t:'m',tp:'side',q:`What is "side data" in MapReduce?`,
o:[`The output of the combiner`,`Extra read-only data needed by a job to process the main dataset`,`Data written to the local disk by map tasks`,`Replicas of HDFS blocks`],a:1,
ex:`السلايد: **Side data can be defined as extra read-only data needed by a job to process the main dataset.** التحدي إنك توصلها لكل الـ map/reduce tasks المتوزعة على الـ cluster بشكل مريح وفعال. فيه طريقتين: **Job Configuration** و **Distributed cache**. مثال: لستة مدن مسموحة [Cairo, Alex] تعمل بيها filter.`,
w:[`غلط.`,`صح.`,`غلط — ده intermediate output.`,`غلط.`],
tip:`Side data = extra + read-only. طريقتين: job configuration (صغير) أو distributed cache (أكبر).`,src:`Lecture 5 · Side data`},

{s:7,t:'m',tp:'side',q:`Why shouldn't you use the job configuration to transfer more than a few kilobytes of side data?`,
o:[`Because the configuration only accepts integers`,`Because it can put pressure on memory: the configuration is read by the client, the application master and the task JVM, and all entries are read into memory each time, even if unused`,`Because it deletes the data after the map phase`,`Because it disables data locality`],a:1,
ex:`السلايد: الـ job configuration كويس لـ **small piece of metadata** (تعمل set لـ key-value pairs وتقراها في الـ task بـ ~context.getConfiguration()~). لكن **you shouldn't use this mechanism for transferring more than a few kilobytes** لأن الـ configuration **always read by the client, the application master, and the task JVM**، وكل مرة **all of its entries are read into memory**. وكمان Configuration بتخزن **Strings بس**، فلأي object تعمل serialization بنفسك أو تستخدم **DefaultStringifier**، والقراءة بتبقى في ~setup()~.`,
w:[`غلط — بتخزن Strings.`,`صح.`,`غلط.`,`غلط.`],
tip:`Job configuration = few KB only + Strings only → DefaultStringifier + read in setup().`,src:`Lecture 5 · Side data (job configuration)`},

{s:7,t:'m',tp:'side',q:`Which statement about Hadoop's distributed cache is correct?`,
o:[`Files are copied to every node once per task`,`Its default size is 10 GB and it can be controlled in mapred-site.xml; files are normally copied to a node once per job`,`It can only hold Java objects serialized as Strings`,`It stores data in the NameNode RAM`],a:1,
ex:`**Distributed cache** أفضل من الـ job configuration لتوزيع datasets. بيـ copy الـ files والـ archives للـ task nodes قبل ما الـ tasks تشتغل، و**to save network bandwidth, files are normally copied to any particular node once per job**. **Lookup files** عادة بتتبعت بالطريقة دي. خطوات: (1) copy الملف لـ HDFS (2) setup job configuration. لما يتنسخ على الـ node يتقال إنه **localized**. **Default size = 10 GB** وبيتظبط في **mapred-site.xml**.`,
w:[`غلط — once per JOB مش per task.`,`صح.`,`غلط — ده قيد الـ job configuration.`,`غلط.`],
tip:`Distributed cache: once per job · 10 GB default · mapred-site.xml · localized · lookup files.`,src:`Lecture 5 · Distributed cache`},

{s:7,t:'m',tp:'side',q:`The node manager keeps a reference count for each file in the distributed cache. When is a cached file eligible for deletion?`,
o:[`As soon as the first task finishes`,`Only when the reference count reaches zero (the file is not being used)`,`When the count reaches 10`,`Never; cached files are permanent`],a:1,
ex:`السلايد: **Before the task has run, the file's reference count is incremented by 1; then, after the task has run, the count is decreased by 1. Only when the file is not being used (when the count reaches zero) is it eligible for deletion.** وكمان ~setup()~ = init function بتجهز resources قبل map/reduce (زي ما الـ reducer قرا ملف الـ customers من الـ cache وحطه في HashMap).`,
w:[`غلط — ممكن tasks تانية لسه بتستخدمه.`,`صح — count = 0.`,`غلط.`,`غلط.`],
tip:`Task start +1 · Task end −1 · count = 0 → deletable.`,src:`Lecture 5 · Distributed cache`},

{s:7,t:'tf',tp:'join',q:`A reduce-side join is less efficient than a map-side join.`,a:0,
ex:`سؤال من الكتاب، True. السلايد: **A reduce-side join is more general than a map-side join, in that the input datasets don't have to be structured in any particular way, but it is less efficient because both datasets have to go through the MapReduce shuffle.** يعني reduce join = أسهل وأعم، لكن أبطأ.`,
w:[`صح.`,`غلط.`],
tip:`Reduce join: general + easier + less efficient (shuffle). Map join: efficient + input must be partitioned & sorted.`,src:`Lecture 5 · Join in MapReduce`},

{s:7,t:'m',tp:'join',q:`In a reduce-side join, what does the mapper do with each record?`,
o:[`It sorts the records and writes them to HDFS`,`It tags each record with its source and uses the join key as the map output key, so records with the same key meet in the reducer`,`It loads the other dataset into memory from the distributed cache`,`It requires the input to be partitioned and sorted by key`],a:1,
ex:`السلايد: **the mapper tags each record with its source and uses the join key as the map output key, so that the records with the same key are brought together in the reducer.** في المثال: mapper1 بيطلع [4000001, "cname Kristina"]، و mapper2 بيطلع [4000001, "camount 40.33"]. بعد الـ shuffle: {4000001 – [(cname kristina), (camount 40.33), ...]}، والـ reducer بيجمع الـ amounts ويطلع الاسم + الإجمالي. وفي الـ driver بيستخدم ~MultipleInputs.addInputPath~ عشان كل dataset ليه mapper.`,
w:[`غلط.`,`صح — tag + join key.`,`غلط — ده أسلوب الـ distributed cache.`,`غلط — ده شرط الـ map-side join.`],
tip:`Reduce join = tag (cname / camount) + join key as map output key + MultipleInputs.`,src:`Lecture 5 · Reduce join`}
];

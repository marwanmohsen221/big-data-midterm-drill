<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>IS 365 Midterm Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one reading column; a strip of "HDFS blocks" picks the set; cards are questions, answers unfold under each. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#EBEFF4; --ink:#152131; --muted:#5A6A7D; --line:#D9E0E9;
  --accent:#1D5BCB; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB;
  --ok:#17804A; --ok-soft:#E2F4EA; --bad:#BD3128; --bad-soft:#FBE7E5; --flag:#B86E00; --flag-soft:#FDF0DA;
  --paper:#FFFEFA;
  --f-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-head:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --sunken:#1C2532; --ink:#E5EAF1; --muted:#97A6B9; --line:#2A3646;
  --accent:#78A6FF; --accent-ink:#0B1220; --accent-soft:#1E2C47;
  --ok:#55C98D; --ok-soft:#163327; --bad:#F2837A; --bad-soft:#3A1D1C; --flag:#F2B861; --flag-soft:#3A2B14; --paper:#181F2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --sunken:#1C2532; --ink:#E5EAF1; --muted:#97A6B9; --line:#2A3646;
  --accent:#78A6FF; --accent-ink:#0B1220; --accent-soft:#1E2C47;
  --ok:#55C98D; --ok-soft:#163327; --bad:#F2837A; --bad-soft:#3A1D1C; --flag:#F2B861; --flag-soft:#3A2B14; --paper:#181F2A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
b,strong{font-weight:700}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunken);padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate;white-space:pre-wrap;word-break:break-word}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-inline-end:auto}
.brand .code{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.brand h1{font-family:var(--f-head);font-size:18px;margin:0;line-height:1.3;text-wrap:balance}
.overall{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.overall strong{color:var(--ink);font-size:15px}
nav.tabs{display:flex;gap:4px;background:var(--sunken);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%}
nav.tabs a{padding:5px 11px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
nav.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--flag-soft);color:var(--flag);border-radius:10px;padding:0 6px;margin-inline-start:4px}

main{padding-block:18px 60px}
.view[hidden]{display:none}

.strip-label{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;direction:ltr}
.strip.q3{grid-template-columns:repeat(3,minmax(0,1fr))}
.blk{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px 6px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.blk .n{font-family:var(--f-mono);font-size:12px;font-weight:600}
.blk .meta{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bar{height:5px;background:var(--sunken);border-radius:3px;overflow:hidden;display:flex}
.blk .bar i{display:block;height:100%}
.blk .bar .g{background:var(--ok)} .blk .bar .r{background:var(--bad)} .blk .bar .p{background:var(--accent)}
.blk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:560px){.strip:not(.q3){grid-template-columns:repeat(4,minmax(0,1fr))}header.top{position:static}.brand h1{font-size:16px}}

/* exam paper header (quizzes) */
.paper{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:12px 16px;margin-top:16px;direction:ltr;font-family:Georgia,'Times New Roman',serif}
.paper .uni{text-align:center;font-weight:700;font-size:16px;line-height:1.35}
.paper .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;font-size:13.5px;margin-top:8px}
.paper .grid b{font-weight:700}
.paper .qline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--ink);margin-top:8px;padding-top:6px;font-weight:700;text-decoration:underline}
@media (max-width:560px){.paper .grid{grid-template-columns:1fr}}
.timer{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}

.sethead{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:20px 0 12px}
.sethead h2{font-family:var(--f-head);font-size:22px;margin:0;line-height:1.3;direction:ltr;text-align:right}
.sethead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.modes{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0;flex-wrap:wrap}
.modes button{border:0;background:var(--surface);padding:7px 13px;font-weight:600;font-size:13.5px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modehelp{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.scorebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px}
.scorebar .big{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.scorebar .sp{margin-inline-start:auto}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}

.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin-bottom:12px}
.q.flagged{border-color:var(--flag);box-shadow:inset 3px 0 0 var(--flag)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qnum{font-family:var(--f-mono);font-weight:600;font-size:13px}
.chip{font-family:var(--f-mono);font-size:11px;border-radius:5px;padding:1px 7px;background:var(--sunken);color:var(--muted);direction:ltr}
.chip.tf{background:var(--accent-soft);color:var(--accent)}
.flagbtn{margin-inline-start:auto;border:1.5px solid var(--line);background:transparent;border-radius:7px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.flagbtn svg{width:13px;height:13px}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);background:var(--flag-soft);color:var(--flag)}
.qtext{direction:ltr;text-align:left;font-size:15.5px;font-weight:500;margin:0 0 10px;white-space:pre-line}
.opts{display:grid;gap:6px;direction:ltr}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;width:100%;line-height:1.5}
.opt .L{font-family:var(--f-mono);font-weight:600;min-width:1.2em;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{color:var(--accent)}
.opt:disabled{cursor:default;opacity:1}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{color:var(--bad)}
.opt .tag{margin-left:auto;font-family:var(--f-body);font-size:12px;font-weight:600;white-space:nowrap;direction:rtl}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}

.reveal{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.verdict{font-weight:700;font-size:14px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.none{color:var(--muted)}
.sec h4{font-family:var(--f-head);font-size:13.5px;margin:0 0 4px;color:var(--muted);font-weight:600}
.sec p{margin:0;white-space:pre-line}
.answer{font-weight:700}
.answer .en{direction:ltr;unicode-bidi:isolate}
.whys{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.whys li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.whys .mk{font-family:var(--f-mono);font-weight:600;font-size:12.5px;border-radius:5px;padding:0 6px;direction:ltr}
.whys .mk.y{background:var(--ok-soft);color:var(--ok)} .whys .mk.n{background:var(--bad-soft);color:var(--bad)}
.tip{background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.tip h4{color:var(--accent)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);direction:ltr;text-align:right}
.deep{background:var(--flag-soft);border-radius:8px;padding:10px 12px}
.deep h4{color:var(--flag)}
.deep ul{margin:6px 0 0;padding-inline-start:18px}
.deep li{margin-bottom:3px}

.endbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:18px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center;margin-top:14px}
.result .big{font-family:var(--f-mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* lectures + summary */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.toc a{font-size:12.5px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;scroll-margin-top:90px}
.topic h3{font-family:var(--f-head);font-size:19px;margin:0 0 6px;text-wrap:balance}
.topic h3.en{direction:ltr;text-align:right}
.topic .lesson{margin:0 0 12px;color:var(--muted)}
.lsec{margin-top:14px}
.lsec h4{font-family:var(--f-head);font-size:15.5px;margin:0 0 6px;color:var(--accent)}
.lsec p{margin:0 0 6px}
.points{display:grid;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.points li{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.points li:last-child{border-bottom:0;padding-bottom:0}
.points .term{font-weight:700;direction:ltr;text-align:right;font-size:14px}
@media (max-width:560px){.points li{grid-template-columns:1fr;gap:2px}}
.topic h4{font-family:var(--f-head);font-size:14px;margin:0 0 6px;color:var(--accent)}
.tbl{overflow-x:auto;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{font-family:var(--f-head);font-weight:600;font-size:12.5px;color:var(--muted);text-align:right;background:var(--sunken)}
td.en,th.en{direction:ltr;text-align:left}
td.arrow{color:var(--muted);width:1%;white-space:nowrap}
td.ans{font-weight:700;color:var(--accent);direction:ltr;text-align:left}
td.why{min-width:180px}
td.hint{color:var(--muted);font-size:13px;min-width:150px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;border-radius:5px;padding:0 7px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.note{color:var(--muted);font-size:13.5px}
h2.sum{font-family:var(--f-head);font-size:22px;margin:28px 0 10px;scroll-margin-top:90px}
.traps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.traps li{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.traps li b{direction:ltr;text-align:right}
@media (max-width:560px){.traps li{grid-template-columns:1fr;gap:2px}}
.en-sum{background:var(--sunken);border-radius:8px;padding:10px 14px;text-align:left}
.en-sum ul{margin:0;padding-left:18px}
.en-sum li{margin-bottom:5px}
details.qh{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
details.qh summary{cursor:pointer;font-family:var(--f-head);font-weight:600;font-size:15px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.reveal{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

  <div class="brand"><span class="code">IS 365 · Big Data Technologies · Lectures 1–5</span><h1>مراجعة الميدترم</h1></div>

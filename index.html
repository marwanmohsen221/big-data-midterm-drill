window.LECTURES = [
{n:1,title:`Lecture 1 — Introduction to the course & Big Data`,topics:['bigdata'],
intro:`أول محاضرة تعريفية: الكورس هيمشي إزاي، وإيه هي الـ Big Data ولیه الأدوات القديمة مش كفاية.`,
secs:[
 [`الكورس والدرجات`,[`الميدترم **30%**، المشروع **20%**، الفاينال **50%**. المنهج: Intro → MapReduce 1 → MapReduce 2 → HDFS → Hive → YARN → **Midterm** → Spark → Sqoop → HBase → Kafka.`,`الكتب: **Hadoop: The Definitive Guide** (Tom White) و **Spark: The Definitive Guide**. أغلب سلايدات المحاضرات من كتاب Hadoop، وعشان كده أسئلة الامتحان ساعات بتيجي من الكتاب.`]],
 [`يعني إيه Big Data؟`,[`أشهر تعريف بيوصفها بـ 3 خصائص اسمهم **3Vs**:`],{h:[`V`,`المعنى`,`مثال`],r:[[`Volume`,`حجم الداتا (magnitude)`,`Petabytes من الـ logs`],[`Variety`,`الداتا جاية من مصادر وأشكال كتير`,`جداول + نصوص + صور`],[`Velocity`,`الداتا بتيجي streaming وبتتجمع real time`,`clicks و sensor readings`]]}],
 [`تعريف McKinsey`,[`Big Data هي داتا **scale, distribution, diversity, and/or timeliness** بتاعتها محتاجة **new technical architectures and analytics** عشان تطلع منها insights ليها قيمة للبيزنس.`,`الشركات محتاجة **new data architectures, analytic sandboxes, new tools, new analytical methods**.`,`والنقطة الأهم: **Traditional methods and databases can not handle big data**. الحجم الكبير محتاج أدوات جديدة للتخزين والإدارة، وده سبب وجود Hadoop.`]]
]},

{n:2,title:`Lecture 2 — Introduction to Big Data processing`,topics:['engines','patterns','rdbms','grid','yarn'],
intro:`أهم محاضرة في الميد: فيها 3 جداول مقارنة بيتسأل منهم كتير (MapReduce vs Spark vs Flink، و MapReduce vs RDBMS، و Hadoop vs Grid)، وكمان أنماط المعالجة و YARN.`,
secs:[
 [`MapReduce vs Spark vs Flink`,[`الـ 3 بيعملوا **batch processing**. الفرق في 3 صفوف، وكل سؤال بيعتمد على كلمة واحدة:`],{h:[``,`MapReduce`,`Spark`,`Flink`],r:[[`Execution`,`Batch بس`,`Batch + **Near real time**`,`Batch + **Real time**`],[`Interactive`,`**No support**`,`Support`,`Support`],[`Iterative`,`**Not suitable**`,`**Suitable**`,`**Native**`]]}],
 [`Processing patterns with Hadoop`,[`**Interactive SQL**: بيستغنى عن MapReduce ويستخدم distributed query engine بـ daemons شغالة على طول (**Impala**) أو container reuse (**Hive on Tez**) → low-latency SQL على داتا ضخمة.`,`**Iterative processing**: خوارزميات زي الـ machine learning بتلف كذا مرة على نفس الداتا. الأكفأ تخلي الـ **working set in memory** بدل ما تقراه من الـ disk كل مرة. MapReduce مايسمحش بده، و Spark يسمح.`,`**Stream processing**: **Storm, Spark Streaming, Samza** بيعملوا حسابات real time على **unbounded streams** ويكتبوا النتايج على Hadoop أو أنظمة تانية.`,`**Search**: **Solr** بيعمل indexing للمستندات وهي بتتضاف على HDFS ويرد على search queries. و **ElasticSearch** للـ information retrieval.`]],
 [`ليه لسه بنذاكر MapReduce؟`,[`لأنه لسه ليه مكان في الـ **batch processing**، وبيعلّم مفاهيم عامة زي **input formats** وإزاي الـ dataset بتتقسم لأجزاء.`,`MapReduce **fundamentally batch** ومش مناسب للـ interactive: الـ query بتاخد دقايق أو أكتر، فمناسب للـ **offline use**.`,`كلمة **Hadoop** ساعات بتتقال على **ecosystem** كامل من المشاريع، مش HDFS و MapReduce بس.`]],
 [`Stream processing بالتفصيل`,[`هو **continuously incorporating new data to compute a result**، والـ input **unbounded** (events بتيجي باستمرار: credit card transactions، clicks، IoT sensors).`,`مهم في حالتين: (1) **lower latency**: التطبيق لازم يرد في دقايق أو ثواني أو milliseconds، فمحتاج يحتفظ بالـ state في الـ memory. (2) **أكفأ في تحديث النتيجة** من batch jobs متكررة لأنه بيحسب incremental.`]],
 [`YARN`,[`**Yet Another Resource Negotiator**، اتضاف في **Hadoop 2**، وهو **cluster resource management system**. هو **the real enabler for new processing models**، لأنه بيسمح لأي distributed program (مش MapReduce بس) يشتغل على داتا الـ cluster.`,`من الكتاب (اتسأل في امتحان 2024): الـ **ApplicationMaster** بيكلم الـ **ResourceManager** بـ **RPC**، والـ **scheduler** بيرفض أي application بتطلب resources مستحيلة.`]],
 [`MapReduce vs traditional database`,[`MapReduce **مكمّل** للـ RDBMS مش بديل. MapReduce مناسب لتحليل **الداتا كلها batch**، والـ RDBMS مناسب للـ **point queries/updates** على داتا indexed بسرعة. احفظ الجدول ده صف صف:`],{h:[``,`Traditional RDBMS`,`MapReduce`],r:[[`Data size`,`Gigabytes`,`Petabytes`],[`Access`,`Interactive and batch`,`Batch`],[`Updates`,`Read and write many times`,`Write once, read many times`],[`Transactions`,`ACID`,`None`],[`Structure`,`Schema-on-write`,`Schema-on-read`],[`Integrity`,`High`,`Low`],[`Scaling`,`Nonlinear`,`Linear`]]}],
 [`أنواع الداتا و Schema`,[`**Structured**: entities ليها defined format و predefined schema، زي **XML documents** و **database tables** (ده كلام السلايد بالحرف، فلو جت XML في السؤال اختار structured).`,`**Semi-structured**: أضعف؛ ممكن يبقى فيه schema بس غالبًا بتتجاهل وبتستخدم كـ guide بس. مثالها **spreadsheet**.`,`**Unstructured**: مالهاش internal structure، زي **plain text** و **image data**.`,`Hadoop شغال كويس على الـ unstructured و semi-structured لأنه بيعمل **schema-on-read**: بيفسّر الداتا وقت المعالجة، فيدي flexibility ويتجنب مرحلة الـ loading المكلفة (التحميل مجرد file copy). العيب: شغل أكتر وقت القراءة ومفيش ضمان على جودة الداتا.`]],
 [`Normalization و Logs و Scaling`,[`الـ RDBMS بيعمل **normalization** للـ integrity وإزالة التكرار، لكنه بيخلي قراءة الـ record **nonlocal operation**، وده ضد افتراض Hadoop إنه يعمل **high-speed streaming reads and writes**.`,`الـ **web server log** مش normalized (اسم الـ client بيتكتب كامل كل مرة)، وعشان كده الـ logs مناسبة جدًا لـ Hadoop. وHadoop **يقدر يعمل joins** بس مش بيستخدمها كتير زي RDBMS.`,`**Linear scaling**: لو ضاعفت الداتا، الـ job هيبقى أبطأ مرتين. لو ضاعفت الداتا والـ cluster، هيشتغل بنفس السرعة.`]],
 [`Hadoop vs Grid computing (HPC)`,[`الـ HPC بيستخدم **MPI** وبيوزع الشغل على أجهزة بتقرا من **shared file system على SAN**. ده كويس للـ compute-intensive، لكن مع مئات الـ GB تبقى **network bandwidth** هي الـ bottleneck والأجهزة تقعد مستنية.`],{h:[``,`Grid / HPC (MPI)`,`Hadoop`],r:[[`Data access`,`Shared file system على SAN`,`**Data locality**: الداتا جنب الحساب`],[`Programming`,`Data flow exposed by **low level**`,`**High level**`],[`Failure`,`المبرمج بيدير checkpointing و recovery`,`الـ MapReduce engine تلقائي`],[`Cost`,`Highly expensive`,`Commodity hardware`],[`Network`,`—`,`Models network topology لتوفير الـ bandwidth`]]}],
 [`Partial failure و Shared-nothing`,[`**Network bandwidth is the most precious resource** في الـ data center، و Hadoop بيحافظ عليها بـ **modeling network topology**.`,`أصعب حاجة في الـ distributed computation: **partial failure** (مش عارف الـ remote process وقع ولا لأ) وإنك تكمل برضه.`,`MapReduce بيكتشف الـ failed tasks ويعيدها على أجهزة سليمة لأنه **shared-nothing architecture**: الـ tasks مش معتمدة على بعض، فترتيب تشغيلها مش مهم. استثناء: إعادة تشغيل **reducer** فاشل محتاجة عناية أكتر من الـ map، لأنه لازم يجيب الـ map outputs (أو يعيد تشغيل الـ maps).`,`MPI بيدي **more control** للمبرمج بس الكود **أصعب في الكتابة**.`]]
]},

{n:3,title:`Lecture 3 — Hadoop & MapReduce`,topics:['hadoop','mr','splits'],
intro:`تعريف Hadoop ومكوناته ومميزاته التسعة، وبعدين إزاي MapReduce بيشتغل من أول الـ splits لحد الـ reducers، وموضوع الـ data locality.`,
secs:[
 [`تعريف Hadoop`,[`Hadoop **free software framework** للـ distributed processing لداتا كبيرة على **clusters of commodity hardware** بـ simple programming models. هو **middleware platform** بيدير cluster، واتكتب بـ **Java** (لكن ممكن R و Python و Ruby).`]],
 [`Hadoop 2 framework`,[],{h:[`المكوّن`,`وظيفته`],r:[[`HDFS`,`high performance distributed file system (التخزين)`],[`YARN`,`job scheduling and cluster resource management`],[`MapReduce`,`parallel processing بتطبيق الـ MapReduce model`]]}],
 [`مميزات Hadoop التسعة`,[`ركّز في الفرق بين **Fault tolerance** و **Reliability** و **High availability** لأنهم شبه بعض:`],{h:[`الميزة`,`الكلمة المفتاحية في السؤال`],r:[[`1. Open source`,`code can be modified according to business requirements`],[`2. Distributed processing`,`data stored distributed in HDFS → processed in parallel`],[`3. Fault tolerance`,`node goes down → recovered from other nodes · **recovered automatically**`],[`4. Reliability`,`replication → data **stored reliably** despite failures`],[`5. High availability`,`multiple copies → **accessed from another path**`],[`6. Scalability`,`**horizontal**: add nodes **on the fly without downtime**`],[`7. Economic`,`**commodity hardware**، no specialized machine`],[`8. Easy to use`,`client doesn't deal with distributed computing`],[`9. Data locality`,`**algorithm moved to data**، not data to algorithm`]]}],
 [`NameNode و DataNode (HDFS)`,[`**NameNode** = master و metadata manager: أسماء الملفات وأماكنها، إزاي الملف اتقسم لـ blocks، وأنهي DataNode شايل كل block. **مش بيخزن الداتا**.`,`**DataNode** = بيخزن الـ blocks الفعلية على local disk، يخدم read/write، يبعت status للـ NameNode، ويعمل replication للـ fault tolerance.`]],
 [`MapReduce framework`,[`الشغل بيتقسم لمرحلتين **map** و **reduce**، وكل مرحلة input و output بتوعها **key-value pairs** والمبرمج بيختار الأنواع. الـ **Mapper** و الـ **Reducer** generic types بـ **4 type parameters**: input key, input value, output key, output value.`,`**Mapper**: برنامج صغير بيقرا جزء من الداتا، يفلتر أو يحوّل، ويطلع stream من <key, value>. الـ framework بيبعته لكل جهاز عليه block من الملف، وكل ما الملف والـ cluster يكبروا الـ mappers تزيد.`,`**Shuffle**: نقل وترتيب مخرجات الـ mappers للـ reducers حسب الـ key.`,`**Reducer**: آخر مرحلة. بيرتب و/أو يجمع كل الـ values لنفس الـ key (زي إجمالي المبيعات لكل state)، ويكتب الناتج على storage. **More unique keys = more parallelism**.`,`**Combiner**: function زي الـ reduce بتشتغل على **map output**، عشان تقلل الداتا اللي بتتعمل لها shuffle، لأن MapReduce محدود بالـ bandwidth. مثال word count: بدل (the,1)(the,1)(the,1) يبعت (the,3).`]],
 [`Data flow: Job → Tasks → Splits`,[`**MapReduce job** = input data + MapReduce program + configuration information. Hadoop بيقسمه لـ **map tasks** و **reduce tasks**، بتتجدول بـ **YARN**، ولو task فشل بيتعاد تلقائي على **node تاني**.`,`الـ input بيتقسم لـ **input splits** بحجم ثابت، و **map task واحد لكل split**.`,`splits صغيرة = **load balancing أحسن** (الجهاز الأسرع ياخد splits أكتر). لكن لو صغيرة أوي، الـ **overhead** بتاع إدارة الـ splits وإنشاء الـ tasks يغلب.`,`الأفضل: **split = HDFS block = 128 MB** (default)، لأنه **أكبر حجم مضمون يبقى على node واحد**. لو الـ split امتد على 2 blocks غالبًا جزء منه هيتنقل على الشبكة.`]],
 [`Data locality`,[`Hadoop بيحاول يشغّل الـ map task على الـ node اللي عليه الداتا عشان مايستهلكش bandwidth. فيه 3 حالات بالترتيب:`],{h:[`الحالة`,`يعني إيه`,`أثرها`],r:[[`(a) Data-local`,`نفس الـ node اللي عليه الـ block`,`الأفضل، reduced network congestion`],[`(b) Rack-local`,`الـ nodes اللي عليها replicas مشغولة، فـ node تاني في نفس الـ rack`,`network latency أعلى من data-local`],[`(c) Off-rack`,`ولا ده متاح (local resources exhausted)، فـ node في rack تاني`,`inter-rack transfer → higher bandwidth usage`]]}],
 [`Map output و Reduce`,[`الـ map tasks بتكتب الـ output على **local disk** مش HDFS، لأنه **intermediate output** هيتعالج في الـ reducers وبعدين يترمي.`,`الـ **reduce tasks مالهاش data locality**، لأن الـ input بتاع reducer واحد جاي من **كل الـ mappers**.`]]
]},

{n:4,title:`Lecture 4 — Reading data: InputFormat, SequenceFile, code`,topics:['input','seq','code'],
intro:`إزاي MapReduce بيقرا الداتا: الـ InputFormats الأربعة، الفرق بين الـ split والـ block، مشكلة الـ small files وحلها، وكود الـ word count.`,
secs:[
 [`3 classes لقراءة الداتا`,[],{h:[`Class`,`السؤال اللي بتجاوبه`],r:[[`InputFormat`,`**How** — إزاي الداتا تتقرا وتتقسم (المخطِّط)`],[`InputSplit`,`**What** — أنهي جزء هيتعالج (chunk منطقي لـ mapper واحد)`],[`RecordReader`,`**Actually reads** — بيقرا الـ bytes ويحولها لـ (key, value)`]]}],
 [`أنواع الـ InputFormat`,[`ده أكتر جدول بيتسأل منه في المحاضرة:`],{h:[`InputFormat`,`Key`,`Value`,`ملاحظة`],r:[[`TextInputFormat (**default**)`,`byte offset (LongWritable)`,`السطر (Text)`,`عدد سطور متغير لكل mapper`],[`KeyValueTextInputFormat`,`كل حاجة لحد **أول tab**`,`باقي السطر`,`الـ separator قابل للتغيير، tab by default`],[`NLineInputFormat`,`byte offset`,`السطر`,`**عدد ثابت N** لكل mapper، N = 1 default`],[`SequenceFileInputFormat`,`user-defined`,`user-defined`,`**Binary**`]]}],
 [`حساب الـ byte offset`,[`الـ key في TextInputFormat **مش رقم السطر**، ده عدد الـ bytes من أول الملف لبداية السطر. القاعدة: **offset التالي = offset السابق + طول السطر + 1 (newline)**.`,`مثال السلايد: "On the top of the Crumpetty Tree" طوله 32 → السطر التاني يبدأ عند **33**. "The Quangle Wangle sat," طوله 23 → التالت عند **57**. والرابع عند **89**.`,`مع **NLineInputFormat** و N = 2 على نفس الـ 4 سطور: mapper ياخد (0)(33) و mapper تاني ياخد (57)(89). نفس الـ keys والـ values، **الفرق في construction of splits**.`]],
 [`Split vs Block`,[`**Block** = **storage** concept: وحدة فيزيائية في HDFS، 128 MB، ليها replicas.`,`**Split** = **processing** concept: تقسيم **logical**، كل split لـ mapper واحد، **respects record boundaries**، وغالبًا (مش دايمًا) بيساوي الـ block.`,`لو سطر بدأ في Block 1 وخلص في Block 2: بيتبع **الـ split الأول**، والـ **LineRecordReader** بيجيب الـ bytes الزيادة بس من Block 2 على الشبكة (~22 bytes في مثال الـ Website Traffic). مفيش duplicates ولا missing data، والـ split التاني يبدأ من السطر اللي بعده.`]],
 [`SequenceFile و مشكلة الـ small files`,[`الـ **small file** = ملف أصغر بكتير من الـ block. المشكلة على وجهين:`,`**HDFS**: كل file و block = **object ~150 bytes** في RAM الـ NameNode. الملف الصغير = 2 objects (File object + Block object). 10 مليون ملف ≈ 3 GB، ومليار ملف مش ممكن.`,`**MapReduce**: كل ملف صغير = split = mapper لوحده، وتشغيل mapper عشان يقرا 100 KB أغلى من الشغل نفسه.`,`**الحل: SequenceFile** يجمع الملفات الصغيرة في ملف واحد (**filename = key، content = value**). وهو مناسب لـ MapReduce لأنه **splittable** (sync points)، بيدعم **compression**، وبيخزن arbitrary types.`],{h:[``,`قبل (10,000 ملف × 100 KB)`,`بعد (SequenceFile 1 GB)`],r:[[`Files`,`10,000`,`1`],[`Blocks`,`10,000`,`8 (1 GB ÷ 128 MB)`],[`NameNode objects`,`~20,000`,`9`],[`NameNode RAM`,`~3 MB`,`~1.4 KB`],[`Mappers`,`~10,000`,`~8`]]}],
 [`كود الـ Word count`,[`**Mapper**: ~Mapper<Object, Text, Text, IntWritable>~: input key Object، input value Text (السطر)، output key Text (الكلمة)، output value IntWritable (1). بيعمل ~context.write(new Text(x), new IntWritable(1))~ لكل كلمة.`,`**Reducer**: ~Reducer<Text, IntWritable, Text, IntWritable>~: بيجمع الـ 1s لكل كلمة. **input types للـ reduce لازم تطابق output types للـ map**.`,`**Driver**: ~setMapperClass~، ~setReducerClass~، ~setCombinerClass~ (اختياري)، ~setOutputKeyClass / setOutputValueClass~ (= نوع output الـ **reduce**)، و ~setMapOutputKeyClass / setMapOutputValueClass~ **بس لو** output الـ map مختلف عن output الـ reduce.`]],
 [`Serialization`,[`**Serialization** = تحويل structured objects لـ **byte stream** (للشبكة أو التخزين). **Deserialization** = العكس.`,`بتستخدم في **interprocess communication** (عن طريق **RPC**: الرسالة تتحول binary stream وتتبعت للـ remote node اللي يعمل deserialize) وفي **persistent storage**.`,`Hadoop بيستخدم **IntWritable و Text** بدل int و String لأن **Java Serializable تقيلة**، والـ **Writable** خفيفة.`]],
 [`Hadoop مناسب لإيه ومش مناسب لإيه`,[],{h:[`Good for`,`Not good for`],r:[[`Massive amounts of data through parallelism`,`Transactions (random access)`],[`Variety of data (structured, unstructured, semi)`,`Work that cannot be parallelized`],[`Inexpensive commodity hardware`,`Low latency data access`],[``,`Lots of small files`],[``,`Intensive calculations with little data`]]}]
]},

{n:5,title:`Lecture 5 — Side data, distributed cache & joins`,topics:['side','join'],
intro:`إزاي توصّل داتا إضافية لكل الـ tasks (side data)، والفرق بين الـ job configuration و الـ distributed cache، وإزاي تعمل join في MapReduce.`,
secs:[
 [`Side data`,[`**Side data** = داتا إضافية **read-only** الـ job محتاجها عشان يعالج الداتا الأساسية. مثال: لستة مدن مسموحة [Cairo, Alex] عشان تفلتر الناس، أو ملف أسماء العملاء. التحدي: توصّلها لكل الـ map/reduce tasks المتوزعة بشكل فعال. فيه طريقتين.`]],
 [`1) Job Configuration`,[`تعمل set لـ key-value pairs في الـ Configuration في الـ driver، والـ task يقراها بـ ~context.getConfiguration()~، وغالبًا جوه ~setup()~.`,`الـ Configuration بتخزن **Strings بس**، فلأي Java object يا إما تعمل serialization بنفسك يا إما تستخدم **DefaultStringifier**.`,`**ماتستخدمهاش لأكتر من few KB**: الـ configuration بتتقرا من الـ client والـ application master والـ task JVM، وكل مرة كل الـ entries تدخل الـ memory حتى لو مش مستخدمة.`]],
 [`2) Distributed cache`,[`الأفضل لتوزيع datasets (زي **lookup files**). بيـ copy الملفات والـ archives للـ task nodes قبل ما الـ tasks تشتغل، و**once per job** لكل node لتوفير الـ bandwidth.`,`الخطوات: (1) copy الملف لـ HDFS (2) setup job configuration. لما يتنسخ على الـ node يتقال إنه **localized**.`,`الـ **default size = 10 GB** وبيتظبط في **mapred-site.xml**.`,`الـ node manager بيعمل **reference count**: +1 قبل الـ task، −1 بعدها، والملف ينفع يتمسح **لما الـ count يوصل صفر**.`,`**setup()** = init function في الـ Mapper/Reducer تجهز resources قبل المعالجة. في المثال الـ reducer قرا ملف الـ customers من ~DistributedCache.getCacheFiles()~ وحطه في HashMap، وبعدين في ~reduce()~ جمع المبالغ وجاب الاسم من الـ HashMap.`]],
 [`Joins in MapReduce`,[`MapReduce يقدر يعمل join بين datasets كبيرة، بس كتابته من الصفر معقدة، فالأحسن أدوات أعلى زي **Pig, Hive, Spark**. ولو الـ datasets الاتنين كبار أوي ومش ممكن تنسخ واحدة على كل node، تقدر برضه تعمل map-side أو reduce-side join.`],{h:[``,`Map-side join`,`Reduce-side join`],r:[[`فين بيحصل`,`في الـ mapper`,`في الـ reducer`],[`الشرط`,`input كل map لازم **partitioned and sorted** by key`,`مفيش شرط على الـ structure (more general)`],[`السهولة`,`أصعب`,`**أسهل في الكتابة**`],[`الكفاءة`,`أكفأ`,`**less efficient**: الـ datasets الاتنين بيعدّوا على الـ shuffle`]]}],
 [`Reduce join خطوة بخطوة`,[`1. كل mapper بيقرا dataset (mapper1 للـ customers، mapper2 للـ transactions).`,`2. الـ mapper بيعمل **tag** لكل record بمصدره ("cname" أو "camount").`,`3. الـ output key = **join key** (customer ID). مثال: [4000001, cname Kristina] و [4000001, camount 40.33].`,`4. بعد الـ shuffle والـ sort: {4000001 – [(cname kristina), (camount 40.33), (camount 47.05), …]}.`,`5. الـ reducer يفرّق بالـ tag: ياخد الاسم ويجمع المبالغ، ويطلع (الاسم، الإجمالي).`,`في الـ driver: ~MultipleInputs.addInputPath(job, path, TextInputFormat.class, mapper1.class)~ لكل dataset بالـ mapper بتاعها.`]]
]}
];

 {t:`Schema-on-write vs Schema-on-read`,h:[``,`Schema-on-write (DB)`,`Schema-on-read (Hadoop)`],r:[[`امتى الـ schema`,`وقت الكتابة`,`وقت القراءة / المعالجة`],[`الميزة`,`data integrity عالية، queries سريعة`,`flexibility، تحميل سريع (file copy)`],[`العيب`,`أقل flexibility، write cost أعلى`,`شغل أكتر وقت القراءة، مفيش ضمان جودة`],[`مناسب لـ`,`structured، transactional`,`logs، semi و unstructured`]]},
 {t:`NameNode vs DataNode`,h:[``,`NameNode`,`DataNode`],r:[[`الدور`,`master، metadata manager`,`data storage`],[`بيخزن`,`file names، block mapping، أماكن الـ blocks`,`الـ blocks الفعلية على local disk`],[`ملاحظة`,`مش بيخزن داتا · RAM بتتملي مع الـ small files`,`replicates data · بيبعت status للـ NameNode`]]}

// Short English summary per lecture (shown under the Arabic explanation).
window.LECTURES_EN = {
1:[`Big Data is most widely defined by the **3Vs**: **Volume** (magnitude), **Variety** (many sources and formats) and **Velocity** (streamed, collected in real time).`,`McKinsey: Big Data is data whose scale, distribution, diversity and/or timeliness require **new technical architectures and analytics**.`,`Traditional methods and databases **cannot** handle big data; new tools are needed to store and manage it.`,`Grading: Midterm 30%, Project 20%, Final 50%.`],
2:[`All three engines do **batch**. Spark adds **near real time**, Flink adds **real time**. MapReduce has **no interactive** support and is **not suitable** for iterative work; Spark is **suitable**, Flink is **native** iterative.`,`Processing patterns: **Interactive SQL** (Impala, Hive on Tez), **Iterative** (keep working set in memory, e.g. Spark for ML), **Stream** (Storm, Spark Streaming, Samza on unbounded data), **Search** (Solr, ElasticSearch).`,`**YARN** (Yet Another Resource Negotiator, Hadoop 2) is a cluster resource manager that lets any distributed program, not just MapReduce, run on Hadoop.`,`MapReduce vs RDBMS: PB vs GB · batch vs interactive+batch · write once read many vs read/write many · no transactions vs ACID · **schema-on-read** vs schema-on-write · low vs high integrity · **linear** vs nonlinear scaling.`,`Structured = predefined schema (XML, DB tables). Semi-structured = loose schema used as a guide (spreadsheet). Unstructured = no internal structure (plain text, images).`,`Normalization makes record reads nonlocal, which hurts Hadoop's streaming reads; web logs are not normalized, so they suit Hadoop.`,`Grid/HPC uses **MPI** and a shared file system on a **SAN**; network bandwidth becomes the bottleneck. Hadoop uses **data locality**, high-level programming, automatic failure handling and cheap commodity hardware.`,`Network bandwidth is the most precious resource. The hardest problem is **partial failure**. MapReduce is **shared-nothing**: tasks are independent, so order does not matter.`],
3:[`Hadoop is a free Java framework for distributed processing of large data sets on clusters of commodity hardware. Hadoop 2 = **HDFS** (storage) + **YARN** (scheduling, resources) + **MapReduce** (processing).`,`Nine features: open source, distributed processing, fault tolerance (automatic recovery), reliability (replication), high availability (another path), horizontal scalability (no downtime), economic, easy to use, data locality (move code to data).`,`**NameNode** keeps metadata only; **DataNodes** store the actual blocks.`,`Map and reduce phases both use **key-value pairs**. Mapper and Reducer each have **4 type parameters**. Mappers filter/transform and emit (k,v); reducers aggregate per key; a **combiner** runs on map output to cut shuffled data.`,`A job = input data + program + configuration, split into map and reduce tasks scheduled by YARN; failed tasks rerun on another node.`,`One map task per **input split**. Best split size = **HDFS block (128 MB)**, the largest input guaranteed to sit on one node.`,`Data-local (same node) > rack-local (same rack) > off-rack (inter-rack transfer). Map output goes to **local disk**; reducers have **no data locality**.`],
4:[`InputFormat = how to read and split; InputSplit = what portion; RecordReader = actually reads into (key, value).`,`**TextInputFormat** (default): key = byte offset (LongWritable), value = line (Text). **KeyValueTextInputFormat**: key = text before the first tab. **NLineInputFormat**: fixed N lines per mapper (N = 1 default). **SequenceFileInputFormat**: binary, user-defined key/value.`,`Splits are logical and honor record boundaries; blocks are physical storage units. A line crossing two blocks belongs to the first split; LineRecordReader fetches the extra bytes.`,`Small-file problem: every file/block costs ~150 bytes of NameNode RAM and its own mapper. **SequenceFile** packs small files (filename = key, content = value) and is splittable, compressible and typed.`,`Word count: Mapper<Object, Text, Text, IntWritable>, Reducer<Text, IntWritable, Text, IntWritable>. Reduce input types must match map output types. Use setMapOutputKeyClass/ValueClass only when map output types differ from reduce output types.`,`Serialization turns objects into byte streams for RPC and storage. Hadoop uses lightweight **Writable** types because Java Serializable is too heavy.`,`Hadoop is good for massive parallel data, varied data and commodity hardware; not good for transactions, non-parallel work, low latency, many small files, or heavy computation on little data.`],
5:[`**Side data** is extra read-only data a job needs to process the main dataset.`,`**Job configuration**: for small metadata only (a few KB), stored as Strings (use DefaultStringifier for objects), read in setup().`,`**Distributed cache**: preferred for datasets and lookup files; files are copied to each node once per job (localized), default 10 GB set in mapred-site.xml; a file can be deleted when its reference count reaches zero.`,`**Map-side join** happens in the mapper and needs inputs partitioned and sorted by key (more efficient). **Reduce-side join** is more general and easier but less efficient, because both datasets go through the shuffle.`,`In a reduce-side join the mapper **tags** each record with its source and uses the **join key** as the output key; the reducer combines the tagged values. MultipleInputs assigns one mapper per dataset.`]
};
</script>
<script>
(function(){
const Q=window.QUESTIONS, SETS=window.SETS, T=window.TOPICS, LEC=window.LECTURES, H=window.HINTS;
const KEY='is365-drill-v1', QUIZ_MIN=30;
let S={ans:{},flags:{},rev:{},set:1,qset:8,mode:'exam',rf:'flag',qstart:{}};
try{const raw=localStorage.getItem(KEY);if(raw)Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.qstart)S.qstart={};
if(!SETS.some(s=>s.n===S.qset&&s.quiz))S.qset=8;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/~(.+?)~/g,'<code>$1</code>');
const L='abcd';
const LEC_OF={bigdata:1,engines:2,patterns:2,rdbms:2,grid:2,yarn:2,hadoop:3,mr:3,splits:3,input:4,seq:4,code:4,side:5,join:5};

function rng(seed){return function(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}}
Q.forEach((q,i)=>{
  q.id=i;
  if(q.t==='tf'){q.o=['True','False'];q.order=[0,1];return;}
  const fixed=q.fix||q.o.some(o=>/above|^both|^neither/i.test(o));
  const ord=q.o.map((_,k)=>k);
  if(!fixed){const r=rng(i*7919+31);for(let k=ord.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[ord[k],ord[j]]=[ord[j],ord[k]];}}
  q.order=ord;
});
const setOf=n=>SETS.find(s=>s.n===n);
const isQuiz=n=>!!(setOf(n)&&setOf(n).quiz);
const setName=n=>isQuiz(n)?`Quiz ${n-7}`:`Set ${n}`;
const bySet=n=>Q.filter(q=>q.s===n);
const numIn=q=>bySet(q.s).indexOf(q)+1;
const isWrong=q=>S.rev[q.s]&&S.ans[q.id]!==undefined&&S.ans[q.id]!==q.a;
const shown=q=>S.mode==='show'||!!S.rev[q.s]||(S.mode==='practice'&&S.ans[q.id]!==undefined);
function setStats(n){const qs=bySet(n);let a=0,r=0;qs.forEach(q=>{if(S.ans[q.id]!==undefined){a++;if(q.a===S.ans[q.id])r++;}});return{tot:qs.length,a,r,rev:!!S.rev[n]};}
function letterOf(q,orig){return q.t==='tf'?q.o[orig]:L[q.order.indexOf(orig)];}
const tabName=()=>{const h=(location.hash||'#quiz').slice(1);return['quiz','exam','lectures','summary','review'].includes(h)?h:'quiz';};
const curSet=()=>tabName()==='quiz'?S.qset:S.set;

function optsHTML(q,ctx){
  const show=ctx==='review'||shown(q), pick=S.ans[q.id];
  return `<div class="opts${q.t==='tf'?' tf':''}">`+q.order.map((orig,pos)=>{
    let cls='opt',tag='';
    if(show){
      if(orig===q.a){cls+=' right';tag=pick===orig?'إجابتك ✓':'الإجابة الصحيحة';}
      else if(pick===orig){cls+=' wrong';tag='إجابتك ✗';}
    }else if(pick===orig)cls+=' sel';
    const lab=q.t==='tf'?'':`<span class="L">${L[pos]}.</span>`;
    return `<button type="button" class="${cls}" data-q="${q.id}" data-o="${orig}" ${show?'disabled':''}>${lab}<span>${fmt(q.o[orig])}</span>${tag?`<span class="tag">${tag}</span>`:''}</button>`;
  }).join('')+`</div>`;
}
function deepHTML(q){
  const t=T[q.tp];if(!t)return'';
  return `<div class="deep sec"><h4>شرح زيادة للموضوع: ${esc(t.title)}</h4><p>${fmt(t.lesson)}</p><ul>${t.points.slice(0,6).map(p=>`<li><b dir="ltr">${fmt(p[0])}</b>: ${fmt(p[1])}</li>`).join('')}</ul></div>`;
}
function revealHTML(q,ctx){
  const pick=S.ans[q.id];
  let v='';
  if(pick===undefined)v=(ctx==='exam'&&S.mode==='show'&&!S.rev[q.s])?'':`<div class="verdict none">ماجاوبتش على السؤال ده.</div>`;
  else if(pick===q.a)v=`<div class="verdict ok">إجابتك صح.</div>`;
  else v=`<div class="verdict bad">إجابتك (${esc(letterOf(q,pick))}) غلط.</div>`;
  const ansTxt=q.t==='tf'?q.o[q.a]:`${letterOf(q,q.a)}. ${q.o[q.a]}`;
  const whys=q.order.map(orig=>{const ok=orig===q.a;const lab=q.t==='tf'?q.o[orig]:letterOf(q,orig);
    return `<li><span class="mk ${ok?'y':'n'}">${esc(lab)} ${ok?'✓':'✗'}</span><span>${fmt(q.w[orig])}</span></li>`;}).join('');
  return `<div class="reveal">${v}
    <div class="sec"><h4>الشرح</h4><p>${fmt(q.ex)}</p></div>
    <div class="sec"><h4>الإجابة</h4><p class="answer"><span class="en">${fmt(ansTxt)}</span></p></div>
    <div class="sec"><h4>ليه كل اختيار صح أو غلط</h4><ul class="whys">${whys}</ul></div>
    <div class="tip sec"><h4>هنت الامتحان</h4><p>${fmt(q.tip)}</p></div>
    ${(S.flags[q.id]||ctx==='review')?deepHTML(q):''}
    <div class="src">${esc(q.src)}</div></div>`;
}
function cardHTML(q,ctx){
  const fl=!!S.flags[q.id];
  const head=ctx==='review'?`${setName(q.s)} · Q${numIn(q)}`:`Q${numIn(q)}`;
  return `<article class="q${fl?' flagged':''}" id="q-${q.id}">
    <div class="qhead"><span class="qnum">${head}</span><span class="chip${q.t==='tf'?' tf':''}">${q.t==='tf'?'True / False':'MCQ'}</span><span class="chip">${esc(T[q.tp]?T[q.tp].title:q.tp)}</span>
    <button type="button" class="flagbtn" data-flag="${q.id}" aria-pressed="${fl}"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 1.5a.75.75 0 0 1 .75.75V3h8.6a.6.6 0 0 1 .47.97L11 6.5l1.82 2.53a.6.6 0 0 1-.47.97h-8.6v4.25a.75.75 0 0 1-1.5 0V2.25A.75.75 0 0 1 3 1.5Z"/></svg>${fl?'متعلّم عليها':'علّم عليها'}</button></div>
    <p class="qtext">${fmt(q.q)}</p>
    ${optsHTML(q,ctx)}
    ${(ctx==='review'||shown(q))?revealHTML(q,ctx):''}
  </article>`;
}

/* ---------- practice (bank + quizzes) ---------- */
function remaining(n){const st=S.qstart[n];if(!st)return null;return Math.max(0,QUIZ_MIN*60000-(Date.now()-st));}
const mmss=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function renderPractice(){
  const quiz=tabName()==='quiz', n=curSet(), st=setOf(n), s=setStats(n), qs=bySet(n);
  const group=SETS.filter(x=>!!x.quiz===quiz);
  document.getElementById('stripLabel').textContent=quiz?'3 quizzes · 25 MCQ each · like the real midterm paper':'Question bank · 7 sets · 100 questions (MCQ + True/False)';
  const strip=document.getElementById('strip');strip.className='strip'+(quiz?' q3':'');
  strip.innerHTML=group.map(x=>{const t=setStats(x.n);
    const bar=t.rev?`<i class="g" style="width:${t.r/t.tot*100}%"></i><i class="r" style="width:${(t.a-t.r)/t.tot*100}%"></i>`:`<i class="p" style="width:${t.a/t.tot*100}%"></i>`;
    const meta=t.rev?`${t.r}/${t.tot} ✓`:`${t.a}/${t.tot}`;
    const label=quiz?`${setName(x.n)}${x.n===8?' · 2024':''}`:setName(x.n);
    return `<button type="button" class="blk" data-set="${x.n}" aria-pressed="${n===x.n}"><span class="n">${label}</span><span class="meta">${meta}</span><span class="bar">${bar}</span></button>`;}).join('');
  const rem=remaining(n);
  document.getElementById('paper').innerHTML=quiz?`<div class="paper"><div class="uni">Helwan University<br>Faculty of Computers &amp; Artificial Intelligence</div>
    <div class="grid"><span><b>Department:</b> Information Systems</span><span><b>Course Code:</b> IS 365</span><span><b>Course Name:</b> Big Data Technologies</span><span><b>Total Marks:</b> 25</span><span><b>Time Allowed:</b> 30 Min.</span><span><b>Model:</b> ${n===8?'Midterm Fall 2024 (original)':'Practice model '+(n===9?'B':'C')}</span></div>
    <div class="qline"><span>Question (1): choose the correct answer</span><span>(25 marks)</span></div></div>`:'';
  document.getElementById('setTitle').textContent=`${setName(n)} — ${quiz?st.title.replace(/^Quiz \d+ — /,''):st.title}`;
  document.getElementById('setSub').textContent=`${st.ar} · ${qs.length} سؤال`;
  ['Exam','Practice','Show'].forEach(m=>document.getElementById('m'+m).setAttribute('aria-pressed',S.mode===m.toLowerCase()));
  document.getElementById('modeHelp').textContent={exam:'وضع الامتحان: الإجابات مستخبية. جاوب كله وبعدين سلّم وصحّح.',practice:'وضع التدريب: أول ما تختار إجابة، الصح والشرح بتوع السؤال ده يظهروا على طول.',show:'الإجابات ظاهرة: كل الإجابات والشرح ظاهرين للمذاكرة، وإجاباتك اللي اخترتها متعلّمة جنب الصح.'}[S.mode];
  const sb=document.getElementById('scorebar');
  const timerHTML=quiz&&!s.rev?(rem===null?`<button type="button" class="btn" data-act="timer">ابدأ الوقت (${QUIZ_MIN} دقيقة)</button>`:`<span class="timer${rem<300000?' low':''}" id="timer">${mmss(rem)}</span>`):'';
  if(s.rev)sb.innerHTML=`<span class="big"><span class="ok">${s.r}</span> / ${s.tot}</span><span>صح: <b class="ok">${s.r}</b> · غلط: <b class="bad">${s.a-s.r}</b> · ماتجاوبش: <b>${s.tot-s.a}</b></span><span class="sp"></span><button type="button" class="btn" data-act="retry">حل ${setName(n)} تاني</button>`;
  else{
    const lead=S.mode==='exam'?`${s.a} / ${s.tot}`:`<span class="ok">${s.r}</span> / ${s.a}`;
    const txt=S.mode==='exam'?`جاوبت ${s.a} من ${s.tot}`:`صح ${s.r} من ${s.a} جاوبتهم`;
    sb.innerHTML=`<span class="big">${lead}</span><span>${txt}</span>${timerHTML}<span class="sp"></span><button type="button" class="btn primary" data-act="submit" ${s.a===0?'disabled':''}>سلّم وصحّح</button>`;
  }
  document.getElementById('qlist').innerHTML=qs.map(q=>cardHTML(q,'exam')).join('');
  const nextN=group.findIndex(x=>x.n===n)<group.length-1?group[group.findIndex(x=>x.n===n)+1].n:null;
  const nxt=nextN?`<button type="button" class="btn" data-act="next" data-n="${nextN}">${setName(nextN)} اللي بعده</button>`:'';
  document.getElementById('endbar').innerHTML=s.rev?nxt:`<button type="button" class="btn primary" data-act="submit" ${s.a===0?'disabled':''}>سلّم وصحّح (${s.a}/${s.tot})</button>${nxt}`;
  document.getElementById('result').innerHTML=s.rev?`<div class="result"><div class="big">${s.r} / ${s.tot}</div><div>${Math.round(s.r/s.tot*100)}% في ${setName(n)}. ${s.r<s.tot?'راجع الأسئلة الحمرا، وعلّم على اللي مش فاهمها عشان تلاقيها في المراجعة.':'ممتاز، كله صح.'}</div></div>`:'';
}

/* ---------- review ---------- */
function renderReview(){
  document.querySelectorAll('#filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===S.rf));
  const list=Q.filter(q=>S.rf==='flag'?S.flags[q.id]:S.rf==='wrong'?isWrong(q):(S.flags[q.id]||isWrong(q)));
  const msg={flag:'لسه ماعلّمتش على أي سؤال. دوس "علّم عليها" على أي سؤال مش فاهمه وهيظهر هنا بالشرح الكامل.',wrong:'مفيش أسئلة غلط لسه. الأسئلة بتظهر هنا بعد ما تسلّم أي Set أو Quiz.',both:'مفيش حاجة هنا لسه.'};
  document.getElementById('rlist').innerHTML=list.length?list.map(q=>cardHTML(q,'review')).join(''):`<div class="empty">${msg[S.rf]}</div>`;
}

/* ---------- lectures ---------- */
const tableHTML=t=>`<div class="tbl"><table>${t.h?`<thead><tr>${t.h.map(x=>`<th>${fmt(x)}</th>`).join('')}</tr></thead>`:''}<tbody>${t.r.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:600"':''}>${fmt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function renderLectures(){
  let h=`<div class="sethead"><div><h2 style="direction:rtl">شرح المحاضرات</h2><p>كل محاضرة من 1 لـ 5 بالترتيب، بالعربي والمصطلحات بالإنجليزي. بعد ما تخلص محاضرة حل أسئلتها من بنك الأسئلة.</p></div></div>`;
  h+=`<nav class="toc" aria-label="Lectures">${LEC.map(l=>`<a href="#lectures" data-jump="lec-${l.n}">Lecture ${l.n}</a>`).join('')}</nav>`;
  h+=LEC.map(l=>`<section class="topic" id="lec-${l.n}"><h3 class="en">${esc(l.title)}</h3><p class="lesson">${fmt(l.intro)}</p>
    ${l.secs.map(sc=>`<div class="lsec"><h4>${fmt(sc[0])}</h4>${sc[1].map(p=>`<p>${fmt(p)}</p>`).join('')}${sc[2]?tableHTML(sc[2]):''}</div>`).join('')}
    ${(window.LECTURES_EN||{})[l.n]?`<div class="lsec en-sum" dir="ltr" lang="en"><h4>Lecture ${l.n} in English</h4><ul>${window.LECTURES_EN[l.n].map(p=>`<li>${fmt(p)}</li>`).join('')}</ul></div>`:''}</section>`).join('');
  document.getElementById('lectures').innerHTML=h;
}

/* ---------- summary & hints ---------- */
function renderSummary(){
  const C=window.CORRECTIONS, G=window.GLOSSARY;
  let h=`<div class="sethead"><div><h2 style="direction:rtl">أهم النقط والهنتات</h2><p>مترتبة: الأرقام، الفخاخ، المقارنات، وبعدين كل محاضرة بنقطها وهنتاتها، وفي الآخر هنتات كل الأسئلة ودي اخترناها ليه.</p></div></div>`;
  h+=`<nav class="toc" aria-label="Sections"><a href="#summary" data-jump="s-num">الأرقام</a><a href="#summary" data-jump="s-trap">الفخاخ</a><a href="#summary" data-jump="s-cmp">المقارنات</a>${LEC.map(l=>`<a href="#summary" data-jump="s-l${l.n}">نقط Lecture ${l.n}</a>`).join('')}<a href="#summary" data-jump="s-qh">هنتات الأسئلة</a><a href="#summary" data-jump="s-gloss">المصطلحات</a><a href="#summary" data-jump="s-fix">تصحيح الامتحانات</a></nav>`;
  // 1 numbers
  h+=`<h2 class="sum" id="s-num">1. الأرقام اللي لازم تحفظها</h2><section class="topic"><div class="tbl"><table><tbody>${H.numbers.map(r=>`<tr><td class="ans">${esc(r[0])}</td><td>${fmt(r[1])}</td></tr>`).join('')}</tbody></table></div></section>`;
  // 2 traps
  h+=`<h2 class="sum" id="s-trap">2. الفخاخ المشهورة</h2><section class="topic"><p class="lesson">الحاجات اللي الامتحان بيبدّلها عشان يوقعك. لو شفت واحدة منهم ركّز في الكلمة.</p><ul class="traps">${H.traps.map(t=>`<li><b>${esc(t[0])}</b><span>${fmt(t[1])}</span></li>`).join('')}</ul></section>`;
  // 3 comparisons
  const lecTables=[];LEC.forEach(l=>l.secs.forEach(sc=>{if(sc[2]&&sc[2].h&&/vs|Split|join|InputFormat|مميزات|Good/i.test(sc[0]+sc[2].h.join('')))lecTables.push({t:sc[0],h:sc[2].h,r:sc[2].r});}));
  h+=`<h2 class="sum" id="s-cmp">3. جداول المقارنة</h2>${lecTables.concat(H.compare).map(c=>`<section class="topic"><h3 class="en">${fmt(c.t)}</h3>${tableHTML(c)}</section>`).join('')}`;
  // 4 per lecture topic points + keyword hints
  h+=LEC.map(l=>`<h2 class="sum" id="s-l${l.n}">4.${l.n} أهم نقط Lecture ${l.n}</h2>`+l.topics.map(k=>{const t=T[k];if(!t)return'';return `<section class="topic"><h3 class="en">${esc(t.title)}</h3><p class="lesson">${fmt(t.lesson)}</p>
    <h4>أهم النقط مشروحة</h4><ul class="points">${t.points.map(p=>`<li><span class="term">${fmt(p[0])}</span><span>${fmt(p[1])}</span></li>`).join('')}</ul>
    <h4>لو شفت الكلمة دي في السؤال ← اختار</h4><div class="tbl"><table><thead><tr><th class="en">الكلمة في السؤال</th><th></th><th class="en">اختار</th></tr></thead><tbody>${t.hints.map(x=>`<tr><td class="en">${fmt(x[0])}</td><td class="arrow">←</td><td class="ans">${fmt(x[1])}</td></tr>`).join('')}</tbody></table></div></section>`;}).join('')).join('');
  // 5 all question hints with "why"
  const seen=new Set();
  const uniq=Q.filter(q=>{const k=q.q.trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  h+=`<h2 class="sum" id="s-qh">5. هنتات كل الأسئلة: اخترنا الإجابة دي ليه</h2><section class="topic"><p class="lesson">كل سؤال في البنك والكويزات (من غير تكرار)، مترتبين بالمحاضرة والموضوع: الإجابة، ليه اخترناها، والهنت اللي تفتكره بيه. دوس على أي موضوع يفتح.</p>`;
  LEC.forEach(l=>{l.topics.forEach(k=>{const qs=uniq.filter(q=>q.tp===k);if(!qs.length)return;
    h+=`<details class="qh"><summary>Lecture ${l.n} · ${esc(T[k].title)} (${qs.length})</summary><div class="tbl"><table><thead><tr><th class="en">Question</th><th class="en">Answer</th><th>اخترناها ليه</th><th>الهنت</th></tr></thead><tbody>${qs.map(q=>{
      let why=String(q.w[q.a]).replace(/^صح( حسب السلايد)?\s*[—-]?\s*/,'').replace(/^\.\s*/,'').trim();
      if(why.length<25){const ex=String(q.ex).replace(/\n/g,' ');const cut=ex.search(/\.\s/);why=(why?why+' ':'')+(cut>0&&cut<260?ex.slice(0,cut+1):ex.slice(0,240)+'…');}
      return `<tr><td class="en">${fmt(q.q.length>140?q.q.slice(0,137)+'…':q.q)}</td><td class="ans">${fmt(q.o[q.a])}</td><td class="why">${fmt(why)}</td><td class="hint">${fmt(q.tip)}</td></tr>`;}).join('')}</tbody></table></div></details>`;});});
  h+=`</section>`;
  // 6 glossary
  h+=`<h2 class="sum" id="s-gloss">6. أهم المصطلحات</h2><section class="topic"><div class="tbl"><table><tbody>${G.map(g=>`<tr><td class="en"><b>${esc(g[0])}</b></td><td class="en">${esc(g[1])}</td></tr>`).join('')}</tbody></table></div></section>`;
  // 7 corrections
  const E=C.exam2024||[];
  h+=`<h2 class="sum" id="s-fix">7. تصحيح إجابات الامتحانات من السلايدز</h2><section class="topic">
   <h4>امتحان الميد Fall 2024 (12-11-2024)</h4><p class="note">${E.filter(e=>e[2]).length} من ${E.length} من الإجابات المتعلّمة في الورقة صح حسب السلايدز. سؤال 15 بس مختلف. الامتحان كامل في Quiz 1.</p><div class="tbl"><table><thead><tr><th>#</th><th class="en">المتعلّم في الورقة</th><th></th></tr></thead><tbody>${E.map(e=>`<tr><td class="en">${e[0]}</td><td class="en">${esc(e[1])}</td><td><span class="pill ${e[2]?'ok':'bad'}">${e[2]?'صح':'غلط'}</span></td></tr>`).join('')}</tbody></table></div>
   <h4 style="margin-top:14px">أسئلة True / False من ملف أسئلة الكتاب</h4><div class="tbl"><table><tbody>${C.bookTF.map(r=>`<tr><td class="en">${esc(r[0])}</td><td><span class="pill ${r[1]==='True'?'ok':'bad'}">${r[1]}</span></td><td class="note">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
   <h4 style="margin-top:14px">أسئلة Hive و Spark من ملف الكتاب</h4><p class="note">مش موجودة في سلايدات الميد (Lectures 1–5). الإجابات دي من معرفة عامة بـ Hive و Spark مش من السلايدز.</p><div class="tbl"><table><tbody>${C.bookOther.map(r=>`<tr><td class="en">${esc(r[0])}</td><td class="ans">${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></section>`;
  document.getElementById('summary').innerHTML=h;
}

/* ---------- shell ---------- */
function renderTop(){
  let r=0,rev=0,a=0;SETS.forEach(st=>{const s=setStats(st.n);if(s.rev){rev+=s.tot;r+=s.r;}a+=s.a;});
  document.getElementById('overall').innerHTML=rev?`السكور الكلي: <strong>${r}</strong> / ${rev}`:`جاوبت <strong>${a}</strong> / ${Q.length}`;
  document.getElementById('flagCount').textContent=Object.keys(S.flags).filter(k=>S.flags[k]).length;
}
const done={lectures:false,summary:false};
function render(){
  const t=tabName(), v=(t==='quiz'||t==='exam')?'exam':t;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===t?'page':'false'));
  ['exam','lectures','summary','review'].forEach(x=>document.getElementById('v-'+x).hidden=x!==v);
  if(v==='exam')renderPractice();else if(v==='review')renderReview();
  else if(!done[v]){(v==='lectures'?renderLectures:renderSummary)();done[v]=true;}
  renderTop();
}
function keepPos(id,fn){const el=document.getElementById('q-'+id);const top=el?el.getBoundingClientRect().top:null;fn();const el2=document.getElementById('q-'+id);if(el2&&top!==null)window.scrollBy(0,el2.getBoundingClientRect().top-top);}
function setCur(n){if(tabName()==='quiz')S.qset=n;else S.set=n;}

document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o&&!o.disabled){const id=+o.dataset.q,v=+o.dataset.o;if(S.ans[id]===v)delete S.ans[id];else S.ans[id]=v;save();keepPos(id,render);return;}
  const f=e.target.closest('[data-flag]');
  if(f){const id=+f.dataset.flag;if(S.flags[id])delete S.flags[id];else S.flags[id]=true;save();keepPos(id,render);return;}
  const b=e.target.closest('.blk');
  if(b){setCur(+b.dataset.set);save();render();document.getElementById('setTitle').scrollIntoView({block:'start'});window.scrollBy(0,-80);return;}
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act,n=curSet();
    if(a==='submit'){S.rev[n]=true;save();render();document.getElementById('scorebar').scrollIntoView({block:'center'});}
    else if(a==='retry'){bySet(n).forEach(q=>delete S.ans[q.id]);delete S.rev[n];delete S.qstart[n];S.mode='exam';save();render();window.scrollTo(0,0);}
    else if(a==='next'){setCur(+act.dataset.n);save();render();window.scrollTo(0,0);}
    else if(a==='timer'){S.qstart[n]=Date.now();S.mode='exam';save();render();}
    return;}
  const fb=e.target.closest('#filters button');
  if(fb){S.rf=fb.dataset.f;save();render();return;}
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({block:'start'});return;}
});
['Exam','Practice','Show'].forEach(m=>document.getElementById('m'+m).onclick=()=>{S.mode=m.toLowerCase();save();render();});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
setInterval(()=>{
  if(tabName()!=='quiz')return;const n=S.qset;if(S.rev[n])return;const rem=remaining(n);if(rem===null)return;
  if(rem<=0){S.rev[n]=true;save();render();return;}
  const el=document.getElementById('timer');if(el){el.textContent=mmss(rem);el.classList.toggle('low',rem<300000);}
},1000);
render();
})();
</script>
